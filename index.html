7\uFF0C\u7B2C 1 \u7EA7\uFF09\u3002",tip:"\u9898\u76EE\u8981\u51E0\u4E2A\u5C31\u5199\u51E0\u4E2A\uFF0C\u6BCF\u4E2A\u90FD\u5199\u6E05\u695A\u540D\u79F0\u3002"},define:{words:[],need:0,what:"Define = \u8BF4\u660E\u4E00\u4E2A\u8BCD\u7684\u610F\u601D\uFF08p.7\uFF0C\u7B2C 1 \u7EA7\uFF09\u3002",tip:"\u4E00\u53E5\u8BDD\u8BF4\u6E05\u695A\u610F\u601D\uFF0C\u518D\u52A0\u4E00\u4E2A\u4F8B\u5B50\u4F1A\u66F4\u7A33\u3002"}},Pa=["\u89C2\u70B9 Point","\u8BC1\u636E Evidence","\u89E3\u91CA Explain","\u56DE\u6263 Link"];Wa={explain:{what:"Explain = show how or why; give causes and effects (p.8, Level 2).",tip:"Find a sentence that only says what happened. Ask 'Why? What was the result?', then add your own explanation with because / as a result / this means."},analyse:{what:"Analyse = break into parts and show how they connect (p.9, Level 3).",tip:"For every technique, answer two questions: how does the reader feel, and why did the composer use it here?"},assess:{what:"Assess = make a judgement of value, size or quality (p.9, Level 3).",tip:"You need three things: what it is useful for; its limits (who made it, when, why, for whom); and a clear final judgement."},discuss:{what:"Discuss = give points for and against (p.9, Level 3).",tip:"Check you wrote the other side: start a sentence with However / On the other hand, then give your own view at the end."},describe:{what:"Describe = give the features or characteristics (p.7, Level 1).",tip:"Add specific features (what people did, ate, believed), each with a concrete detail."},outline:{what:"Outline = give the main points without detail (p.7, Level 1).",tip:"Write three clear points in order. No long explanation needed."},identify:{what:"Identify = recognise and name (p.7, Level 1).",tip:"Give as many as the question asks, each named clearly."},define:{what:"Define = state what something means (p.7, Level 1).",tip:"One clear sentence on the meaning. An example makes it stronger."}},Xf=["afraid","fear","scared","worried","worry","hope","pray","tired","hungry","cold","proud","angry","sad","grateful","exhausted","terrified"],Gf=["murder","body","stolen","theft","missing","blood","crime","victim","detective","police","suspect","dead","robbery","poison","scream"],Jf=["dark","storm","rain","shadow","night","fog","mist","cold","silent","silence","thunder","wind","gloom","flicker"],$a=/\b1[0-9]{3}\b/,Zf=/[\x22“][^\x22”]{3,}[\x22”]/,vg=/[\x22“][^\x22”]{3,}[\x22”]/g;ri={verbs:[{id:"v1",q:"Which verb means: make a judgement of value, size or quality?",opts:["Assess","Describe","Outline","Identify"],a:0,ex:"Assess is Level 3 (p.9). Your answer must include a judgement, such as how useful or how important something is."},{id:"v2",q:"Which verb means: show how or why; give causes and effects?",opts:["Explain","Describe","Define","Recall"],a:0,ex:"Explain is Level 2 (p.8). Describe only gives features; Explain must say WHY or HOW."},{id:"v3",q:"Which verb means: break into parts and show how they connect?",opts:["Analyse","Summarise","Classify","Outline"],a:0,ex:"Analyse is Level 3 (p.9). In English, that means technique, then effect, then why the composer used it."},{id:"v4",q:"Which verb means: show how things are alike AND different?",opts:["Compare","Contrast","Distinguish","Describe"],a:0,ex:"Compare covers both similarities and differences. Contrast covers only differences (p.8)."},{id:"v5",q:"Which verb means: show how things are different (only)?",opts:["Contrast","Compare","Summarise","Apply"],a:0,ex:"Contrast covers differences only. Compare covers both (p.8)."},{id:"v6",q:"Which verb means: give the features or characteristics?",opts:["Describe","Explain","Evaluate","Justify"],a:0,ex:"Describe is Level 1 (p.7). You don't need causes, just clear features."},{id:"v7",q:"Which verb means: give the main points without detail?",opts:["Outline","Analyse","Discuss","Interpret"],a:0,ex:"Outline is Level 1 (p.7). Give short main points in order."},{id:"v8",q:"Which verb means: give points for and against?",opts:["Discuss","Identify","Recall","Calculate"],a:0,ex:"Discuss is Level 3 (p.9). Write both sides, then give your view."},{id:"v9",q:"Which verb means: judge strengths and weaknesses, then decide?",opts:["Evaluate","Describe","Define","Outline"],a:0,ex:"Evaluate is Level 3 (p.9). Strengths, then weaknesses, then a decision."},{id:"v10",q:"Which verb means: support an answer with reasons and evidence?",opts:["Justify","Recall","Classify","Identify"],a:0,ex:"Justify is Level 3 (p.9). Every reason needs evidence."},{id:"v11",q:"Which verb means: draw meaning from a source, graph or text?",opts:["Interpret","Calculate","Recall","Classify"],a:0,ex:"Interpret is Level 2 (p.8)."},{id:"v12",q:"Which verb means: recognise and name?",opts:["Identify","Evaluate","Analyse","Justify"],a:0,ex:"Identify is Level 1 (p.7). Give a name, not an explanation."},{id:"v13",q:"Which level is 'Assess'?",opts:["Level 3: think and judge","Level 2: show you understand","Level 1: show what you know"],a:0,ex:"Level 3 questions almost always need a judgement (p.9 tip)."},{id:"v14",q:"Which level is 'Explain'?",opts:["Level 2: show you understand","Level 1: show what you know","Level 3: think and judge"],a:0,ex:"Explain is Level 2 (p.8)."},{id:"v15",q:"History Q6 says 'Assess the usefulness of a medieval painting\u2026'. What must your answer include?",opts:["A judgement of how useful it is, backed by evidence","Only a description of the painting","A list of medieval facts","The painting's price"],a:0,ex:"Assess = make a judgement (p.9). Say what it shows well, what it can't show, then decide."},{id:"v16",q:"How much should you write for a 2 mark question?",opts:["About two points","One word","A full essay","Several PEEL paragraphs"],a:0,ex:"p.14: a 2 mark question needs about two points. A 6 mark question needs a full PEEL answer or more."},{id:"v17",q:"For 4 to 5 marks, what does the marker expect?",opts:["A detailed explanation with evidence, linked back to the question","One correct fact","A single definition","A list of key words"],a:0,ex:"p.23 'Match your answer to the marks'."}],history:[{id:"h1",q:"A primary source is\u2026",opts:["A source from the time being studied","A source made later about the past","The most important source","A history textbook"],a:0,ex:"p.36: primary sources come from the time; secondary sources were made later."},{id:"h2",q:"Put the feudal system in order, from top to bottom.",opts:["King \u2192 nobles \u2192 knights \u2192 peasants","Nobles \u2192 king \u2192 peasants \u2192 knights","King \u2192 knights \u2192 nobles \u2192 peasants","Peasants \u2192 knights \u2192 nobles \u2192 king"],a:0,ex:"The king gave land to nobles, nobles gave land to knights, and peasants worked the land (p.36)."},{id:"h3",q:"What did nobles give the king in return for land?",opts:["Loyalty and soldiers","Spices from the Holy Land","Books from monasteries","Nothing"],a:0,ex:"p.36: land in return for loyalty and soldiers."},{id:"h4",q:"What did peasants receive in return for working the land?",opts:["Protection","Their own castle","A knighthood","Freedom to move anywhere"],a:0,ex:"p.36: peasants worked the land in return for protection."},{id:"h5",q:"What was the training path to become a knight?",opts:["Page \u2192 squire \u2192 knight","Squire \u2192 page \u2192 knight","Monk \u2192 squire \u2192 knight","Serf \u2192 page \u2192 knight"],a:0,ex:"p.36: boys trained as a page, then a squire, then a knight."},{id:"h6",q:"Knights followed a code of ______.",keys:[["chivalr"]],show:"chivalry",ex:"p.36: knights followed a code of chivalry."},{id:"h7",q:"What did castles do?",opts:["Protected lords and controlled the land around them","Mainly served as churches","Stored the Pope's money","Housed peasants for free"],a:0,ex:"p.36 'Knights and castles'."},{id:"h8",q:"When were the Crusades?",opts:["1096 to 1291","1347 to 1351","1066 to 1096","1291 to 1347"],a:0,ex:"p.36: the Crusades (1096 to 1291) were wars for control of the Holy Land."},{id:"h9",q:"Apart from war, what result of the Crusades does the Study Guide name?",opts:["They expanded trade","They ended the feudal system","They stopped the Black Death","They removed the Pope"],a:0,ex:"p.36: the Crusades expanded trade. A specific effect like this makes good evidence."},{id:"h10",q:"In which year did the Black Death reach Europe?",num:1347,show:"1347",ex:"p.36. Dates are strong evidence. Use them in History paragraphs."},{id:"h11",q:"About how many of Europe's people did the Black Death kill?",opts:["Between a third and a half","About one in a hundred","About one in ten","Almost nobody"],a:0,ex:"p.36: between a third and a half of its people."},{id:"h12",q:"Which was the most powerful institution in medieval Europe?",opts:["The Church","The army","The guilds","The merchants"],a:0,ex:"p.36 'The Church'."},{id:"h13",q:"What was the payment people made to the Church called?",keys:[["tithe"]],show:"tithes",ex:"p.36: people paid tithes."},{id:"h14",q:"Which fact best shows the Church had power over rulers?",opts:["The Pope could excommunicate even kings","Churches had bells","Monks wore simple robes","People prayed on Sundays"],a:0,ex:"p.36. A fact like this can be your evidence, but you still have to explain WHY it shows power."},{id:"h15",q:"Who kept learning alive in medieval Europe?",opts:["Monasteries","Knights","Serfs","Castles"],a:0,ex:"p.36: monasteries kept learning alive."},{id:"h16",q:"A serf was\u2026",opts:["A peasant tied to the lord's land","A trained knight","A Church official","A trader"],a:0,ex:"p.36 'Life on the manor'."},{id:"h17",q:"Before judging a source, what four questions does the Study Guide say to ask?",opts:["Who made it, when, why and for whom","How big, how old, how much, how many","Is it famous, colourful, long, expensive","Where is it kept and who owns it now"],a:0,ex:"p.36. Then judge how useful and reliable it is. This is what Q6 tests."},{id:"h18",q:"What makes empathy writing (the diary question) score well?",opts:["Accurate detail about work, food, beliefs and fears, and how events affected the person","Modern slang so it sounds real","Lots of feelings with no facts","Made-up kings and dates"],a:0,ex:"p.36 'Empathy writing'."}],english:[{id:"e1",q:"Which of these is a convention of crime fiction?",opts:["Red herrings","A fairy godmother","A spaceship battle","A musical number"],a:0,ex:"p.24 lists the conventions: a crime, victim, detective, suspects, clues, red herrings, motive, means and opportunity, an investigation and a final reveal."},{id:"e2",q:"What is the purpose of a red herring?",opts:["To mislead the reader with a false clue","To reveal the culprit early","To describe the weather","To end the story"],a:0,ex:"p.24 'Writing your own': mislead with at least one red herring. It keeps the reader guessing."},{id:"e3",q:"Which is NOT one of the suspense techniques on p.24?",opts:["A long, cheerful summary of what happened","Foreshadowing","Cliffhangers","Withheld information"],a:0,ex:"p.24 'Building suspense': foreshadowing, withheld information, short sentences, cliffhangers, dramatic irony, an unreliable narrator, and a dark or stormy setting."},{id:"e4",q:"Dramatic irony is when\u2026",opts:["The reader knows something a character does not","A character tells a joke","The weather changes","Two characters argue"],a:0,ex:"Tension builds because we can see danger the character can't."},{id:"e5",q:"Why does an unreliable narrator build suspense?",opts:["The reader cannot fully trust what they are told","They speak in short sentences","They always solve the crime","They are always the victim"],a:0,ex:"Doubt keeps the reader guessing."},{id:"e6",q:"Why might a composer use a dark or stormy setting?",opts:["To mirror the mood","Only to show the season","To fill space","To introduce the sidekick"],a:0,ex:"p.24. In Q4, explain HOW the setting creates mood and what the reader feels."},{id:"e7",q:"What is the usual structure of a crime story?",opts:["Crime \u2192 investigation \u2192 complications \u2192 climax reveal \u2192 resolution","Resolution \u2192 crime \u2192 climax \u2192 investigation","Climax \u2192 crime \u2192 resolution \u2192 investigation","Investigation \u2192 resolution \u2192 crime \u2192 climax"],a:0,ex:"p.24 'Structure'."},{id:"e8",q:"Which is a crime subgenre named in the Study Guide?",opts:["The police procedural","The fairy tale","The space opera","The romantic comedy"],a:0,ex:"p.24: classic whodunnit, hardboiled detective story, police procedural, and forensic or legal thriller."},{id:"e9",q:"Which qualities are detectives usually given?",opts:["Observant, logical, persistent and often flawed","Lazy, careless and perfect","Silent and never seen","Always the villain"],a:0,ex:"p.24 'The detective'. Useful for Q3, but you still need evidence from YOUR text."},{id:"e10",q:"Why does a sidekick like Dr Watson often narrate?",opts:["So the reader learns clues at the same pace","So the detective seems less clever","To make the story shorter","Because the detective can't speak"],a:0,ex:"p.24 'The detective'."},{id:"e11",q:"Crime fiction reflects what a society thinks about\u2026",opts:["Justice, law, and right and wrong","Fashion and food","Sport","Holidays"],a:0,ex:"p.24 'Context'. This is the core idea for Q6."},{id:"e12",q:"Which writer is named as part of crime fiction's history in the 1800s?",opts:["Edgar Allan Poe","Roald Dahl","J.K. Rowling","Dr Seuss"],a:0,ex:"p.24: from Edgar Allan Poe and Sherlock Holmes in the 1800s to modern crime TV."},{id:"e13",q:"In an analysis answer, what earns the marks?",opts:["Explaining the effect on the reader and why the composer used the technique","Naming as many devices as possible","Retelling the plot","Saying whether you liked it"],a:0,ex:"p.25 'Aim for an A': naming a device earns little. Explaining why the composer used it earns the marks."},{id:"e14",q:"Motive, means and opportunity are\u2026",opts:["Things the detective must work out about a suspect","Three subgenres","Types of narrator","Parts of the resolution"],a:0,ex:"Listed among the conventions on p.24: a reason, a way and a chance to commit the crime."},{id:"e15",q:"Type ONE suspense technique from the p.24 list.",keys:[["foreshadow","withheld","withholding","shortsentence","cliffhanger","dramaticirony","unreliable","stormy","darksetting","setting"]],show:"e.g. foreshadowing, cliffhanger, dramatic irony",ex:"In your paragraph, always add the effect on the reader."}],science:[{id:"s1",q:"The independent variable is\u2026",opts:["What you change","What you measure","What stays the same","The conclusion"],a:0,ex:"p.32 'Working scientifically'."},{id:"s2",q:"Testing how ramp height affects how far a toy car rolls: the dependent variable is\u2026",opts:["How far the car rolls","The ramp height","The type of car","The surface"],a:0,ex:"What you measure = dependent (p.32). Ramp height = independent."},{id:"s3",q:"Why repeat trials?",opts:["To make results reliable","To change the variable","To get a different answer","To save time"],a:0,ex:"p.32."},{id:"s4",q:"A globe uses 100 J of electrical energy and gives out 20 J of light. Efficiency in %?",num:20,show:"20%",ex:"Efficiency = useful energy out \xF7 total energy in \xD7 100% = 20 \xF7 100 \xD7 100% (p.32\u201333)."},{id:"s5",q:"A kettle uses 2000 J and transfers 1500 J usefully into the water. Efficiency in %?",num:75,show:"75%",ex:"1500 \xF7 2000 \xD7 100% = 75%."},{id:"s6",q:"Energy is\u2026",opts:["Transformed, never created or destroyed","Created by batteries","Destroyed when used","Only found in food"],a:0,ex:"p.32 'Energy and efficiency'."},{id:"s7",q:"Which structures are in plant cells but NOT animal cells?",opts:["Cell wall and chloroplasts","Nucleus and cytoplasm","Cell membrane and mitochondria","Nucleus and membrane"],a:0,ex:"p.32: plant cells also have a cell wall, chloroplasts and a large vacuole."},{id:"s8",q:"In which state do particles vibrate in fixed positions?",opts:["Solid","Liquid","Gas"],a:0,ex:"p.32: in liquids they slide pas
