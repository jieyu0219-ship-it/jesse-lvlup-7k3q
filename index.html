ike a creature ready to grab","The house is by the sea","The house is modern and welcoming","Holmes likes seafood"],"Setting is made predatory, matching Roylott; it builds a sinister atmosphere.","\u623F\u5B50\u50CF\u8981\u201C\u5939\u4F4F\u201D\u4EBA\u7684\u751F\u7269\u2014\u2014\u8BBE\u7F6E\u4E5F\u53D8\u6210\u4E86\u5A01\u80C1\uFF0C\u4E0E\u7F57\u4F0A\u6D1B\u7279\u547C\u5E94\uFF0C\u8425\u9020\u9634\u68EE\u6C14\u6C1B\u3002",["\u4E0D\u662F\u5199\u5730\u70B9 \xB7 Not about location.","\u6B63\u76F8\u53CD \xB7 Opposite.","\u4E0D\u76F8\u5173 \xB7 Irrelevant."]),T("sx9","'Some scaffolding had been erected against the end wall\u2026 but there were no signs of any workmen.' A careful reader sees this as\u2026","\u201C\u5899\u8FB9\u642D\u4E86\u811A\u624B\u67B6\u2026\u2026\u5374\u6CA1\u6709\u5DE5\u4EBA\u201D\u3002\u7EC6\u5FC3\u7684\u8BFB\u8005\u4F1A\u628A\u5B83\u770B\u4F5C\u2026\u2026",["A clue: the 'repairs' are an excuse to move Helen into Julia's room","Proof the house is being sold","A sign the gipsies live there","Irrelevant detail"],"Composers plant clues in descriptions. Ask: why mention this?","\u4F5C\u8005\u5E38\u628A\u7EBF\u7D22\u85CF\u5728\u63CF\u5199\u91CC\u3002\u95EE\u81EA\u5DF1\uFF1A\u4E3A\u4EC0\u4E48\u8981\u63D0\u8FD9\u4E2A\uFF1F\u2014\u2014\u201C\u4FEE\u623F\u5B50\u201D\u662F\u8BA9\u6D77\u4F26\u642C\u8FDB\u59D0\u59D0\u623F\u95F4\u7684\u501F\u53E3\u3002",["\u6587\u4E2D\u6CA1\u63D0\u5356\u623F \xB7 Not stated.","\u5409\u666E\u8D5B\u4EBA\u4F4F\u5728\u5916\u9762 \xB7 Not there.","\u72AF\u7F6A\u5C0F\u8BF4\u91CC\u63CF\u5199\u7EC6\u8282\u5E38\u6709\u7528 \xB7 Details matter."]),T("sx10","'How shall I ever forget that dreadful vigil?' The rhetorical question\u2026","\u201C\u6211\u600E\u80FD\u5FD8\u8BB0\u90A3\u53EF\u6015\u7684\u5B88\u591C\uFF1F\u201D\u8FD9\u4E2A\u53CD\u95EE\u53E5\u2026\u2026",["Signals to the reader that something terrible is coming and draws them in","Asks Holmes for help","Shows Watson forgot","Ends the story"],"Retrospective first-person narration + rhetorical question = foreshadowing and suspense.","\u56DE\u987E\u5F0F\u7B2C\u4E00\u4EBA\u79F0\u53D9\u8FF0 + \u53CD\u95EE \u2192 \u6697\u793A\u540E\u9762\u4F1A\u53D1\u751F\u53EF\u6015\u7684\u4E8B\uFF0C\u5438\u5F15\u8BFB\u8005\uFF08\u4F0F\u7B14\u3001\u60AC\u5FF5\uFF09\u3002",["\u4E0D\u662F\u5728\u6C42\u52A9 \xB7 Not asking for help.","\u6B63\u76F8\u53CD\uFF0C\u4ED6\u5FD8\u4E0D\u4E86 \xB7 He can't forget.","\u6545\u4E8B\u6CA1\u7ED3\u675F \xB7 Not the end."]),T("sx11","'Twelve struck, and one and two and three, and still we sat waiting\u2026' The listing of the hours\u2026","\u201C\u6572\u4E86\u5341\u4E8C\u70B9\uFF0C\u7136\u540E\u4E00\u70B9\u3001\u4E24\u70B9\u3001\u4E09\u70B9\uFF0C\u6211\u4EEC\u4ECD\u7136\u5750\u7740\u7B49\u2026\u2026\u201D\u5217\u4E3E\u65F6\u95F4\u2026\u2026",["Slows the pace and stretches the tension","Speeds up the action","Shows the clock is broken","Is a red herring"],"Listing + 'and\u2026and' (polysyndeton) makes time drag, so the reader waits too.","\u5217\u4E3E + \u8FDE\u7528 and\uFF0C\u8BA9\u65F6\u95F4\u663E\u5F97\u6F2B\u957F\uFF0C\u8BFB\u8005\u4E5F\u8DDF\u7740\u201C\u7B49\u201D\uFF0C\u7D27\u5F20\u611F\u88AB\u62C9\u957F\u3002",["\u76F8\u53CD\uFF0C\u8282\u594F\u53D8\u6162 \xB7 It slows down.","\u949F\u6CA1\u574F \xB7 Not broken.","\u4E0D\u662F\u8BEF\u5BFC \xB7 Not misleading."]),T("sx12","'\u2026a very gentle, soothing sound, like that of a small jet of steam escaping continually from a kettle.' Why is this effective?","\u201C\u50CF\u6C34\u58F6\u91CC\u4E0D\u65AD\u5192\u51FA\u7684\u4E00\u5C0F\u80A1\u84B8\u6C7D\u201D\u2014\u2014\u4E3A\u4EC0\u4E48\u6709\u6548\uFF1F",["A homely, gentle simile contrasts with the deadly danger, making it creepier","It shows they are making tea","It is pathetic fallacy","It explains the solution"],"Ordinary comparison + deadly threat = unsettling contrast (the hiss of the snake).","\u6E29\u548C\u65E5\u5E38\u7684\u6BD4\u55BB vs \u81F4\u547D\u5371\u9669 \u2192 \u53CD\u5DEE\u8BA9\u4EBA\u66F4\u4E0D\u5B89\uFF08\u5176\u5B9E\u662F\u86C7\u7684\u5636\u5636\u58F0\uFF09\u3002",["\u4ED6\u4EEC\u6CA1\u5728\u6CE1\u8336 \xB7 No tea.","\u4E0D\u662F\u5929\u6C14 \xB7 Not weather.","\u8FD8\u6CA1\u63ED\u6653 \xB7 Not yet explained."]),T("sx13","'You see it, Watson? \u2026 You see it?' But Watson 'saw nothing'. This creates suspense because\u2026","\u970D\u59C6\u65AF\u558A\u201C\u4F60\u770B\u89C1\u4E86\u5417\uFF1F\u201D\u534E\u751F\u5374\u4EC0\u4E48\u90FD\u6CA1\u770B\u89C1\u3002\u8FD9\u5236\u9020\u60AC\u5FF5\u662F\u56E0\u4E3A\u2026\u2026",["Information is withheld: the reader, like Watson, cannot see the threat","Holmes is lying","Watson is the villain","It is a joke"],"Watson as narrator limits what we know: withheld information keeps us guessing.","\u534E\u751F\u662F\u53D9\u8FF0\u8005\uFF0C\u4ED6\u770B\u4E0D\u89C1\uFF0C\u8BFB\u8005\u4E5F\u770B\u4E0D\u89C1\u2014\u2014\u4FE1\u606F\u88AB\u9690\u85CF\uFF08withheld\uFF09\uFF0C\u60AC\u5FF5\u6301\u7EED\u3002",["\u970D\u59C6\u65AF\u6CA1\u6492\u8C0E \xB7 Not lying.","\u534E\u751F\u4E0D\u662F\u53CD\u6D3E \xB7 Not the villain.","\u4E0D\u662F\u73A9\u7B11 \xB7 Not a joke."]),T("sx14","'a hoarse yell of pain and fear and anger all mingled in the one dreadful shriek' The listing of emotions\u2026","\u201C\u75DB\u82E6\u3001\u6050\u60E7\u548C\u6124\u6012\u6DF7\u5728\u4E00\u58F0\u53EF\u6015\u7684\u5C16\u53EB\u91CC\u201D\u5217\u4E3E\u60C5\u7EEA\u2026\u2026",["Intensifies the horror of the climax","Calms the reader","Introduces a new suspect","Describes the spring"],"Listing builds to a climax; auditory imagery lets the reader 'hear' it.","\u5217\u4E3E\u5C42\u5C42\u53E0\u52A0\uFF0C\u63A8\u5411\u9AD8\u6F6E\uFF1B\u542C\u89C9\u610F\u8C61\u8BA9\u8BFB\u8005\u4EFF\u4F5B\u201C\u542C\u89C1\u201D\u3002",["\u6B63\u76F8\u53CD \xB7 Opposite.","\u6CA1\u6709\u65B0\u5ACC\u7591\u4EBA \xB7 No new suspect.","\u4E0D\u662F\u6625\u5929 \xB7 Not spring."]),T("sx15","'The band! the speckled band!' whispered Holmes. Repeating Julia's dying words here\u2026","\u970D\u59C6\u65AF\u4F4E\u58F0\u8BF4\u201CThe band! the speckled band!\u201D\u2014\u2014\u91CD\u590D\u6731\u8389\u5A05\u4E34\u7EC8\u7684\u8BDD\u2026\u2026",["Solves the mystery and links the ending back to the beginning (circular structure)","Introduces a new mystery","Is a red herring","Shows Holmes is confused"],"Echoing the clue at the climax = satisfying resolution.","\u5728\u9AD8\u6F6E\u5904\u547C\u5E94\u5F00\u5934\u7684\u7EBF\u7D22 \u2192 \u9996\u5C3E\u547C\u5E94\uFF0C\u8C1C\u5E95\u63ED\u5F00\uFF0C\u8BFB\u8005\u6709\u6EE1\u8DB3\u611F\u3002",["\u8FD9\u662F\u89E3\u5F00\u8C1C\u56E2 \xB7 It solves it.","\u8FD9\u662F\u771F\u76F8\u4E0D\u662F\u8BEF\u5BFC \xB7 It's the truth.","\u4ED6\u5F88\u6E05\u695A \xB7 He understands."]),T("sx16","'Violence does, in truth, recoil upon the violent, and the schemer falls into the pit which he digs for another.' This shows the convention of\u2026","\u201C\u66B4\u529B\u7EC8\u5C06\u53CD\u566C\u65BD\u66B4\u8005\uFF0C\u5BB3\u4EBA\u8005\u81EA\u6398\u575F\u5893\u3002\u201D\u8FD9\u4F53\u73B0\u4E86\u54EA\u4E2A\u60EF\u4F8B\uFF1F",["Justice: the villain is punished and order is restored","A red herring","A locked-room setup","The hardboiled detective"],"Crime fiction usually ends with justice. Here it is poetic justice: his own weapon kills him.","\u6B63\u4E49\uFF08justice\uFF09\uFF1A\u53CD\u6D3E\u53D7\u5230\u60E9\u7F5A\uFF0C\u79E9\u5E8F\u6062\u590D\u3002\u8FD9\u91CC\u662F\u201C\u8BD7\u610F\u7684\u6B63\u4E49\u201D\uFF1A\u4ED6\u88AB\u81EA\u5DF1\u7684\u6B66\u5668\u6740\u6B7B\u3002",["\u4E0D\u662F\u8BEF\u5BFC \xB7 Not misleading.","\u5BC6\u5BA4\u662F\u8BBE\u5B9A\uFF0C\u4E0D\u662F\u7ED3\u5C40 \xB7 Locked room is the set-up.","\u786C\u6C49\u6D3E\u662F\u53E6\u4E00\u4E2A\u5B50\u7C7B\u578B \xB7 A different subgenre."])],Dr=[{t:"Helen Stoner arrives at Baker Street",z:"\u6D77\u4F26\u6765\u5230\u8D1D\u514B\u8857",q:"How does Conan Doyle present Helen Stoner as a frightened victim in this extract?",zq:"\u67EF\u5357\xB7\u9053\u5C14\u5982\u4F55\u628A\u6D77\u4F26\u5851\u9020\u6210\u4E00\u4E2A\u6050\u60E7\u7684\u53D7\u5BB3\u8005\uFF1F",focus:["dialogue","repetition","simile","characterisation","contrast"],text:["\u201CGood-morning, madam,\u201D said Holmes cheerily. \u201CMy name is Sherlock Holmes. This is my intimate friend and associate, Dr. Watson, before whom you can speak as freely as before myself. Ha! I am glad to see that Mrs. Hudson has had the good sense to light the fire. Pray draw up to it, and I shall order you a cup of hot coffee, for I observe that you are shivering.\u201D","\u201CIt is not cold which makes me shiver,\u201D said the woman in a low voice, changing her seat as requested.","\u201CWhat, then?\u201D","\u201CIt is fear, Mr. Holmes. It is terror.\u201D She raised her veil as she spoke, and we could see that she was indeed in a pitiable state of agitation, her face all drawn and grey, with restless frightened eyes, like those of some hunted animal. Her features and figure were those of a woman of thirty, but her hair was shot with premature grey, and her expression was weary and haggard. Sherlock Holmes ran her over with one of his quick, all-comprehensive glances.","\u201CYou must not fear,\u201D said he soothingly, bending forward and patting her forearm. \u201CWe shall soon set matters right, I have no doubt. You"]},{t:"The night Julia died",z:"\u6731\u8389\u5A05\u53BB\u4E16\u7684\u90A3\u4E00\u591C",q:"How does the composer build suspense and tension in this extract?",zq:"\u4F5C\u8005\u5982\u4F55\u5728\u8FD9\u6BB5\u4E2D\u5236\u9020\u60AC\u5FF5\u548C\u7D27\u5F20\u611F\uFF1F",focus:["pathetic fallacy","sensory imagery","foreshadowing","short sentence","first person"],text:["\u201CI could not sleep that night. A vague feeling of impending misfortune impressed me. My sister and I, you will recollect, were twins, and you know how subtle are the links which bind two souls which are so closely allied. It was a wild night. The wind was howling outside, and the rain was beating and splashing against the windows. Suddenly, amid all the hubbub of the gale, there burst forth the wild scream of a terrified woman. I knew that it was my sister\u2019s voice. I sprang from my bed, wrapped a shawl round me, and rushed into the corridor. As I opened my door I seemed to hear a low whistle, such as my sister described, and a few moments later a clanging sound, as if a mass of metal had fallen. As I ran down the passage, my sister\u2019s door was unlocked, and revolved slowly upon its hinges. I stared at it horror-stricken, not knowing what was about to issue from it. By the light of the corridor-lamp I saw my sister appear at the opening, her face blanched with terror, her hands groping for help, her whole figure swaying to and fro like that of a drunkard. I ran to her and threw my arms round her, but at that moment her knees seemed to give way and she fell to the ground. She writhed as one who is in terrible pain, and her limbs were dreadfully convulsed. At first I thought that she had not recognised me, but as I bent over her she suddenly shrieked out in a voice which I shall never forget, \u2018Oh, my God! Helen! It was the band! The speckled band!\u2019 There was something else which she would fain have said, and she stabbed with her finger into the air in the direction of the Doctor\u2019s room, but a fresh convulsion seized her and choked her words. I rushed out, calling loudly for my stepfather, and I met him hastening from his room in his dressing-gown. When he reached my sister\u2019s side she was unconscious, and though he poured brandy down her throat and sent for medical aid from the village, all efforts were in vain, for she slowly sank and died without having recovered her consciousness. Such was the dreadful end of my beloved sister.\u201D"]},{t:"Dr Roylott bursts in",z:"\u7F57\u4F0A\u6D1B\u7279\u95EF\u8FDB\u6765",q:"How is Dr Grimesby Roylott presented as a threatening antagonist?",zq:"\u4F5C\u8005\u5982\u4F55\u628A\u7F57\u4F0A\u6D1B\u7279\u533B\u751F\u5851\u9020\u6210\u6709\u5A01\u80C1\u7684\u53CD\u6D3E\uFF1F",focus:["description","metaphor","animal imagery","dialogue","contrast"],text:["\u2026our door had been suddenly dashed open, and \u2026 a huge man had framed himself in the aperture. His costume was a peculiar mixture of the professional and of the agricultural, having a black top-hat, a long frock-coat, and a pair of high gaiters, with a hunting-crop swinging in his hand. So tall was he that his hat actually brushed the cross bar of the doorway, and his breadth seemed to span it across from side to side. A large face, seared with a thousand wrinkles, burned yellow with the sun, and marked with every evil passion, was turned from one to the other of us, while his deep-set, bile-shot eyes, and his high, thin, fleshless nose, gave him somewhat the resemblance to a fierce old bird of prey.","\u201CWhich of you is Holmes?\u201D asked this apparition.","\u201CMy name, sir; but you have the advantage of me,\u201D said my companion quietly.","\u201CI am Dr. Grimesby Roylott, of Stoke Moran.\u201D","\u201CIndeed, Doctor,\u201D said Holmes blandly. \u201CPray take a seat.\u201D","\u201CI will do nothing of the kind. My stepdaughter has been here. I have traced her. What has she been saying to you?\u201D","\u201CIt is a little cold for the time of the year,\u201D said Holmes.","\u201CWhat has she been saying to you?\u201D screamed the old man furiously."]},{t:"The drive through Surrey",z:"\u9A76\u8FC7\u8428\u91CC\u90E1\u7684\u4E61\u95F4",q:"How does Watson\u2019s description of the journey create contrast and hint at danger?",zq:"\u534E\u751F\u5BF9\u65C5\u9014\u7684\u63CF\u5199\u5982\u4F55\u5F62\u6210\u5BF9\u6BD4\u5E76\u6697\u793A\u5371\u9669\uFF1F",focus:["juxtaposition","imagery","foreshadowing","characterisation"],text:["At Waterloo we were fortunate in catching a train for Leatherhead, where we hired a trap at the station inn and drove for four or five miles through the lovely Surrey lanes. It was a perfect day, with a bright sun and a few fleecy clouds in the heavens. The trees and wayside hedges were just throwing out their first green shoots, and the air was full of the pleasant smell of the moist earth. To me at least there was a strange contrast between the sweet promise of the spring and this sinister quest upon which we were engaged. My companion sat in the front of the trap, his arms folded, his hat pulled down over his eyes, and his chin sunk upon his breast, buried in the deepest thought. Suddenly, however, he started, tapped me on the shoulder, and pointed over the meadows.","\u201CLook there!\u201D said he.","A heavily timbered park stretched up in a gentle slope, thickening into a grove at the highest point. From amid the branches there jutted out the grey gables and high roof-tree of a very old mansion."]},{t:"First sight of Stoke Moran",z:"\u521D\u89C1\u65AF\u6258\u514B\u83AB\u5170\u5E84\u56ED",q:"How does the description of the house create a sinister atmosphere?",zq:"\u5BF9\u623F\u5B50\u7684\u63CF\u5199\u5982\u4F55\u8425\u9020\u9634\u68EE\u7684\u6C14\u6C1B\uFF1F",focus:["simile","imagery","setting","atmosphere","clue"],text:["The building was of grey, lichen-blotched stone, with a high central portion and two curving wings, like the claws of a crab, thrown out on each side. In one of these wings the windows were broken and blocked with wooden boards, while the roof was partly caved in, a picture of ruin. The central portion was in little better repair, but the right-hand block was comparatively modern, and the blinds in the windows, with the blue smoke curling up from the chimneys, showed that this was where the family resided. Some scaffolding had been erected against the end wall, and the stone-work had been broken into, but there were no signs of any workmen at the moment of our visit. Holmes walked slowly up and down the ill-trimmed lawn and examined with deep attention the outsides of the windows.","\u201CThis, I take it, belongs to the room in which you used to sleep, the centre one to your sister\u2019s, and the one next to the main building to"]},{t:"The dreadful vigil",z:"\u53EF\u6015\u7684\u5B88\u591C",q:"How does Conan Doyle create tension during the vigil?",zq:"\u67EF\u5357\xB7\u9053\u5C14\u5982\u4F55\u5728\u5B88\u591C\u65F6\u5236\u9020\u7D27\u5F20\u611F\uFF1F",focus:["rhetorical question","sensory imagery","listing","pace","first person"],text:["Holmes had brought up a long thin cane, and this he placed upon the bed beside him. By it he laid the box of matches and the stump of a candle. Then he turned down the lamp, and we were left in darkness.","How shall I ever forget that dreadful vigil? I could not hear a sound, not even the drawing of a breath, and yet I knew that my companion sat open-eyed, within a few feet of me, in the same state of nervous tension in which I was myself. The shutters cut off the least ray of light, and we waited in absolute darkness.","From outside came the occasional cry of a night-bird, and once at our very window a long drawn catlike whine, which told us that the cheetah was indeed at liberty. Far away we could hear the deep tones of the parish clock, which boomed out every quarter of an hour. How long they seemed, those quarters! Twelve struck, and one and two and three, and still we sat waiting silently for whatever might befall."]},{t:"The attack in the dark",z:"\u9ED1\u6697\u4E2D\u7684\u88AD\u51FB",q:"How does the composer use sound and the senses to create horror?",zq:"\u4F5C\u8005\u5982\u4F55\u8FD0\u7528\u58F0\u97F3\u548C\u611F\u5B98\u63CF\u5199\u8425\u9020\u6050\u6016\u611F\uFF1F",focus:["sensory imagery","simile","dialogue","withheld information","climax"],text:["Suddenly there was the momentary gleam of a light up in the direction of the ventilator, which vanished immediately, but was succeeded by a strong smell of burning oil and heated metal. Someone in the next room had lit a dark-lantern. I heard a gentle sound of movement, and then all was silent once more, though the smell grew stronger. For half an hour I sat with straining ears. Then suddenly another sound became audible\u2014a very gentle, soothing sound, like that of a small jet of steam escaping continually from a kettle. The instant that we heard it, Holmes sprang from the bed, struck a match, and lashed furiously with his cane at the bell-pull.","\u201CYou see it, Watson?\u201D he yelled. \u201CYou see it?\u201D","But I saw nothing. At the moment when Holmes struck the light I heard a low, clear whistle, but the sudden glare flashing into my weary eyes made it impossible for me to tell what it was at which my friend lashed so savagely. I could, however, see that his face was deadly pale and filled with horror and loathing. He had ceased to strike and was gazing up at the ventilator when suddenly there broke from the silence of the night the most horrible cry to which I have ever listened. It swelled up louder and louder, a hoarse yell of pain and fear and anger all mingled in the one dreadful shriek. They say that away down in the village, and even in the distant parsonage, that cry raised the sleepers from their beds. It struck cold to our hearts, and I stood gazing at Holmes, and he at me, until the last echoes of it had died away into the silence from which it rose."]},{t:"The final reveal",z:"\u6700\u540E\u7684\u771F\u76F8",q:"How does this extract resolve the mystery and show the crime-fiction idea of justice?",zq:"\u8FD9\u4E00\u6BB5\u5982\u4F55\u63ED\u5F00\u8C1C\u5E95\uFF0C\u5E76\u4F53\u73B0\u72AF\u7F6A\u5C0F\u8BF4\u4E2D\u201C\u6B63\u4E49\u201D\u7684\u60EF\u4F8B\uFF1F",focus:["climax","repetition","imagery","resolution","justice"],text:["It was a singular sight which met our eyes. On the table stood a dark-lantern with the shutter half open, throwing a brilliant beam of light upon the iron safe, the door of which was ajar. Beside this table, on the wooden chair, sat Dr. Grimesby Roylott clad in a long grey dressing-gown, his bare ankles protruding beneath, and his feet thrust into red heelless Turkish slippers. Across his lap lay the short stock with the long lash which we had noticed during the day. His chin was cocked upward and his eyes were fixed in a dreadful, rigid stare at the corner of the ceiling. Round his brow he had a peculiar yellow band, with brownish speckles, which seemed to be bound tightly round his head. As we entered he made neither sound nor motion.","\u201CThe band! the speckled band!\u201D whispered Holmes.","I took a step forward. In an instant his strange headgear began to move, and there reared itself from among his hair the squat diamond-shaped head and puffed neck of a loathsome serpent.","\u201CIt is a swamp adder!\u201D cried Holmes; \u201Cthe deadliest snake in India. He has died within ten seconds of being bitten. Violence does, in truth, recoil upon the violent, and the schemer falls into the pit which he digs for another. Let us thrust this creature back into its den, and we can then remove Miss Stoner to some place of shelter and let the county"]}],ic=[...rc,...oc,...bf],Tg=[...bf,...oc.filter(e=>["sb11","sb12","sb13","sb14","sb15","sb18"].includes(e.id)),...rc.filter(e=>["en4","en6","en7"].includes(e.id))],Eg=[...rc,...oc.filter(e=>!["sb11","sb12","sb13","sb14","sb15"].includes(e.id))],Ng=[T("hf1","Which is the most SPECIFIC evidence?","\u54EA\u4E00\u53E5\u662F\u6700\u201C\u5177\u4F53\u201D\u7684\u8BC1\u636E\uFF1F",["In 1381, Wat Tyler led the peasants to London","Lots of people were angry back then","Some stuff happened in England","People didn't like things"],"Specific = a name, a date, a place.","\u5177\u4F53 = \u4EBA\u540D + \u5E74\u4EFD + \u5730\u70B9\u3002",["\u592A\u7B3C\u7EDF \xB7 Too vague.","\u592A\u53E3\u8BED \xB7 Too casual.","\u6CA1\u6709\u4E8B\u5B9E \xB7 No facts."]),T("hf2","Which sentence uses FORMAL historical language?","\u54EA\u4E00\u53E5\u662F\u6B63\u5F0F\u7684\u5386\u53F2\u8BED\u8A00\uFF1F",["The monarch imposed a Poll Tax, which caused resentment","The king was kinda mad and made a tax","The tax was heaps bad","Basically everyone hated it lol"],"No 'kinda', 'heaps', 'basically'. Use the bold terms.","\u4E0D\u8981 kinda\u3001heaps\u3001basically\uFF1B\u7528\u5377\u5B50\u4E0A\u7684\u7C97\u4F53\u672F\u8BED\u3002",["kinda \u592A\u53E3\u8BED \xB7 Too casual.","heaps \u592A\u53E3\u8BED \xB7 Too casual.","\u4E0D\u6B63\u5F0F \xB7 Not formal."]),T("hf3","A soldier's 1916 diary says the food was good. Which is a LIMITATION?","\u4E00\u4E2A 1916 \u5E74\u58EB\u5175\u7684\u65E5\u8BB0\u8BF4\u4F19\u98DF\u5F88\u597D\u3002\u54EA\u4E00\u53E5\u662F\u201C\u5C40\u9650\u201D\uFF1F",["It shows only one soldier's experience and he may not represent everyone","It was written at the time","It is a primary source","It gives a personal view of daily life"],"Limitation = what it can't tell us, or who is left out.","\u5C40\u9650 = \u5B83\u8BF4\u660E\u4E0D\u4E86\u4EC0\u4E48\u3001\u6F0F\u6389\u4E86\u8C01\u3002\uFF08\u8FD9\u662F\u548C\u8003\u8BD5\u65E0\u5173\u7684\u7EC3\u4E60\u4F8B\u5B50\uFF09",["\u8FD9\u662F\u4EF7\u503C \xB7 That's a value.","\u8FD9\u662F\u4EF7\u503C \xB7 That's a value.","\u8FD9\u662F\u4EF7\u503C \xB7 That's a value."]),T("hf4","Question: 'Why did the Titanic sink?' Which is the best TOPIC SENTENCE?","\u9898\u76EE\uFF1A\u201C\u6CF0\u5766\u5C3C\u514B\u53F7\u4E3A\u4EC0\u4E48\u6C89\u6CA1\uFF1F\u201D\u54EA\u4E00\u53E5\u662F\u6700\u597D\u7684\u89C2\u70B9\u53E5\uFF1F",["One major cause of the Titanic's sinking was its high speed in an area with icebergs","The Titanic was a big ship","I think the Titanic is sad","In this paragraph I will talk about stuff"],"A topic sentence answers the question with ONE clear point. (Practice topic, not your exam!)","\u89C2\u70B9\u53E5 = \u7528\u4E00\u4E2A\u6E05\u695A\u7684\u89C2\u70B9\u76F4\u63A5\u56DE\u7B54\u9898\u76EE\u3002\uFF08\u7EC3\u4E60\u7528\u7684\u8BDD\u9898\uFF0C\u4E0D\u662F\u8003\u8BD5\u9898\uFF09",["\u6CA1\u56DE\u7B54\u4E3A\u4EC0\u4E48 \xB7 Doesn't answer why.","\u4E0D\u8981 I think \xB7 No 'I think'.","\u4E0D\u8981\u9884\u544A \xB7 Don't announce."]),T("hf5","Which connective shows an EFFECT?","\u54EA\u4E2A\u8FDE\u63A5\u8BCD\u8868\u793A\u201C\u7ED3\u679C\u201D\uFF1F",["Consequently,","However,","For example,","Whereas"],"Effect words: consequently, as a result, this led to.","\u8868\u793A\u7ED3\u679C\uFF1Aconsequently\u3001as a result\u3001this led to\u3002",["\u8FD9\u662F\u8F6C\u6298 \xB7 Contrast.","\u8FD9\u662F\u4E3E\u4F8B \xB7 Example.","\u8FD9\u662F\u5BF9\u6BD4 \xB7 Contrast."]),T("hf6","In a 'compare and contrast' answer, which word shows a DIFFERENCE?","\u6BD4\u8F83\u9898\u91CC\uFF0C\u54EA\u4E2A\u8BCD\u8868\u793A\u201C\u4E0D\u540C\u201D\uFF1F",["Whereas","Similarly","Both","Also"],"Contrast: whereas, however, unlike. Compare: similarly, both.","\u4E0D\u540C\uFF1Awhereas\u3001however\u3001unlike\uFF1B\u76F8\u540C\uFF1Asimilarly\u3001both\u3002",["\u8868\u793A\u76F8\u540C \xB7 Same.","\u8868\u793A\u76F8\u540C \xB7 Same.","\u8868\u793A\u8865\u5145 \xB7 Adding."]),T("hf7","'Outline' means\u2026","outline \u662F\u4EC0\u4E48\u610F\u601D\uFF1F",["Give the main features in brief","Argue for and against","Write everything you know","Draw a picture"],"Outline = brief main points. Describe = features. Explain = cause and effect / why.","\u7B80\u8981\u8BF4\u51FA\u4E3B\u8981\u7279\u70B9\u3002describe = \u63CF\u8FF0\u7279\u5F81\uFF1Bexplain = \u8BB2\u539F\u56E0\u548C\u7ED3\u679C\u3002",["\u90A3\u662F discuss \xB7 Discuss.","\u4E0D\u8981\u5199\u592A\u591A \xB7 Too much.","\u4E0D\u662F\u753B\u56FE \xB7 Not drawing."]),T("hf8","A 4\u20136 mark short answer should be about\u2026","4\u20136 \u5206\u7684\u7B80\u7B54\u5927\u7EA6\u5199\u591A\u5C11\uFF1F",["4\u20136 sentences, one fact or idea per mark","One word","Two pages","A poem"],"The paper says: use the marks and space as a guide.","\u5927\u7EA6 4\u20136 \u53E5\uFF0C\u4E00\u5206\u4E00\u4E2A\u4E8B\u5B9E\u6216\u89C2\u70B9\u3002\u5377\u5B50\u8BF4\uFF1A\u6309\u5206\u503C\u548C\u7A7A\u95F4\u5224\u65AD\u5199\u591A\u5C11\u3002",["\u592A\u5C11 \xB7 Too short.", ource showing medieval weapons, chain mail and tactics. However, it is limited because it is one-sided and omits Harold's victory over the Viking Harald Hardrada.")],why:[c("\u6BCF\u4E00\u884C\u90FD\u6709\u5177\u4F53\u7EC6\u8282\uFF081066\u3001\u5965\u591A\u4E3B\u6559\u3001\u76FE\u5899\uFF09\uFF0C\u4E0D\u662F\u7A7A\u8BDD\u3002","Every row has a specific detail (1066, Bishop Odo, shield wall)."),c("\u7528\u4E86\u5386\u53F2\u672F\u8BED\uFF1Acommemorate\u3001cavalry\u3001primary source\u3001perspective\u3002","Uses terms: commemorate, cavalry, primary source, perspective."),c("Y \u884C\u540C\u65F6\u5199\u4EF7\u503C\u548C\u5C40\u9650\uFF0C\u7528 However \u8FDE\u63A5\u2014\u2014\u8FD9\u662F\u62FF\u6EE1\u5206\u7684\u5173\u952E\u3002","The Y row gives BOTH value and limitation, joined by However."),c("\u6CA1\u6709\u53EA\u63CF\u8FF0\u753B\u9762\uFF0C\u800C\u662F\u89E3\u91CA\u5B83\u4E3A\u4EC0\u4E48\u88AB\u505A\u51FA\u6765\u3002","It explains why it was made, not just what it shows.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u201CIt shows a battle with horses and men.\u201D\u2014\u2014\u53EA\u63CF\u8FF0\u753B\u9762\uFF0C\u6CA1\u6709\u80CC\u666F\u3001\u76EE\u7684\u548C\u89C6\u89D2\uFF0C\u6700\u591A 1 \u5206\u3002","Weak: 'It shows a battle with horses and men.' Just describes; about 1 mark."),check:{q:c("\u54EA\u4E00\u53E5\u5199\u4E86\u201C\u5C40\u9650\u201D\uFF1F","Which sentence gives a LIMITATION?"),r:"Y"}},{id:"mE",s:"H",tag:"\u53F2\u6599\u4EF7\u503C\u4E0E\u5C40\u9650",title:"Source E: values and limitations",zt:"\u53F2\u6599 E \u7684\u4EF7\u503C\u4E0E\u5C40\u9650\uFF08\u7B2C 7 \u9898\uFF0C5 \u5206\uFF09",q:"What are the values and limitations of Source E for a historian studying the Spanish conquest of the Inca Empire? (5 marks)",zq:"\u53F2\u6599 E \u5BF9\u7814\u7A76\u897F\u73ED\u7259\u5F81\u670D\u5370\u52A0\u7684\u5386\u53F2\u5B66\u5BB6\u6709\u4EC0\u4E48\u4EF7\u503C\u548C\u5C40\u9650\uFF1F",parts:[j("C","Source E is a letter from Hernando Pizarro to the Spanish Court, written in about 1533, shortly after the Spanish ambushed Atahualpa at Cajamarca."),j("V","It is valuable because it is a first-hand account of the ambush, revealing that the Spanish even admitted Atahualpa's messengers 'were tortured'."),j("V","It also gives insight into the conquistadors' attitudes, as the claim that the Incas were defeated 'without danger to any Christian' shows a sense of Spanish superiority."),j("LIM","However, it is limited because Pizarro wanted to impress the king, so he presents Atahualpa as a threat to justify the attack."),j("LIM","It also omits the role of smallpox and the Inca resistance that continued until 1572 at Vilcabamba.")],why:[c("\u7B2C\u4E00\u53E5\u4EA4\u4EE3\u53F2\u6599\u6027\u8D28\u548C\u80CC\u666F\uFF08\u8C01\u5199\u3001\u7ED9\u8C01\u3001\u4F55\u65F6\uFF09\u3002","Sentence 1 gives the nature and context of the source."),c("\u4EF7\u503C\u7528\u4E86\u53F2\u6599\u539F\u6587\u7684\u77ED\u5F15\u6587\u505A\u8BC1\u636E\u3002","Values are backed by short quotes from Source E."),c("\u5C40\u9650\u5206\u4E24\u79CD\uFF1A\u4F5C\u8005\u7684\u76EE\u7684\uFF08\u60F3\u8BA8\u597D\u56FD\u738B\uFF09+ \u6F0F\u6389\u4E86\u4EC0\u4E48\uFF08\u5929\u82B1\u30011572\uFF09\u3002","Two kinds of limitation: purpose/bias + omission."),c("\u7ED3\u5408\u4E86\u81EA\u5DF1\u7684\u5386\u53F2\u77E5\u8BC6\uFF08Vilcabamba 1572\uFF09\uFF0C\u8FD9\u662F\u9AD8\u5206\u6807\u5FD7\u3002","Adds own knowledge (Vilcabamba 1572): a sign of an A.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u201CIt is useful because it is old. It is not useful because it is biased.\u201D\u2014\u2014\u6CA1\u8BC1\u636E\u3001\u6CA1\u89E3\u91CA\u4E3A\u4EC0\u4E48\u6709\u504F\u89C1\u3002","Weak: 'Useful because it's old; not useful because it's biased.' No evidence, no reason."),check:{q:c("\u54EA\u4E00\u53E5\u5199\u7684\u662F\u201C\u6F0F\u6389\u4E86\u4EC0\u4E48\u201D\uFF08\u5C40\u9650\uFF09\uFF1F","Which sentence shows what the source OMITS?"),r:"LIM"}},{id:"mNorman",s:"H",tag:"\u7B80\u7B54 \xB7 \u8BFA\u66FC",title \u20136 marks)",zq:"\u89E3\u91CA 1381 \u5E74\u519C\u6C11\u8D77\u4E49\u7684\u539F\u56E0\u548C\u5F71\u54CD\uFF0C\u7ED3\u5408\u53F2\u6599 C\u3002",parts:[j("P","The Peasants' Revolt of 1381 was caused by long-term tensions after the Black Death and by an unpopular tax."),j("E","The plague caused a labour shortage, so peasants demanded higher wages, but the Statute of Labourers (1351) tried to set a maximum wage, which caused resentment."),j("E","The trigger was the Poll Tax of 1377, increased in 1379 and 1381 to fund the Hundred Years' War."),j("E","Source C shows the rebels' aims when Wat Tyler demands 'that there should be no more villeins in England, and no serfdom'."),j("X","This suggests the peasants wanted to end the feudal system that tied them to the manor."),j("L","However, the revolt was crushed: Wat Tyler was killed, John Ball was executed and the young King Richard II kept the feudal system in place.")],why:[c("\u539F\u56E0\u5206\u957F\u671F\uFF08\u9ED1\u6B7B\u75C5\u3001\u52B3\u5DE5\u6CD5\u4EE4\uFF09\u548C\u5BFC\u706B\u7D22\uFF08\u4EBA\u5934\u7A0E\uFF09\u3002","Causes split into long-term and trigger."),c("\u53F2\u6599 C \u7684\u77ED\u5F15\u6587\u201C\u5D4C\u201D\u8FDB\u53E5\u5B50\u91CC\uFF0C\u7136\u540E\u9A6C\u4E0A\u89E3\u91CA\u3002","A short Source C quote is integrated, then explained."),c("\u6700\u540E\u5199\u4E86\u5F71\u54CD\uFF08\u88AB\u9547\u538B\u3001\u5C01\u5EFA\u5236\u5EA6\u4FDD\u7559\uFF09\uFF0C\u9898\u76EE\u8981\u539F\u56E0 AND \u5F71\u54CD\u3002","Ends with effects: the question asks for causes AND effects."),c("\u5E74\u4EFD 1351\u30011377\u30011381 = \u5177\u4F53\u8BC1\u636E\u3002","Dates = specific evidence.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u201CThe peasants were angry so they rebelled.\u201D\u2014\u2014\u6CA1\u5E74\u4EFD\u3001\u6CA1\u53F2\u6599\u3001\u6CA1\u5F71\u54CD\u3002","Weak: 'The peasants were angry so they rebelled.' No dates, source or effects."),check:{q:c("\u54EA\u4E00\u53E5\u201C\u89E3\u91CA\u201D\u4E86\u53F2\u6599 C \u7684\u5F15\u6587\uFF1F","Which sentence EXPLAINS the Source C quote?"),r:"X"}},{id:"mCastle",s:"H",tag:"\u7B80\u7B54 \xB7 \u57CE\u5821",title:"Short answer: compare two castles",zt:"\u7B80\u7B54\uFF1A\u6BD4\u8F83\u571F\u4E18\u57CE\u5BE8\u4E0E\u540C\u5FC3\u57CE\u5821\uFF08\u7B2C 15 \u9898\uFF0C4\u20136 \u5206\uFF09",q:"Compare and contrast a motte and bailey castle to a concentric castle. (4\u20136 marks)",zq:"\u6BD4\u8F83\u571F\u4E18\u57CE\u5BE8\u57CE\u5821\u4E0E\u540C\u5FC3\u57CE\u5821\u7684\u5F02\u540C\u3002",parts:[j("S","Both motte and bailey castles and concentric castles were designed to defend their owners and control the surrounding land."),j("D","However, motte and bailey castles were common in the early Middle Ages and were built quickly from wood and earth by the Normans after 1066, whereas concentric castles were developed from the 13th century and always built of stone."),j("D","Motte and bailey castles were vulnerable to fire and siege engines such as the trebuchet, while concentric castles had two rings of walls, arrow slits, murder holes and a portcullis."),j("X","As a result, concentric castles could withstand long sieges, as Dover Castle showed in 1216, but they were extremely costly and took years to build.")],why:[c("\u5148\u5199\u4E00\u4E2A\u76F8\u540C\u70B9\uFF08compare\uFF09\uFF0C\u518D\u5199\u4E0D\u540C\u70B9\uFF08contrast\uFF09\u3002","One similarity first, then differences."),c("\u7528 whereas / while \u628A\u4E24\u79CD\u57CE\u5821\u653E\u5728\u540C\u4E00\u53E5\u91CC\u5BF9\u6BD4\u3002","'Whereas' / 'while' puts both castles in one sentence."),c("\u672F\u8BED\u591A\uFF1Atrebuchet\u3001murder holes\u3001portcullis\u3002","Lots of terms."),c("\u591A\u4F5B\u57CE\u5821 1216 = \u5177\u4F53\u4F8B\u5B50\u3002","Dover Castle 1216 = a specific example.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u5206\u5F00\u5199\u4E24\u6BB5\u201C\u8FD9\u4E2A\u57CE\u5821\u662F\u2026\u2026\u90A3\u4E2A\u57CE\u5821\u662F\u2026\u2026\u201D\uFF0C\u4E0D\u5BF9\u6BD4\uFF0C\u5206\u6570\u4F1A\u4F4E\u3002","Weak: describing each castle separately without comparing."),check:{q:c("\u54EA\u4E00\u53E5\u662F\u201C\u76F8\u540C\u70B9\u201D\uFF1F","Which sentence is the SIMILARITY?"),r:"S"}},{id:"mChurch",s:"H",tag:"\u7B80\u7B54 \xB7 \u5341\u5B57\u519B",title:"Short answer: the Third Crusade",zt:"\u7B80\u7B54\uFF1A\u7B2C\u4E09\u6B21\u5341\u5B57\u519B\u7684\u539F\u56E0\u548C\u5F71\u54CD\uFF08\u7B2C 21 \u9898\uFF0C3\u20136 \u5206\uFF09",q:"Explain the cause and effect of the Third Crusade. (3\u20136 marks)",zq:"\u89E3\u91CA\u7B2C\u4E09\u6B21\u5341\u5B57\u519B\u4E1C\u5F81\u7684\u539F\u56E0\u548C\u5F71\u54CD\u3002",parts:[j("P","The Third Crusade was caused by the fall of Jerusalem to Saladin in 1187, after which Pope Gregory VIII called for a holy war."),j("E","Richard I of England answered the call and defeated Saladin's forces at Acre in 1191, but the crusaders failed to recapture Jerusalem."),j("X","As a result, the Treaty of Jaffa (1192) allowed Christian pilgrims to visit Jerusalem while it remained under Muslim control."),j("X","In England, the crusade led to higher taxes, and Richard's capture and ransom caused further taxes and unrest under Prince John.")],why:[c("\u539F\u56E0 \u2192 \u4E8B\u4EF6 \u2192 \u5F71\u54CD\uFF0C\u987A\u5E8F\u6E05\u695A\u3002","Cause \u2192 event \u2192 effect, in order."),c("\u6BCF\u53E5\u90FD\u6709\u4EBA\u540D\u6216\u5E74\u4EFD\uFF081187\u30011191\u30011192\uFF09\u3002","Every sentence has a name or date."),c("\u5F71\u54CD\u5199\u4E86\u4E24\u5C42\uFF1A\u5723\u5730 + \u82F1\u683C\u5170\u56FD\u5185\u3002","Effects at two levels: the Holy Land and England.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u201CThey fought a war over Jerusalem.\u201D\u2014\u2014\u6CA1\u539F\u56E0\u3001\u6CA1\u5E74\u4EFD\u3001\u6CA1\u5F71\u54CD\u3002","Weak: 'They fought a war over Jerusalem.'"),check:{q:c("\u54EA\u4E00\u53E5\u662F\u201C\u539F\u56E0\u201D\uFF1F","Which sentence gives the CAUSE?"),r:"P"}},{id:"mRen",s:"H",tag:"\u7B80\u7B54 \xB7 \u7F8E\u7B2C\u5947", e key characteristics of the city of Tenochtitlan. (3\u20136 marks)",zq:"\u63CF\u8FF0\u7279\u8BFA\u5947\u8482\u7279\u5170\u7684\u4E3B\u8981\u7279\u70B9\u3002",parts:[j("F","Tenochtitlan, the Aztec capital, was built on Lake Texcoco and connected to the mainland by causeways, which could be blocked during war."),j("F","It was a highly planned city with canals, allowing goods and people to be transported by canoe."),j("F","The city was fed by chinampas, floating gardens that grew fresh fruit and vegetables."),j("F","At its centre was the Templo Mayor, dedicated to Huitzilopochtli and Tlaloc, where blood sacrifices took place."),j("E","Under Moctezuma II it had about 200,000 people, and the conquistadors were impressed by its size, order and cleanliness.")],why:[c("describe = \u5199\u7279\u70B9\uFF1A\u4E00\u53E5\u4E00\u4E2A\u7279\u70B9\uFF0C5 \u53E5 \u2248 5 \u5206\u3002","Describe = features: one per sentence."),c("\u6BCF\u4E2A\u7279\u70B9\u90FD\u52A0\u4E86\u201C\u4F5C\u7528\u201D\uFF08\u5824\u9053\u6253\u4ED7\u65F6\u80FD\u5C01\u4F4F\uFF09\u3002","Each feature has a purpose (causeways blocked in war)."),c("\u7528\u4E86\u963F\u5179\u7279\u514B\u4E13\u6709\u540D\u8BCD\uFF1Achinampas\u3001Templo Mayor\u3002","Uses Aztec terms.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u201CIt was a big city on a lake.\u201D\u2014\u2014\u53EA\u6709 1 \u4E2A\u7279\u70B9\u3002","Weak: 'It was a big city on a lake.' Only one feature."),check:{q:c("\u54EA\u4E00\u53E5\u7528\u6570\u5B57\u505A\u4E86\u8BC1\u636E\uFF1F","Which sentence uses a number as evidence?"),r:"E"}},{id:"mConq",s:"H",tag:"\u7B80\u7B54 \xB7 \u5927\u4EA4\u6362",title:"Short answer: the Columbian Exchange",zt:"\u7B80\u7B54\uFF1A\u63CF\u8FF0\u54E5\u4F26\u5E03\u5927\u4EA4\u6362\uFF08\u7B2C 13 \u9898\uFF0C3\u20135 \u5206\uFF09",q:"Describe the Columbian Exchange. (3\u20135 marks)",zq:"\u63CF\u8FF0\u54E5\u4F26\u5E03\u5927\u4EA4\u6362\u3002",parts:[j("DEF","The Columbian Exchange was the transfer of plants, animals and diseases between th :root{--bg:#0f1226;--card:#1b1f3b;--card2:#252a4d;--ink:#f3f4ff;--mute:#a9addb;--acc:#ffcc33;--good:#2ee59d;--bad:#ff5c7a;--pur:#7c5cff;--blue:#3ec5ff}
html,body{margin:0;background:var(--bg)!important;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,"Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:12px}
.chip{background:var(--card);border-radius:999px;padding:6px 11px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.sp{flex:1}
.iconbtn{background:var(--card);border:0;border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(140deg,#ff7ab6 0%,#7c5cff 55%,#3ec5ff 100%);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(124,92,255,.35)}
.hero h2{margin:0;font-size:20px;line-height:1.25}
.hero .sub{opacity:.92;font-size:13px;margin-top:2px}
.eq{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0 8px;font-weight:800;font-size:17px}
.pill{background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px}
.devs{display:flex;gap:8px;justify-content:center}
.dev{background:rgba(15,18,38,.35);border-radius:14px;padding:8px 10px;text-align:center;font-size:13px;font-weight:700;min-width:84px}
.dev b{display:block;font-size:28px;line-height:34px}
.tab{display:inline-block;width:24px;height:30px;border:3px solid #e8e9ff;border-radius:5px;background:#2b2f55;vertical-align:middle}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cdx{background:rgba(15,18,38,.35);border-radius:14px;padding:9px 10px;font-size:12px}
.cdx .n{font-size:22px;font-weight:800}
.meter{height:9px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.fine{font-size:11px;opacity:.85;margin-top:10px;text-align:center}
.mission{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;border:2px solid #343a6e}
.mission.boss{border-color:var(--bad);background:linear-gradient(160deg,#3a1630,#1b1f3b)}
.mtag{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.5px}
.mtitle{font-size:22px;font-weight:800;margin:4px 0 2px}
.mmeta{color:var(--mute);font-size:13px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800;cursor:pointer;margin-top:14px;background:var(--acc);color:#251a00;box-shadow:0 5px 0 #b38a00}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.big.alt{background:var(--card2);color:var(--ink);box-shadow:0 5px 0 #11142b}
.big.red{background:var(--bad);color:#fff;box-shadow:0 5px 0 #a1263d}
.big:disabled{opacity:.45}
.week{display:flex;gap:5px;justify-content:space-between;margin-top:14px}
.wd{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.wd b{display:block;margin:3px auto 0;width:28px;height:28px;line-height:28px;border-radius:50%;background:var(--card2);font-size:13px;color:var(--ink)}
.wd.today b{outline:2px solid var(--acc)}
.wd.done b{background:var(--good);color:#06301f}
.row{display:flex;gap:10px}
.mini{flex:1;background:var(--card);border:0;border-radius:16px;padding:12px;text-align:left;cursor:pointer;font-size:13px}
.mini b{display:block;font-size:15px;margin-bottom:3px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff9d3d);border-radius:8px}
.lvhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:8px;background:var(--card2)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--acc)}
.combo{font-weight:800;color:var(--acc);font-size:14px;min-width:62px;text-align:right}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:4px 0}
.zq{color:var(--mute);font-size:14px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:16px;padding:14px;margin:9px 0;font-size:16px;cursor:pointer;line-height:1.3;min-height:54px}
.opt.ok{background:#11493a;border-color:var(--good)}
.opt.no{background:#4d1a2a;border-color:var(--bad)}
.opt.gone{opacity:.3;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.45}
.fb.ok{background:#11493a} .fb.no{background:#4d1a2a}
.fb .en{opacity:.8;font-size:13px}
.hintbtn{background:transparent;border:2px dashed #4a5090;border-radius:14px;color:var(--mute);padding:8px 12px;font-size:14px;cursor:pointer;margin:4px 6px 4px 0}
