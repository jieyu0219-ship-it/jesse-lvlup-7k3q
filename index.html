ique snapshot of England shortly after the Norman Conquest.")],why:[c("\u5148\u4E0B\u5B9A\u4E49\uFF08\u662F\u4EC0\u4E48\u3001\u8C01\u505A\u7684\u3001\u54EA\u5E74\uFF09\u3002","Defines it first: what, who, when."),c("significance = \u5F53\u65F6\u7684\u4F5C\u7528 + \u4ECA\u5929\u4E3A\u4EC0\u4E48\u91CD\u8981\uFF0C\u4E24\u8FB9\u90FD\u5199\u4E86\u3002","Significance = effect then + importance now."),c("3 \u53E5 \u2248 3\u20134 \u5206\uFF0C\u4E00\u53E5\u4E00\u4E2A\u8981\u70B9\u3002","3 sentences \u2248 3\u20134 marks, one idea each.")],weak:c("\u5F31\u7B54\u6848\uFF1A\u201CIt was a big book about England.\u201D\u2014\u2014\u6CA1\u8BF4\u4F5C\u7528\uFF0C\u6CA1\u8BF4\u4E3A\u4EC0\u4E48\u91CD\u8981\u3002","Weak: 'It was a big book about England.' No significance."),check:{q:c("\u54EA\u4E00\u53E5\u8BF4\u660E\u4E86\u5B83\u201C\u4ECA\u5929\u201D\u4E3A\u4EC0\u4E48\u91CD\u8981\uFF1F","Which sentence explains why it matters TODAY?"),r:"X"}},{id:"mPlague",s:"H",tag:"\u7B80\u7B54 \xB7 \u519C\u6C11\u8D77\u4E49",title:"Short answer: the Peasants' Revolt",zt:"\u7B80\u7B54\uFF1A1381 \u519C\u6C11\u8D77\u4E49\u7684\u539F\u56E0\u548C\u5F71\u54CD\uFF0C\u7ED3\u5408\u53F2\u6599 C\uFF08\u7B2C 3 \u9898\uFF0C4\u20136 \u5206\uFF09",q:"Explain the causes and effects of the Peasants' Revolt (1381 AD). Integrate evidence from Source C. (4\u20136 marks)",zq:"\u89E3\u91CA 1381 \u5E74\u519C\u6C11\u8D77\u4E49\u7684\u539F\u56E0\u548C\u5F71\u54CD\uFF0C\u7ED3\u5408\u53F2\u6599 C\u3002",parts:[O("P","The Peasants' Revolt of 1381 was caused by long-term tensions after the Black Death and by an unpopular tax."),O("E","The plague caused a labour shortage, so peasants demanded higher wages, but the Statute of Labourers (1351) tried to set a maximum wage, which caused resentment."),O("E","The trigger was the Poll Tax of 1377, increased in 1379 and 1381 to fund the Hundred Years' War."),O("E","Source C shows the rebels' aims when Wat Tyler demands 'that there should be no more villeins in England, and no serfdom'." .hero h2{margin:0;font-size:20px;line-height:1.25}
.hero .sub{opacity:.92;font-size:13px;margin-top:2px}
.eq{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0 8px;font-weight:800;font-size:17px}
.pill{background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px}
.devs{display:flex;gap:8px;justify-content:center}
.dev{background:rgba(15,18,38,.35);border-radius:14px;padding:8px 10px;text-align:center;font-size:13px;font-weight:700;min-width:84px}
.dev b{display:block;font-size:28px;line-height:34px}
.tab{display:inline-block;width:24px;height:30px;border:3px solid #e8e9ff;border-radius:5px;background:#2b2f55;vertical-align:middle}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cdx{background:rgba(15,18,38,.35);border-radius:14px;padding:9px 10px;font-size:12px}
.cdx .n{font-size:22px;font-weight:800}
.meter{height:9px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.fine{font-size:11px;opacity:.85;margin-top:10px;text-align:center}
.mission{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;border:2px solid #343a6e}
.mission.boss{border-color:var(--bad);background:linear-gradient(160deg,#3a1630,#1b1f3b)}
.mtag{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.5px}
.mtitle{font-size:22px;font-weight:800;margin:4px 0 2px}
.mmeta{color:var(--mute);font-size:13px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800;cursor:pointer;margin-top:14px;background:var(--acc);color:#251a00;box-shadow:0 5px 0 #b38a00}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.big.alt{background:var(--card2);color:var(--ink);box-shadow:0 5px 0 #11142b}
.big.red{background:var(--bad);color:#fff;box-shadow:0 5px 0 #a1263d}
.big:disabled{opacity:.45}
.week{display:flex;gap:5px;justify-content:space-between;margin-top:14px}
.wd{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.wd b{display:block;margin:3px auto 0;width:28px;height:28px;line-height:28px;border-radius:50%;background:var(--card2);font-size:13px;color:var(--ink)}
.wd.today b{outline:2px solid var(--acc)}
.wd.done b{background:var(--good);color:#06301f}
.row{display:flex;gap:10px}
.mini{flex:1;background:var(--card);border:0;border-radius:16px;padding:12px;text-align:left;cursor:pointer;font-size:13px}
.mini b{display:block;font-size:15px;margin-bottom:3px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff9d3d);border-radius:8px}
.lvhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:8px;background:var(--card2)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--acc)}
.combo{font-weight:800;color:var(--acc);font-size:14px;min-width:62px;text-align:right}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:4px 0}
.zq{color:var(--mute);font-size:14px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:16px;padding:14px;margin:9px 0;font-size:16px;cursor:pointer;line-height:1.3;min-height:54px}
.opt.ok{background:#11493a;border-color:var(--good)}
.opt.no{background:#4d1a2a;border-color:var(--bad)}
.opt.gone{opacity:.3;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.45}
.fb.ok{background:#11493a} .fb.no{background:#4d1a2a}
.fb .en{opacity:.8;font-size:13px}
.hintbtn{background:transparent;border:2px dashed #4a5090;border-radius:14px;color:var(--mute);padding:8px 12px;font-size:14px;cursor:pointer;margin:4px 6px 4px 0}
.hint{background:#20254a;border-radius:14px;padding:10px 12px;margin:6px 0;font-size:14px;line-height:1.45}
.hint .en{color:var(--mute);font-size:13px}
.slot{background:var(--card2);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px;min-height:42px;display:flex;gap:8px}
.slot.empty{border:2px dashed #3a4080;background:transparent;color:#5d64a8}
.slot b{color:var(--acc)}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
textarea{width:100%;min-height:96px;border-radius:14px;border:2px solid #3a4080;background:#11142b;color:var(--ink);padding:12px;font-size:16px;font-family:inherit;line-height:1.4}
.qcard{background:#11142b;border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;font-style:italic;font-size:15px;line-height:1.45;margin:8px 0 10px}

.stars{font-size:38px;letter-spacing:4px}
.sheet h3{margin:0 0 10px}
.prize{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0}

.sbtn{border:0;border-radius:12px;padding:9px 12px;font-weight:800;background:var(--acc);color:#251a00;cursor:pointer}
.sbtn:disabled{background:#3a3f6b;color:#8f93c7}
.sbtn.g{background:var(--good);color:#06301f}
.code{font-size:40px;font-weight:900;letter-spacing:4px;color:var(--acc);text-align:center;margin:10px 0}
.hp{height:14px;background:#3a1630;border-radius:10px;overflow:hidden;margin:6px 0 10px;border:2px solid var(--bad)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5c7a,#ff9d3d);transition:width .5s}
.flame{animation:fl 1.2s infinite alternate}

.badge{display:inline-flex;flex-direction:column;align-items:center;width:31%;margin:1%;background:var(--card2);border-radius:14px;padding:10px 4px;font-size:12px;text-align:center;vertical-align:top}

.badge.off{opacity:.35}

.model{background:#141836;border-radius:16px;padding:12px;margin-top:10px;font-size:15px;line-height:1.5}

.mp{display:block;margin:4px 0;padding:4px 0 4px 10px;border-left:4px solid transparent}

.mwhy{margin-top:10px;font-size:14px}
.mwhy .en{color:var(--mute);font-size:13px}
.stuckbtn{background:#3a2a10;border:2px solid #ffcc33;border-radius:14px;color:#ffcc33;padding:8px 12px;font-size:14px;font-weight:800;cursor:pointer;margin:4px 6px 4px 0}
.stuck{background:#171c3c;border:2px solid #ffcc33;border-radius:16px;padding:12px;margin:8px 0;font-size:15px;line-height:1.45}
.ladder{display:flex;gap:6px;margin:6px 0 10px}

.ladder button.on{border-color:#ffcc33;color:#fff}
.ladder button:disabled{opacity:.35}
.mp .zh{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.sent{background:#0f1226;border-radius:12px;padding:10px;margin:6px 0 10px;font-size:15px;line-height:1.55}
.sent .gap{display:inline-block;min-width:44px;border-bottom:2px solid #ffcc33;color:#ffcc33;font-weight:700}
.sent .fill{color:#2ee59d;font-weight:700}
.blank{margin:8px 0 12px}
.blank .bl{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.sopt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:9px 11px;margin:5px 0;font-size:15px;cursor:pointer;line-height:1.3;color:inherit}
.sopt .g{display:block;font-size:12px;color:var(--mute)}
.sopt.ok{background:#11493a;border-color:var(--good)}
.sopt.no{background:#4d1a2a;border-color:var(--bad)}
.why1{font-size:13px;color:#ff9aa8;margin:2px 0 4px}
.revtag{display:inline-block;background:#3a2a10;color:#ffcc33;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#11493a;color:#fff;border:2px solid var(--good);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;z-index:60;white-space:nowrap;box-shadow:0 6px 24px #0008}
.remind{margin-top:10px;font-size:13px;color:var(--acc)}
.lib{display:flex;align-items:center;gap:10px;width:100%;background:var(--card2);border:0;border-radius:14px;padding:12px;margin:7px 0;text-align:left;cursor:pointer;font-size:14px}
.cmp{display:grid;grid-template-columns:1fr 46px 46px;gap:4px;font-size:13px;margin-top:8px;align-items:center}
.cmp b{font-size:11px;color:var(--mute);text-align:center}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.45}
