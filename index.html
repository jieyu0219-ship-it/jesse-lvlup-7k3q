ned."),d("\u6700\u540E\u5199\u4E86\u5F71\u54CD\uFF08\u88AB\u9547\u538B\u3001\u5C01\u5EFA\u5236\u5EA6\u4FDD\u7559\uFF09\uFF0C\u9898\u76EE\u8981\u539F\u56E0 AND \u5F71\u54CD\u3002","Ends with effects: the question asks for causes AND effects."),d("\u5E74\u4EFD 1351\u30011377\u30011381 = \u5177\u4F53\u8BC1\u636E\u3002","Dates = specific evidence.")],weak:d("\u5F31\u7B54\u6848\uFF1A\u201CThe peasants were angry so they rebelled.\u201D\u2014\u2014\u6CA1\u5E74\u4EFD\u3001\u6CA1\u53F2\u6599\u3001\u6CA1\u5F71\u54CD\u3002","Weak: 'The peasants were angry so they rebelled.' No dates, source or effects."),check:{q:d("\u54EA\u4E00\u53E5\u201C\u89E3\u91CA\u201D\u4E86\u53F2\u6599 C \u7684\u5F15\u6587\uFF1F","Which sentence EXPLAINS the Source C quote?"),r:"X"}},{id:"mCastle",s:"H",tag:"\u7B80\u7B54 \xB7 \u57CE\u5821",title:"Short answer: compare two castles",zt:"\u7B80\u7B54\uFF1A\u6BD4\u8F83\u571F\u4E18\u57CE\u5BE8\u4E0E\u540C\u5FC3\u57CE\u5821\uFF08\u7B2C 15 \u9898\uFF0C4\u20136 \u5206\uFF09",q:"Compare and contrast a motte and bailey castle to a concentric castle. (4\u20136 marks)",zq:"\u6BD4\u8F83\u571F\u4E18\u57CE\u5BE8\u57CE\u5821\u4E0E\u540C\u5FC3\u57CE\u5821\u7684\u5F02\u540C\u3002",parts:[I("S","Both motte and bailey castles and concentric castles were designed to defend their owners and control the surrounding land."),I("D","However, motte and bailey castles were common in the early Middle Ages and were built quickly from wood and earth by the Normans after 1066, whereas concentric castles were developed from the 13th century and always built of stone."),I("D","Motte and bailey castles were vulnerable to fire and siege engines such as the trebuchet, while concentric castles had two rings of walls, arrow slits, murder holes and a portcullis."),I("X","As a result, concentric castles could withstand long sieges, as Dover Castle showed in 1216, but they were extremely costly and took years to build.")],why:[d("\u5148\u5199\u4E00\u4E2A\u76F8\u540C\u70B9\uFF08compare\uFF09\uF n at the Battle of Hastings in 1066.",why:[d("\u5E74\u4EFD + \u6218\u5F79 + \u53CC\u65B9\u4EBA\u540D = \u5B8C\u6574\u7684\u80CC\u666F\u3002","Date + battle + both leaders = full context."),d("\u5199\u7684\u662F\u201C\u5F53\u65F6\u53D1\u751F\u4E86\u4EC0\u4E48\u201D\uFF0C\u4E0D\u662F\u753B\u9762\u3002","Gives context, not a description.")]},wh2:{t:"Source E is valuable because it reveals the conquistadors' attitudes towards the Incas at Cajamarca; however, it is limited because it ignores the role of smallpox.",why:[d("\u4E00\u53E5\u91CC\u6709\u4EF7\u503C + \u5C40\u9650\uFF0C\u7528 however \u8FDE\u63A5\u3002","Value + limitation in one sentence."),d("\u5C40\u9650\u662F\u201C\u6F0F\u6389\u4E86\u4EC0\u4E48\u201D\uFF08\u5929\u82B1\uFF09\uFF0C\u5F88\u5177\u4F53\u3002","The limitation is a specific omission.")]},wh3:{t:"One major cause of the Spanish conquest was the spread of smallpox, which weakened the Aztec Empire before Cort\xE9s captured Tenochtitlan.",why:[d("\u53EA\u8BB2\u4E00\u4E2A\u539F\u56E0\uFF0C\u800C\u4E14\u70B9\u540D\u5730\u533A\u548C\u4EBA\u7269\u3002","One cause, with place and person."),d("\u6CA1\u653E\u592A\u591A\u8BC1\u636E\u2014\u2014\u8BC1\u636E\u7559\u7ED9\u4E0B\u4E00\u53E5\u3002","Evidence is saved for the next sentence.")]},wh4:{t:"A significant effect of the conquest was the collapse of Indigenous populations, as diseases such as smallpox killed millions of Aztecs and Incas.",why:[d("effect \u4E00\u8BCD\u76F4\u63A5\u56DE\u5E94\u9898\u76EE\u3002","'Effect' answers the question."),d("\u540C\u65F6\u63D0\u5230\u963F\u5179\u7279\u514B\u548C\u5370\u52A0\uFF08\u4E24\u8FB9\u90FD\u5199\uFF09\u3002","Mentions both Aztecs and Incas.")]},wh5:{t:"Feudalism was a hierarchical system in which vassals swore fealty to the monarch in exchange for land, while peasants provided labour for protection.",why:[d("4 \u4E2A\u672F\u8BED\uFF1Ahierarchical\u3001vassals\u3001fealty\u3001monarch\u3002","Four bold terms."),d("\u5199\u6E05\u695A\u201C\u8C01\u7ED9\u8C01\u4EC0\u4E4 html,body{margin:0;background:var(--bg)!important;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,"Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}

.hero h2{margin:0;font-size:20px;line-height:1.25}
.hero .sub{opacity:.92;font-size:13px;margin-top:2px}
.eq{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0 8px;font-weight:800;font-size:17px}
.pill{background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px}
.devs{display:flex;gap:8px;justify-content:center}

.dev b{display:block;font-size:28px;line-height:34px}
.tab{display:inline-block;width:24px;height:30px;border:3px solid #e8e9ff;border-radius:5px;background:#2b2f55;vertical-align:middle}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cdx{background:rgba(15,18,38,.35);border-radius:14px;padding:9px 10px;font-size:12px}
.cdx .n{font-size:22px;font-weight:800}
.meter{height:9px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:6px}

.fb .en{opacity:.8;font-size:13px}

.hint{background:#20254a;border-radius:14px;padding:10px 12px;margin:6px 0;font-size:14px;line-height:1.45}
.hint .en{color:var(--mute);font-size:13px}
.slot{background:var(--card2);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px;min-height:42px;display:flex;gap:8px}
.slot.empty{border:2px dashed #3a4080;background:transparent;color:#5d64a8}
.slot b{color:var(--acc)}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
textarea{width:100%;min-height:96px;border-radius:14px;border:2px solid #3a4080;background:#11142b;color:var(--ink);padding:12px;font-size:16px;font-family:inherit;line-height:1.4}
.qcard{background:#11142b;border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;font-style:italic;font-size:15px;line-height:1.45;margin:8px 0 10px}
.chk{display:flex;gap:8px;font-size:14px;padding:5px 0}
.pop{position:fixed;z-index:50;pointer-events:none;font-weight:900;font-size:22px;color:var(--acc);text-shadow:0 2px 8px rgba(0,0,0,.6);animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.win{text-align:center;padding:24px 12px}
.win .em{font-size:64px}
.win h2{font-size:28px;margin:8px 0}
.stars{font-size:38px;letter-spacing:4px}
.sheet h3{margin:0 0 10px}
.prize{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0}
.prize .ic{font-size:26px}
.prize .nm{flex:1;font-size:14px}
.sbtn{border:0;border-radius:12px;padding:9px 12px;font-weight:800;background:var(--acc);color:#251a00;cursor:pointer}
.sbtn:disabled{background:#3a3f6b;color:#8f93c7}
.sbtn.g{background:var(--good);color:#06301f}
.code{font-size:40px;font-weight:900;letter-spacing:4px;color:var(--acc);text-align:center;margin:10px 0}
.hp{height:14px;background:#3a1630;border-radius:10px;overflow:hidden;margin:6px 0 10px;border:2px solid var(--bad)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5c7a,#ff9d3d);transition:width .5s}
.flame{animation:fl 1.2s infinite alternate}
@keyframes fl{from{transform:scale(1)}to{transform:scale(1.15)}}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:31%;margin:1%;background:var(--card2);border-radius:14px;padding:10px 4px;font-size:12px;text-align:center;vertical-align:top}
.badge b{font-size:26px}
.badge.off{opacity:.35}
.mbtn{display:block;width:100%;background:#123a2e;border:2px solid var(--good);color:var(--ink);border-radius:14px;padding:12px;font-size:16px;font-weight:800;margin-top:10px;cursor:pointer}
.model{background:#141836;border-radius:16px;padding:12px;margin-top:10px;font-size:15px;line-height:1.5}
.model .mq{color:var(--mute);font-size:13px;margin-bottom:8px}
.mp{display:block;margin:4px 0;padding:4px 0 4px 10px;border-left:4px solid transparent}
.mp .lab{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;margin-right:6px;color:#0f1226}
.mwhy{margin-top:10px;font-size:14px}
.mwhy .en{color:var(--mute);font-size:13px}
.remind{margin-top:10px;font-size:13px;color:var(--acc)}
.lib{display:flex;align-items:center;gap:10px;width:100%;background:var(--card2);border:0;border-radius:14px;padding:12px;margin:7px 0;text-align:left;cursor:pointer;font-size:14px}
.cmp{display:grid;grid-template-columns:1fr 46px 46px;gap:4px;font-size:13px;margin-top:8px;align-items:center}
.cmp b{font-size:11px;color:var(--mute);text-align:center}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.45}
