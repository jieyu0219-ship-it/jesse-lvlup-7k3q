painted with a cheap white coating","刷了白灰的"],["wicker-work","woven from thin sticks, like a basket","柳条编织的"],["panelling","wooden boards covering a wall","木墙板"],["worm-eaten","full of little holes made by insects","虫蛀的"],["discoloured","faded or stained, no longer the old colour","褪色的；变色的"]],"think":["海伦房间里，有什么看起来普通、其实值得注意？","What in Helen’s room looks ordinary but might matter?"],"craft":[{"term":"Investigation 调查","termZh":"调查","classTie":"Year 8 English · Crime Fiction 结构：the detective investigates，仔细察看现场的每个细节。","quote":"his eyes travelled round and round and up and down, taking in every detail of the apartment","effectEn":"We watch Holmes search the room like a detective, which builds trust in his method.","effectZh":"我们看着福尔摩斯像侦探那样把房间里的每个细节都看过，也更相信他的方法。","starters":{"p":"The investigation is shown through careful observation when...","e":"This is seen in the line, “his eyes travelled round and round and up and down…”.","x":"This has the effect of... because the reader sees the detective...","l":"Therefore, this scene follows the convention of a methodical..."}}]},{"wordCount":370,"sents":[{"en":"“Indeed, it seemed unnecessary to put so nice a bell-pull there.","zh":"“的确，在这儿装这么一根漂亮的拉铃绳，似乎没有必要。"},{"en":"You will excuse me for a few minutes while I satisfy myself as to this floor.”","zh":"请原谅我几分钟，我想把这地板看清楚。”"},{"en":"He threw himself down upon his face with his lens in his hand and crawled swiftly backward and forward, examining minutely the cracks between the boards.","zh":"他趴在地上，手里拿着放大镜，迅速地前后爬着，仔细检查木板之间的缝隙。"},{"en":"Then he did the same with the wood-work with which the chamber was panelled.","zh":"接着，他又用同样的办法检查房间的木墙板。"},{"en":"Finally he walked over to the bed and spent some time in staring at it and in running his eye up and down the wall.","zh":"最后他走到床边，盯着它看了一会儿，又把目光在墙上上下扫过。"},{"en":"Finally he took the bell-rope in his hand and gave it a brisk tug.","zh":"最后他抓住拉铃绳，猛地一拉。"},{"en":"“Why, it’s a dummy,” said he.","zh":"“怎么，这是假的，”他说。"},{"en":"“Won’t it ring?”","zh":"“它不响吗？”"},{"en":"“No, it is not even attached to a wire.","zh":"“不响，它甚至没有接到任何铁丝上。"},{"en":"This is very interesting.","zh":"这很有意思。"},{"en":"You can see now that it is fastened to a hook just above where the little opening for the ventilator is.”","zh":"你现在可以看到，它只是挂在一个钩子上，就在那个小小的通气口上方。”"},{"en":"“How very absurd!","zh":"“这多么荒唐！"},{"en":"I never noticed that before.”","zh":"我以前从来没注意到。”"},{"en":"“Very strange!” muttered Holmes, pulling at the rope.","zh":"“非常奇怪！”福尔摩斯低声说，还在拉那根绳子。"},{"en":"“There are one or two very singular points about this room.","zh":"“这间房有一两点非常奇特的地方。"},{"en":"For example, what a fool a builder must be to open a ventilator into another room, when, with the same trouble, he might have communicated with the outside air!”","zh":"比方说，一个建筑工人得有多傻，才会把通气口开向另一间房，而花同样的工夫，本来可以对着外面的空气！”"},{"en":"“That is also quite modern,” said the lady.","zh":"“那也是相当新的，”女士说。"},{"en":"“Done about the same time as the bell-rope?” remarked Holmes.","zh":"“和拉铃绳大约同时装上的？”福尔摩斯问。"},{"en":"“Yes, there were several little changes carried out about that time.”","zh":"“是的，大约那个时候做了好几处小改动。”"},{"en":"“They seem to have been of a most interesting character—dummy bell-ropes, and ventilators which do not ventilate.","zh":"“这些改动看起来都非常有意思——假的拉铃绳，还有并不通气的通气口。"},{"en":"With your permission, Miss Stoner, we shall now carry our researches into the inner apartment.”","zh":"斯托纳小姐，如果你允许，我们现在把调查进行到里面那一间。”"},{"en":"Dr. Grimesby Roylott’s chamber was larger than that of his step-daughter, but was as plainly furnished.","zh":"格里姆斯比·罗伊洛特医生的房间比继女的更大，但陈设同样简单。"},{"en":"A camp-bed, a small wooden shelf full of books, mostly of a technical character, an armchair beside the bed, a plain wooden chair against the wall, a round table, and a large iron safe were the principal things which met the eye.","zh":"一张行军床，一个摆满书的小木架（多半是技术类的书），床边一把扶手椅，靠墙一把普通木椅，一张圆桌，还有一个大铁保险箱，就是一眼能看见的主要东西。"},{"en":"Holmes walked slowly round and examined each and all of them with the keenest interest.","zh":"福尔摩斯慢慢走了一圈，以最浓厚的兴趣把每一样都检查过。"},{"en":"“What’s in here?”","zh":"“这里面是什么？”"},{"en":"he asked, tapping the safe.","zh":"他敲着保险箱问。"},{"en":"“My stepfather’s business papers.”","zh":"“我继父的商业文件。”"},{"en":"“Oh!","zh":"“哦！"},{"en":"you have seen inside, then?”","zh":"这么说，你看见过里面？”"},{"en":"“Only once, some years ago.","zh":"“只有一次，那是好几年前。"},{"en":"I remember that it was full of papers.”","zh":"我记得里面装满了文件。”"}],"words":[["bell-pull","a rope or cord you pull to ring a servant’s bell","拉铃绳"],["minutely","very carefully, in tiny detail","非常仔细地"],["ventilator","a small opening for air to pass through","通气口"],["muttered","spoke quietly, almost to himself","低声嘀咕"],["dummy","not real; it does not actually work","假的；不起作用的"],["communicated","was connected with","相通；连接"],["unnecessary","not needed","没有必要的"],["builder","a person who constructs houses","建筑工人；建造者"]],"think":["那根拉铃绳有什么不对劲？","What is odd about the bell-pull?"],"craft":[{"term":"Clues 线索","termZh":"线索","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：clues 有效线索（假拉铃绳、不通气的通气口）。","quote":"Why, it’s a dummy","effectEn":"The bell-pull does not work, so it must be there for another reason — a real clue, not decoration.","effectZh":"拉铃绳根本不能用，那它一定另有用途——这是一条真正的线索，不是装饰。","starters":{"p":"A vital clue is revealed when Holmes discovers that...","e":"This is seen in the line, “Why, it’s a dummy”.","x":"This is significant because a bell-pull that does not ring must be...","l":"Therefore, this clue hints that the room has been altered in order to..."}}]},{"wordCount":362,"sents":[{"en":"“There isn’t a cat in it, for example?”","zh":"“里面该不会有一只猫吧，比方说？”"},{"en":"“No. What a strange idea!”","zh":"“没有。多么奇怪的想法！”"},{"en":"“Well, look at this!”","zh":"“那么，看看这个！”"},{"en":"He took up a small saucer of milk which stood on the top of it.","zh":"他拿起放在保险箱顶上的一只盛着牛奶的小碟。"},{"en":"“No; we don’t keep a cat.","zh":"“不，我们不养猫。"},{"en":"But there is a cheetah and a baboon.”","zh":"可是有一头猎豹和一只狒狒。”"},{"en":"“Ah, yes, of course!","zh":"“啊，对，当然！"},{"en":"Well, a cheetah is just a big cat, and yet a saucer of milk does not go very far in satisfying its wants, I daresay.","zh":"不过猎豹不过是一只大猫，这一碟牛奶恐怕远远填不饱它，我想。"},{"en":"There is one point which I should wish to determine.”","zh":"还有一点我想确定一下。”"},{"en":"He squatted down in front of the wooden chair and examined the seat of it with the greatest attention.","zh":"他在那把木椅前蹲下来，极其专心地检查椅面。"},{"en":"“Thank you.","zh":"“谢谢。"},{"en":"That is quite settled,” said he, rising and putting his lens in his pocket.","zh":"这一点已经清楚了，”他说着站起来，把放大镜放进口袋。"},{"en":"“Hullo!","zh":"“喂！"},{"en":"Here is something interesting!”","zh":"这里有样有意思的东西！”"},{"en":"The object which had caught his eye was a small dog lash hung on one corner of the bed.","zh":"引起他注意的，是挂在床角的一根小小的打狗鞭。"},{"en":"The lash, however, was curled upon itself and tied so as to make a loop of whipcord.","zh":"可是鞭子被盘起来，结成了一个鞭绳圈。"},{"en":"“What do you make of that, Watson?”","zh":"“华生，你怎么看这个？”"},{"en":"“It’s a common enough lash.","zh":"“这不过是一根很普通的鞭子。"},{"en":"But I don’t know why it should be tied.”","zh":"可我不明白为什么要结起来。”"},{"en":"“That is not quite so common, is it?","zh":"“这就不那么普通了，对吧？"},{"en":"Ah, me!","zh":"唉！"},{"en":"it’s a wicked world, and when a clever man turns his brains to crime it is the worst of all.","zh":"这是个邪恶的世界，一个聪明人一旦把脑子用到犯罪上，那就最糟不过了。"},{"en":"I think that I have seen enough now, Miss Stoner, and with your permission we shall walk out upon the lawn.”","zh":"我想我现在看够了，斯托纳小姐，如果你允许，我们到草坪上去走走。”"},{"en":"I had never seen my friend’s face so grim or his brow so dark as it was when we turned from the scene of this investigation.","zh":"我从未见过我的朋友脸色如此严峻，眉头如此阴沉，就像我们离开这个调查现场时那样。"},{"en":"We had walked several times up and down the lawn, neither Miss Stoner nor myself liking to break in upon his thoughts before he roused himself from his reverie.","zh":"我们在草坪上来回走了好几趟，斯托纳小姐和我都不愿打断他的思绪，直到他自己从出神中醒过来。"},{"en":"“It is very essential, Miss Stoner,” said he, “that you should absolutely follow my advice in every respect.”","zh":"“斯托纳小姐，至关重要的是，”他说，“你必须在每一点上都绝对听从我的建议。”"},{"en":"“I shall most certainly do so.”","zh":"“我一定照办。”"},{"en":"“The matter is too serious for any hesitation.","zh":"“这事太严重，不能有任何犹豫。"},{"en":"Your life may depend upon your compliance.”","zh":"你的性命可能取决于你是否照做。”"},{"en":"“I assure you that I am in your hands.”","zh":"“我向你保证，我完全听你安排。”"},{"en":"“In the first place, both my friend and I must spend the night in your room.”","zh":"“首先，我和我的朋友必须在你的房间里过夜。”"},{"en":"Both Miss Stoner and I gazed at him in astonishment.","zh":"斯托纳小姐和我都吃惊地看着他。"}],"words":[["saucer","a small shallow dish, usually under a cup","茶碟；浅碟"],["daresay","I suppose; I think it is likely","我看大概是"],["squatted","crouched down close to the floor","蹲下"],["whipcord","a strong, thin cord","细而结实的绳子"],["reverie","a daydream; deep thought","出神；沉思"],["essential","necessary; you cannot do without it","必不可少的"],["compliance","doing as asked","依从；照办"],["astonishment","great surprise","震惊；大为吃惊"]],"think":["保险箱旁边那碟牛奶，可能是干什么用的？","What might the saucer of milk be for?"],"craft":[{"term":"Withheld information 隐瞒信息","termZh":"隐瞒信息","classTie":"Year 8 English · Building suspense 营造悬念：福尔摩斯已有判断，却先不说破。","quote":"when a clever man turns his brains to crime it is the worst of all","effectEn":"Holmes clearly knows something is very wrong, but he still does not name it, so tension stays high.","effectZh":"福尔摩斯显然已经觉得事情很不对，却还是不说破，紧张感就一直吊着。","starters":{"p":"Suspense is maintained through withheld information when...","e":"This is seen in the line, “when a clever man turns his brains to crime it is the worst of all”.","x":"This keeps the reader in suspense because Holmes hints at danger but...","l":"Therefore, this is an example of withheld information used to..."}}]},{"wordCount":289,"sents":[{"en":"“Yes, it must be so.","zh":"“是的，必须这样。"},{"en":"Let me explain.","zh":"让我解释一下。"},{"en":"I believe that that is the village inn over there?”","zh":"我相信那边就是村里的旅店吧？”"},{"en":"“Yes, that is the Crown.”","zh":"“是的，那是皇冠旅店。”"},{"en":"“Very good.","zh":"“很好。"},{"en":"Your windows would be visible from there?”","zh":"从那儿能看见你的窗户吗？”"},{"en":"“Certainly.”","zh":"“当然能。”"},{"en":"“You must confine yourself to your room, on pretence of a headache, when your stepfather comes back.","zh":"“等你继父回来，你必须借口头痛，只待在自己房间里。"},{"en":"Then when you hear him retire for the night, you must open the shutters of your window, undo the hasp, put your lamp there as a signal to us, and then withdraw quietly with everything which you are likely to want into the room which you used to occupy.","zh":"然后等你听见他夜里回房休息，你就打开窗板，解开搭扣，把灯放在窗口给我们做信号，再带着你可能需要的东西，悄悄撤回到你原来住的那间房。"},{"en":"I have no doubt that, in spite of the repairs, you could manage there for one night.”","zh":"我相信，尽管在修理，你在那儿过一夜还是可以的。”"},{"en":"“Oh, yes, easily.”","zh":"“哦，是的，很容易。”"},{"en":"“The rest you will leave in our hands.”","zh":"“其余的就交给我们。”"},{"en":"“But what will you do?”","zh":"“可你们要做什么？”"},{"en":"“We shall spend the night in your room, and we shall investigate the cause of this noise which has disturbed you.”","zh":"“我们会在你的房间里过夜，去查清那扰得你不安的声音是怎么来的。”"},{"en":"“I believe, Mr. Holmes, that you have already made up your mind,” said Miss Stoner, laying her hand upon my companion’s sleeve.","zh":"“我相信，福尔摩斯先生，你心里已经有答案了，”斯托纳小姐说，把手放在我同伴的袖子上。"},{"en":"“Perhaps I have.”","zh":"“也许是的。”"},{"en":"“Then, for pity’s sake, tell me what was the cause of my sister’s death.”","zh":"“那么，求你告诉我，我姐姐究竟是怎么死的。”"},{"en":"“I should prefer to have clearer proofs before I speak.”","zh":"“我更愿意在证据更清楚以后再开口。”"},{"en":"“You can at least tell me whether my own thought is correct, and if she died from some sudden fright.”","zh":"“你至少可以告诉我，我自己的想法对不对，她是不是死于突如其来的惊吓。”"},{"en":"“No, I do not think so.","zh":"“不，我不这么想。"},{"en":"I think that there was probably some more tangible cause.","zh":"我想，大概有某种更具体、摸得着的原因。"},{"en":"And now, Miss Stoner, we must leave you for if Dr. Roylott returned and saw us our journey would be in vain.","zh":"现在，斯托纳小姐，我们必须离开你了，因为如果罗伊洛特医生回来看见我们，这一趟就白来了。"},{"en":"Good-bye, and be brave, for if you will do what I have told you, you may rest assured that we shall soon drive away the dangers that threaten you.”","zh":"再见，要勇敢；只要你照我说的做，你可以放心，我们很快就会驱走威胁你的危险。”"}],"words":[["confine","to stay within a place","使限制在；待在……里"],["pretence","a made-up reason; pretending","借口；装作"],["withdraw","to leave quietly","退出；离开"],["investigate","to look into something carefully","调查"],["tangible","real enough to touch or clearly prove","切实的；可抓住的"],["assured","told someone firmly, to make them feel safe","保证；让人放心"],["threaten","to put in danger","威胁"],["headache","a pain in the head","头痛"]],"think":["福尔摩斯为什么让海伦今晚锁好自己的房间？","Why does Holmes ask Helen to lock her room tonight?"],"craft":[{"term":"Suspense 悬念","termZh":"悬念","classTie":"Year 8 English · Building suspense 营造悬念：计划在今夜揭晓，读者会一直等到晚上。","quote":"We shall spend the night in your room","effectEn":"The plan to stay overnight promises that the danger will come after dark, so the reader waits for night.","effectZh":"他们打算在房里过夜，等于预告危险会在天黑以后到来，读者也会一直等到夜里。","starters":{"p":"The composer builds suspense by delaying the reveal when...","e":"This is seen in the line, “We shall spend the night in your room”.","x":"This makes the reader anticipate... because the danger is likely to...","l":"Therefore, this plan acts like a cliffhanger before the next part of..."}}]},{"wordCount":367,"sents":[{"en":"Sherlock Holmes and I had no difficulty in engaging a bedroom and sitting-room at the Crown Inn.","zh":"福尔摩斯和我没费什么事，就在皇冠旅店订下了一间卧室和一间起居室。"},{"en":"They were on the upper floor, and from our window we could command a view of the avenue gate, and of the inhabited wing of Stoke Moran Manor House.","zh":"房间在楼上，从窗户可以看见林荫道的大门，以及斯托克莫兰庄园有人居住的那一侧。"},{"en":"At dusk we saw Dr. Grimesby Roylott drive past, his huge form looming up beside the little figure of the lad who drove him.","zh":"黄昏时，我们看见格里姆斯比·罗伊洛特医生乘车经过，他巨大的身躯，在那个给他驾车的少年小小的身影旁边显得格外突出。"},{"en":"The boy had some slight difficulty in undoing the heavy iron gates, and we heard the hoarse roar of the Doctor’s voice and saw the fury with which he shook his clinched fists at him.","zh":"那男孩开那扇沉重的铁门时稍微费了点劲，我们听见医生嘶哑的怒吼，也看见他朝那孩子挥舞紧握的拳头，怒气冲冲。"},{"en":"The trap drove on, and a few minutes later we saw a sudden light spring up among the trees as the lamp was lit in one of the sitting-rooms.","zh":"马车继续往前，几分钟后，树丛中突然亮起灯光，原来是一间起居室点上了灯。"},{"en":"“Do you know, Watson,” said Holmes as we sat together in the gathering darkness, “I have really some scruples as to taking you to-night.","zh":"“你知道吗，华生，”我们一起坐在渐浓的暮色里，福尔摩斯说，“今晚带你去，我其实有些顾虑。"},{"en":"There is a distinct element of danger.”","zh":"那里明显有危险的成分。”"},{"en":"“Can I be of assistance?”","zh":"“我能帮上忙吗？”"},{"en":"“Your presence might be invaluable.”","zh":"“有你在，可能会非常宝贵。”"},{"en":"“Then I shall certainly come.”","zh":"“那我一定去。”"},{"en":"“It is very kind of you.”","zh":"“你真好。”"},{"en":"“You speak of danger.","zh":"“你说到危险。"},{"en":"You have evidently seen more in these rooms than was visible to me.”","zh":"显然，你在那些房间里看到的，比我看见的要多。”"},{"en":"“No, but I fancy that I may have deduced a little more.","zh":"“倒也不是，不过我想我也许多推断出了一点。"},{"en":"I imagine that you saw all that I did.”","zh":"我猜想，你看见的和我看见的是一样的。”"},{"en":"“I saw nothing remarkable save the bell-rope, and what purpose that could answer I confess is more than I can imagine.”","zh":"“除了那根拉铃绳，我没看见什么特别的，而那根绳子能有什么用，我承认我想象不出来。”"},{"en":"“You saw the ventilator, too?”","zh":"“你也看见那个通气口了吧？”"},{"en":"“Yes, but I do not think that it is such a very unusual thing to have a small opening between two rooms.","zh":"“看见了，可两间房之间有个小开口，我并不觉得有多么不寻常。"},{"en":"It was so small that a rat could hardly pass through.”","zh":"它那么小，连老鼠都很难钻过去。”"},{"en":"“I knew that we should find a ventilator before ever we came to Stoke Moran.”","zh":"“我知道，我们还没到斯托克莫兰，就会发现一个通气口。”"},{"en":"“My dear Holmes!”","zh":"“我亲爱的福尔摩斯！”"},{"en":"“Oh, yes, I did.","zh":"“哦，是的，我事先就想到了。"},{"en":"You remember in her statement she said that her sister could smell Dr. Roylott’s cigar.","zh":"你记得她陈述时说过，她姐姐能闻到罗伊洛特医生的雪茄烟。"},{"en":"Now, of course that suggested at once that there must be a communication between the two rooms.","zh":"当然，那立刻说明两间房之间一定有通道。"},{"en":"It could only be a small one, or it would have been remarked upon at the coroner’s inquiry.","zh":"那通道只能很小，否则验尸调查时就会被提到。"},{"en":"I deduced a ventilator.”","zh":"于是我推断出有一个通气口。”"},{"en":"“But what harm can there be in that?”","zh":"“可那会有什么危害呢？”"}],"words":[["engaging","booking; taking (a room)","订下（房间）"],["looming","appearing large and dark, often in a worrying way","赫然耸现"],["clinched","settled; made certain","敲定；决定了"],["scruples","feelings of doubt about whether something is right","顾虑；犹豫"],["invaluable","extremely useful","非常宝贵的"],["deduced","worked out by reasoning","推断出"],["confess","to admit something","承认"],["purpose","the reason something is made or done","用途；目的"]],"think":["沃森为什么愿意一起守夜？","Why is Watson willing to keep watch too?"],"craft":[{"term":"Deduction 推理","termZh":"推理","classTie":"Year 8 English · Crime Fiction：detective uses deduction 侦探用推理，在到达现场前就想到通气口。","quote":"I knew that we should find a ventilator before ever we came to Stoke Moran","effectEn":"Holmes explains a deduction he made from the cigar smell, showing logical detective work.","effectZh":"福尔摩斯解释他如何从雪茄气味推断出通气口，显示出逻辑严密的侦探工作。","starters":{"p":"Holmes’s skill in deduction is shown when...","e":"This is seen in the line, “I knew that we should find a ventilator before ever we came to Stoke Moran”.","x":"This is effective because it shows him connecting earlier evidence (the cigar) to...","l":"Therefore, this models the convention of a logical detective who..."}}]},{"wordCount":352,"sents":[{"en":"“Well, there is at least a curious coincidence of dates.","zh":"“至少，日期上有一个奇怪的巧合。"},{"en":"A ventilator is made, a cord is hung, and a lady who sleeps in the bed dies.","zh":"开了一个通气口，挂上了一根绳子，而睡在那张床上的女士死了。"},{"en":"Does not that strike you?”","zh":"这还不能引起你的注意吗？”"},{"en":"“I cannot as yet see any connection.”","zh":"“我暂时还看不出有什么联系。”"},{"en":"“Did you observe anything very peculiar about that bed?”","zh":"“你有没有注意到那张床非常奇特的地方？”"},{"en":"“No.”","zh":"“没有。”"},{"en":"“It was clamped to the floor.","zh":"“它被固定在地板上。"},{"en":"Did you ever see a bed fastened like that before?”","zh":"你以前见过床被这样钉住吗？”"},{"en":"“I cannot say that I have.”","zh":"“不能说见过。”"},{"en":"“The lady could not move her bed.","zh":"“那位女士没法移动她的床。"},{"en":"It must always be in the same relative position to the ventilator and to the rope—or so we may call it, since it was clearly never meant for a bell-pull.”","zh":"它必须始终和通气口、和那根绳子保持同样的相对位置——我们也许可以叫它绳子，因为它显然从来就不是用来拉铃的。”"},{"en":"“Holmes,” I cried, “I seem to see dimly what you are hinting at.","zh":"“福尔摩斯，”我喊道，“我隐约明白你在暗示什么了。"},{"en":"We are only just in time to prevent some subtle and horrible crime.”","zh":"我们刚好来得及阻止一场隐秘而可怕的罪行。”"},{"en":"“Subtle enough and horrible enough.","zh":"“确实够隐秘，也够可怕。"},{"en":"When a doctor does go wrong he is the first of criminals.","zh":"一个医生一旦走上邪路，就会成为最厉害的罪犯。"},{"en":"He has nerve and he has knowledge.","zh":"他有胆量，也有知识。"},{"en":"Palmer and Pritchard were among the heads of their profession.","zh":"帕尔默和普里查德，都曾是他们那一行的顶尖人物。"},{"en":"This man strikes even deeper, but I think, Watson, that we shall be able to strike deeper still.","zh":"这个人甚至更阴险，可我想，华生，我们还能比他更胜一筹。"},{"en":"But we shall have horrors enough before the night is over; for goodness’ sake let us have a quiet pipe and turn our minds for a few hours to something more cheerful.”","zh":"不过今晚结束前，可怕的事已经够多了；看在老天的份上，让我们安静地抽一会儿烟，把心思转到高兴一点的事情上几个小时吧。”"},{"en":"About nine o’clock the light among the trees was extinguished, and all was dark in the direction of the Manor House.","zh":"大约九点，树丛中的灯光熄灭了，庄园那边一片黑暗。"},{"en":"Two hours passed slowly away, and then, suddenly, just at the stroke of eleven, a single bright light shone out right in front of us.","zh":"两个小时慢慢过去，然后，突然，刚敲十一点，一盏明亮的灯正好在我们面前亮了起来。"},{"en":"“That is our signal,” said Holmes, springing to his feet; “it comes from the middle window.”","zh":"“那是我们的信号，”福尔摩斯跳起来说，“是从中间那扇窗户来的。”"},{"en":"As we passed out he exchanged a few words with the landlord, explaining that we were going on a late visit to an acquaintance, and that it was possible that we might spend the night there.","zh":"我们出去时，他和店主说了几句，解释我们要晚间去拜访一个熟人，也许会在那儿过夜。"},{"en":"A moment later we were out on the dark road, a chill wind blowing in our faces, and one yellow light twinkling in front of us through the gloom to guide us on our sombre errand.","zh":"片刻之后，我们就走在黑暗的路上，凉风吹在脸上，一盏黄灯在幽暗中闪烁，为我们这趟阴沉的差事引路。"}],"words":[["coincidence","two things happening together by chance","巧合"],["clamped","fixed firmly, so it cannot move","夹紧；固定住"],["hinting","suggesting something without saying it fully","暗示"],["criminals","people who commit crimes","罪犯"],["Pritchard","a real 19th-century poisoner Holmes mentions","普里查德（福尔摩斯提到的投毒者）"],["extinguished","put out (a light or fire)","熄灭"],["sombre","dark and serious","阴沉的"],["gloom","darkness","黑暗；幽暗"]],"think":["床被固定在地板上，可能是为了什么？","Why might the bed be clamped to the floor?"],"craft":[{"term":"Short sentences 短句","termZh":"短句","classTie":"Year 8 English · Building suspense 营造悬念：short sentences 短句加快节奏，让紧张感更强。","quote":"A ventilator is made, a cord is hung, and a lady who sleeps in the bed dies","effectEn":"The three short, stacked facts hit the reader quickly and make the pattern feel deadly.","effectZh":"三个短而并列的事实很快砸过来，让这个规律显得非常致命。","starters":{"p":"Short sentences are used to build suspense when...","e":"This is seen in the line, “A ventilator is made, a cord is hung, and a lady who sleeps in the bed dies”.","x":"This has the effect of... because the rapid list makes the danger feel...","l":"Therefore, this sentence structure helps the composer to..."}}]},{"wordCount":365,"sents":[{"en":"There was little difficulty in entering the grounds, for unrepaired breaches gaped in the old park wall.","zh":"进入园子并不困难，因为旧园墙有几处没有修补的缺口张着大口。"},{"en":"Making our way among the trees, we reached the lawn, crossed it, and were about to enter through the window when out from a clump of laurel bushes there darted what seemed to be a hideous and distorted child, who threw itself upon the grass with writhing limbs and then ran swiftly across the lawn into the darkness.","zh":"我们在树间穿行，走到草坪，穿过去，正要从窗户进去，突然从一丛月桂里冲出一个仿佛可怕、扭曲的孩子一样的东西，扭动着四肢扑倒在草上，接着飞快地跑过草坪，没入黑暗。"},{"en":"“My God!”","zh":"“我的上帝！”"},{"en":"I whispered; “did you see it?”","zh":"我低声说，“你看见了吗？”"},{"en":"Holmes was for the moment as startled as I.","zh":"福尔摩斯一时也和我一样吃惊。"},{"en":"His hand closed like a vice upon my wrist in his agitation.","zh":"他激动之中，手像铁钳一样攥紧了我的手腕。"},{"en":"Then he broke into a low laugh and put his lips to my ear.","zh":"接着他低低笑了一声，把嘴唇贴近我的耳朵。"},{"en":"“It is a nice household,” he murmured.","zh":"“这一家真不错，”他喃喃说。"},{"en":"“That is the baboon.”","zh":"“那是那只狒狒。”"},{"en":"I had forgotten the strange pets which the Doctor affected.","zh":"我竟忘了医生养的那些奇怪的宠物。"},{"en":"There was a cheetah, too; perhaps we might find it upon our shoulders at any moment.","zh":"还有一头猎豹；也许我们随时都会发现它趴到了我们肩上。"},{"en":"I confess that I felt easier in my mind when, after following Holmes’ example and slipping off my shoes, I found myself inside the bedroom.","zh":"我承认，直到我学着福尔摩斯的样子脱掉鞋子，进到卧室里，心里才踏实了一些。"},{"en":"My companion noiselessly closed the shutters, moved the lamp onto the table, and cast his eyes round the room.","zh":"我的同伴悄无声息地关上窗板，把灯移到桌上，目光扫过房间。"},{"en":"All was as we had seen it in the daytime.","zh":"一切都和我们白天看见的一样。"},{"en":"Then creeping up to me and making a trumpet of his hand, he whispered into my ear again so gently that it was all that I could do to distinguish the words:","zh":"然后他悄悄走到我身边，把手拢成喇叭状，再次轻轻贴着我的耳朵说话，轻得我几乎要费力才能分辨出词句："},{"en":"“The least sound would be fatal to our plans.”","zh":"“一点点声音都会毁了我们的计划。”"},{"en":"I nodded to show that I had heard.","zh":"我点头表示听见了。"},{"en":"“We must sit without light.","zh":"“我们必须摸黑坐着。"},{"en":"He would see it through the ventilator.”","zh":"他会从通气口看见灯光。”"},{"en":"I nodded again.","zh":"我又点了点头。"},{"en":"“Do not go asleep; your very life may depend upon it.","zh":"“不要睡着；你的性命可能就靠这个。"},{"en":"Have your pistol ready in case we should need it.","zh":"把你的手枪准备好，以防万一我们用得上。"},{"en":"I will sit on the side of the bed, and you in that chair.”","zh":"我坐在床边，你坐那把椅子。”"},{"en":"I took out my revolver and laid it on the corner of the table.","zh":"我取出左轮手枪，放在桌角。"},{"en":"Holmes had brought up a long thin cane, and this he placed upon the bed beside him.","zh":"福尔摩斯带了一根又长又细的手杖，放在身边的床上。"},{"en":"By it he laid the box of matches and the stump of a candle.","zh":"旁边他又放上火柴盒和一截蜡烛头。"},{"en":"Then he turned down the lamp, and we were left in darkness.","zh":"然后他把灯拧暗，我们便留在了黑暗里。"}],"words":[["breaches","gaps or broken places","缺口；破口"],["hideous","very ugly and horrible","可怕的；丑陋的"],["distorted","twisted out of its usual shape","扭曲的"],["writhing","twisting as if in pain","扭动着"],["startled","suddenly surprised and a little scared","吓了一跳"],["noiselessly","without making a sound","悄悄地；无声地"],["trumpet","a brass musical instrument with a clear, loud sound","小号"],["revolver","a handgun","左轮手枪"]],"think":["他们悄悄走进园子时，你紧张吗？","How do you feel as they slip into the grounds?"],"craft":[{"term":"Suspense / whispered dialogue 悬念与低声对话","termZh":"悬念 / 低声对话","classTie":"Year 8 English · Building suspense 营造悬念：哪怕一点点声音都会毁掉计划。","quote":"The least sound would be fatal to our plans","effectEn":"The whispered warning makes the dark room feel dangerous; even a small noise could ruin everything.","effectZh":"这句低声警告让黑暗的房间显得更危险：一点点声音都可能毁掉一切。","starters":{"p":"Dialogue is used to heighten suspense when...","e":"This is seen in the whisper, “The least sound would be fatal to our plans”.","x":"This makes the reader anxious because...","l":"Therefore, this moment builds tension before the climax by..."}}]},{"wordCount":261,"sents":[{"en":"How shall I ever forget that dreadful vigil?","zh":"我怎么会忘记那一夜可怕的守候呢？"},{"en":"I could not hear a sound, not even the drawing of a breath, and yet I knew that my companion sat open-eyed, within a few feet of me, in the same state of nervous tension in which I was myself.","zh":"我听不见一点声音，甚至听不见呼吸，可我知道，我的同伴就坐在离我几英尺的地方，眼睛睁着，和我一样神经紧绷。"},{"en":"The shutters cut off the least ray of light, and we waited in absolute darkness.","zh":"窗板挡住了最微弱的光线，我们在完全的黑暗中等待。"},{"en":"From outside came the occasional cry of a night-bird, and once at our very window a long drawn catlike whine, which told us that the cheetah was indeed at liberty.","zh":"外面偶尔传来夜鸟的叫声，有一次就在我们窗边，响起一声拖长的、像猫一样的哀鸣，告诉我们那头猎豹确实在自由走动。"},{"en":"Far away we could hear the deep tones of the parish clock, which boomed out every quarter of an hour.","zh":"远处可以听见教区大钟深沉的钟声，每一刻钟轰鸣一次。"},{"en":"How long they seemed, those quarters!","zh":"那些一刻钟显得多么漫长啊！"},{"en":"Twelve struck, and one and two and three, and still we sat waiting silently for whatever might befall.","zh":"十二点敲过，一点、两点、三点，我们仍然静静坐着，等待可能发生的任何事。"},{"en":"Suddenly there was the momentary gleam of a light up in the direction of the ventilator, which vanished immediately, but was succeeded by a strong smell of burning oil and heated metal.","zh":"突然，通气口那个方向闪过一瞬光亮，立刻又消失了，接着却是一股强烈的燃烧油和金属发热的气味。"},{"en":"Someone in the next room had lit a dark-lantern.","zh":"隔壁房间里，有人点亮了一盏遮光提灯。"},{"en":"I heard a gentle sound of movement, and then all was silent once more, though the smell grew stronger.","zh":"我听见一阵轻微的移动声，然后又是一片寂静，可那气味却越来越浓。"},{"en":"For half an hour I sat with straining ears.","zh":"有半个小时，我竖起耳朵坐着。"},{"en":"Then suddenly another sound became audible—a very gentle, soothing sound, like that of a small jet of steam escaping continually from a kettle.","zh":"然后突然又响起另一种声音——非常轻柔、像安抚一样的声音，仿佛一把水壶在不断地冒出一小股蒸汽。"},{"en":"The instant that we heard it, Holmes sprang from the bed, struck a match, and lashed furiously with his cane at the bell-pull.","zh":"我们刚听见，福尔摩斯就从床上跳起来，划着火柴，用他的手杖对着拉铃绳猛抽。"},{"en":"“You see it, Watson?”","zh":"“你看见了吗，华生？”"},{"en":"he yelled.","zh":"他大喊。"},{"en":"“You see it?”","zh":"“你看见了吗？”"}],"words":[["tension","a tight, nervous feeling","紧张"],["absolute","complete; total","完全的"],["momentary","lasting only a moment","片刻的"],["vanished","disappeared","消失了"],["dark-lantern","a lamp you can cover, so the light can be hidden","遮光提灯"],["audible","loud enough to be heard","听得见的"],["soothing","calm and gentle","安抚的；温和的"],["furiously","with wild energy or anger","猛烈地；狂怒地"]],"think":["在黑暗中等待时，你最会留心什么声音？","In the dark, which sound would you listen for most?"],"craft":[{"term":"Sensory imagery 感官描写","termZh":"感官描写","classTie":"Year 8 English · sensory imagery 感官描写（听、看、闻）用来营造悬念。","quote":"The shutters cut off the least ray of light, and we waited in absolute darkness","effectEn":"Sight is removed, so the reader has to wait with them in the dark and listen for the next sound.","effectZh":"视觉被切断，读者也只好和他们一起在黑暗里等，去听下一个声音。","starters":{"p":"Sensory imagery builds suspense when...","e":"This is seen in the line, “The shutters cut off the least ray of light, and we waited in absolute darkness”.","x":"This is effective because, without light, the reader focuses on...","l":"Therefore, this atmosphere prepares us for the climax by..."}}]},{"wordCount":383,"sents":[{"en":"But I saw nothing.","zh":"可我什么也没看见。"},{"en":"At the moment when Holmes struck the light I heard a low, clear whistle, but the sudden glare flashing into my weary eyes made it impossible for me to tell what it was at which my friend lashed so savagely.","zh":"就在福尔摩斯打着火的那一刻，我听见一声低低的、清楚的口哨，可那突然闪进我疲劳眼睛的强光，让我没法看清朋友如此凶猛抽打的究竟是什么。"},{"en":"I could, however, see that his face was deadly pale and filled with horror and loathing.","zh":"不过我看得见，他的脸死一般苍白，充满恐惧和厌恶。"},{"en":"He had ceased to strike and was gazing up at the ventilator when suddenly there broke from the silence of the night the most horrible cry to which I have ever listened.","zh":"他已经停止抽打，正抬头盯着通气口，突然，夜的寂静里爆发出我听过的最可怕的一声惨叫。"},{"en":"It swelled up louder and louder, a hoarse yell of pain and fear and anger all mingled in the one dreadful shriek.","zh":"它越来越响，那是一声嘶哑的喊叫，痛苦、恐惧和愤怒全混在这一声可怕的尖叫里。"},{"en":"They say that away down in the village, and even in the distant parsonage, that cry raised the sleepers from their beds.","zh":"人们说，远处村子里，甚至更远的牧师住所里，那一声喊叫把熟睡的人都从床上惊起来了。"},{"en":"It struck cold to our hearts, and I stood gazing at Holmes, and he at me, until the last echoes of it had died away into the silence from which it rose.","zh":"它让我们心头发冷，我站着盯着福尔摩斯，他也盯着我，直到最后的回声消失在它升起的那片寂静里。"},{"en":"“What can it mean?”","zh":"“这能意味着什么？”"},{"en":"I gasped.","zh":"我喘着气问。"},{"en":"“It means that it is all over,” Holmes answered.","zh":"“意味着一切都结束了，”福尔摩斯回答。"},{"en":"“And perhaps, after all, it is for the best.","zh":"“也许，毕竟，这样反倒最好。"},{"en":"Take your pistol, and we will enter Dr. Roylott’s room.”","zh":"带上你的手枪，我们进罗伊洛特医生的房间。”"},{"en":"With a grave face he lit the lamp and led the way down the corridor.","zh":"他神情严肃地点上灯，带着路走向走廊。"},{"en":"Twice he struck at the chamber door without any reply from within.","zh":"他敲了两次房门，里面没有任何回应。"},{"en":"Then he turned the handle and entered, I at his heels, with the cocked pistol in my hand.","zh":"然后他转动门把手走了进去，我紧跟在后，手里握着已扳上击锤的手枪。"},{"en":"It was a singular sight which met our eyes.","zh":"映入眼帘的是一幅奇特的景象。"},{"en":"On the table stood a dark-lantern with the shutter half open, throwing a brilliant beam of light upon the iron safe, the door of which was ajar.","zh":"桌上放着一盏遮光提灯，遮板半开，一道亮光打在铁保险箱上，箱门微微开着。"},{"en":"Beside this table, on the wooden chair, sat Dr. Grimesby Roylott clad in a long grey dressing-gown, his bare ankles protruding beneath, and his feet thrust into red heelless Turkish slippers.","zh":"桌子旁边，那把木椅上坐着格里姆斯比·罗伊洛特医生，穿着一件长长的灰色晨衣，光着的脚踝露在下面，脚上套着红色的、没有后跟的土耳其拖鞋。"},{"en":"Across his lap lay the short stock with the long lash which we had noticed during the day.","zh":"他膝上横放着我们白天注意到的那根短柄长鞭。"},{"en":"His chin was cocked upward and his eyes were fixed in a dreadful, rigid stare at the corner of the ceiling.","zh":"他的下巴朝上抬着，眼睛可怕而僵硬地盯着天花板的一角。"},{"en":"Round his brow he had a peculiar yellow band, with brownish speckles, which seemed to be bound tightly round his head.","zh":"他的额上有一条奇特的黄色带子，带着褐色斑点，像是紧紧缠在头上。"},{"en":"As we entered he made neither sound nor motion.","zh":"我们进去时，他既没有出声，也没有动。"}],"words":[["flashing","shining out suddenly","突然亮起"],["savagely","in a fierce, violent way","凶猛地"],["loathing","a strong feeling of disgust","厌恶"],["swelled","grew louder or larger","增强；膨胀"],["mingled","mixed together","混在一起"],["parsonage","the house of a parish priest","牧师住所"],["dressing-gown","a long robe worn over night clothes","晨衣；睡袍"],["protruding","sticking out","凸出；伸出来"]],"think":["福尔摩斯打亮灯之后，房间里是什么情形？","What do you see when Holmes flashes the light?"],"craft":[{"term":"Cliffhanger / climax 悬念与高潮","termZh":"悬念 / 高潮","classTie":"Year 8 English · Building suspense 营造悬念：cliffhanger 和 climax 高潮，可怕的叫声把故事推向最高点。","quote":"the most horrible cry to which I have ever listened","effectEn":"The terrible cry is a climax moment: something has happened in the next room, but we do not yet see what.","effectZh":"这声可怕的喊叫是高潮：隔壁已经出事了，可我们还没看见是什么。","starters":{"p":"The composer reaches a climax and uses a cliffhanger when...","e":"This is seen in the phrase, “the most horrible cry to which I have ever listened”.","x":"This shocks the reader because the sound suggests... but the cause is still...","l":"Therefore, this climax keeps suspense high until the final reveal of..."}}]},{"wordCount":267,"sents":[{"en":"“The band!","zh":"“带子！"},{"en":"the speckled band!” whispered Holmes.","zh":"斑点带子！”福尔摩斯低声说。"},{"en":"I took a step forward.","zh":"我向前迈了一步。"},{"en":"In an instant his strange headgear began to move, and there reared itself from among his hair the squat diamond-shaped head and puffed neck of a loathsome serpent.","zh":"转眼之间，他那奇怪的“头饰”开始动了，在他的头发里竖起一个令人恶心的蛇头：又矮又扁，呈菱形，脖子鼓着。"},{"en":"“It is a swamp adder!” cried Holmes; “the deadliest snake in India.","zh":"“是沼泽蝰蛇！”福尔摩斯喊道，“印度最毒的蛇。"},{"en":"He has died within ten seconds of being bitten.","zh":"他被咬后不到十秒就死了。"},{"en":"Violence does, in truth, recoil upon the violent, and the schemer falls into the pit which he digs for another.","zh":"暴力，说真的，会反噬使用暴力的人，算计别人的人，自己掉进给别人挖的坑里。"},{"en":"Let us thrust this creature back into its den, and we can then remove Miss Stoner to some place of shelter and let the county police know what has happened.”","zh":"让我们把这东西塞回它的窝里，然后就可以把斯托纳小姐转移到安全的地方，并通知郡里的警察发生了什么事。”"},{"en":"As he spoke he drew the dog-whip swiftly from the dead man’s lap, and throwing the noose round the reptile’s neck he drew it from its horrid perch and, carrying it at arm’s length, threw it into the iron safe, which he closed upon it.","zh":"他一边说，一边迅速从死者膝上抽出那根打狗鞭，把绳圈套在那爬行动物的脖子上，将它从可怕的栖处拉下来，伸直手臂提着，扔进铁保险箱，再关上箱门。"},{"en":"Such are the true facts of the death of Dr. Grimesby Roylott, of Stoke Moran.","zh":"以上就是斯托克莫兰的格里姆斯比·罗伊洛特医生之死的真实情况。"},{"en":"It is not necessary that I should prolong a narrative which has already run to too great a length by telling how we broke the sad news to the terrified girl, how we conveyed her by the morning train to the care of her good aunt at Harrow, of how the slow process of official inquiry came to the conclusion that the doctor met his fate while indiscreetly playing with a dangerous pet.","zh":"这段叙述已经够长了，我不必再详细讲我们怎样把这个不幸的消息告诉那位吓坏了的姑娘，怎样在早晨用火车把她送到哈罗、交到她善良的姨妈身边，以及那缓慢的官方调查怎样得出结论：医生是在不谨慎地玩弄一只危险宠物时送了命。"},{"en":"The little which I had yet to learn of the case was told me by Sherlock Holmes as we travelled back next day.","zh":"这件案子里我还有一点不知道的，是第二天回去的路上，福尔摩斯告诉我的。"}],"words":[["headgear","something worn on the head","头上的东西；头饰"],["loathsome","disgusting; horrible","令人恶心的"],["serpent","a snake","蛇"],["swamp adder","a deadly snake in this story (Conan Doyle invented it)","沼泽蝰蛇（故事里的毒蛇，是作者虚构的）"],["schemer","someone who makes secret, often harmful, plans","阴谋算计的人"],["dog-whip","a whip for handling a dog","打狗鞭"],["reptile","a cold-blooded animal such as a snake","爬行动物"],["indiscreetly","without careful judgment","不谨慎地"]],"think":["“斑点带子”到底是什么？","What was the “speckled band” really?"],"craft":[{"term":"Final reveal / justice 最终揭晓与正义","termZh":"最终揭晓 / 正义","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：the climax reveals the culprit, and justice is served 高潮揭出真凶，正义得到伸张。","quote":"Violence does, in truth, recoil upon the violent, and the schemer falls into the pit which he digs for another","effectEn":"The reveal names the snake, and Roylott is killed by his own plot, which restores a kind of justice.","effectZh":"真相揭晓：那是一条蛇，罗伊洛特死于自己的阴谋，某种正义因此得到伸张。","starters":{"p":"The final reveal restores justice when...","e":"This is seen in the line, “the schemer falls into the pit which he digs for another”.","x":"This is satisfying for the reader because the criminal is destroyed by...","l":"Therefore, this ending follows the crime-fiction convention of a reveal that..."}}]},{"wordCount":275,"sents":[{"en":"“I had,” said he, “come to an entirely erroneous conclusion which shows, my dear Watson, how dangerous it always is to reason from insufficient data.","zh":"“我当时，”他说，“得出了一个完全错误的结论，亲爱的华生，这恰恰说明：在证据不足时进行推理，总是多么危险。"},{"en":"The presence of the gipsies, and the use of the word ‘band,’ which was used by the poor girl, no doubt, to explain the appearance which she had caught a hurried glimpse of by the light of her match, were sufficient to put me upon an entirely wrong scent.","zh":"那些吉卜赛人的出现，再加上那个可怜的姑娘用的‘带子’这个词——毫无疑问，那是她借着火柴的光、匆匆瞥见那个东西时，用来形容它的样子的——足以把我完全引到错误的线索上去。"},{"en":"I can only claim the merit that I instantly reconsidered my position when, however, it became clear to me that whatever danger threatened an occupant of the room could not come either from the window or the door.","zh":"我唯一可以自夸的是，一旦我看清威胁房中之人的危险既不可能来自窗户，也不可能来自房门，我就立刻重新考虑了自己的判断。"},{"en":"My attention was speedily drawn, as I have already remarked to you, to this ventilator, and to the bell-rope which hung down to the bed.","zh":"正像我已经对你说过的，我的注意力很快被吸引到这个通气口，以及垂到床上的那根拉铃绳上。"},{"en":"The discovery that this was a dummy, and that the bed was clamped to the floor, instantly gave rise to the suspicion that the rope was there as a bridge for something passing through the hole and coming to the bed.","zh":"发现绳子是假的、床又被固定在地板上，立刻让人怀疑：这根绳子是给某种东西当桥用的，好让它穿过那个洞，来到床上。"},{"en":"The idea of a snake instantly occurred to me, and when I coupled it with my knowledge that the doctor was furnished with a supply of creatures from India, I felt that I was probably on the right track.","zh":"蛇的念头立刻出现在我脑海里；当我把它和我所知道的——医生拥有一批从印度运来的动物——联系在一起时，我感到自己大概走对了路。"},{"en":"The idea of using a form of poison which could not possibly be discovered by any chemical test was just such a one as would occur to a clever and ruthless man who had had an Eastern training.","zh":"使用一种任何化学检验都不可能测出的毒药，正是一个受过东方训练、既聪明又心狠的人会想到的办法。"},{"en":"The rapidity with which such a poison would take effect would also, from his point of view, be an advantage.","zh":"从他的角度来看，这种毒药发作得极快，也是一个优点。"}],"words":[["erroneous","wrong; mistaken","错误的"],["insufficient","not enough","不充分的"],["glimpse","a very quick look","匆匆一瞥"],["reconsidered","thought about again and changed his mind","重新考虑"],["dummy","not real; it does not work","假的；不起作用的"],["clamped","fixed so that it cannot be moved","固定住的"],["suspicion","a feeling that something is wrong","怀疑"],["ruthless","ready to be cruel to get what he wants","残忍的；心狠的"]],"think":["福尔摩斯一开始猜错了什么？","What did Holmes first get wrong?"],"craft":[{"term":"Deduction / red herring 推理与假线索","termZh":"推理 / 假线索","classTie":"Year 8 English · Crime Fiction：red herring 假线索被识破；detective explains the deduction 侦探说明推理。","quote":"how dangerous it always is to reason from insufficient data","effectEn":"Holmes admits the gipsies were a false lead, then shows how a careful detective corrects a wrong scent.","effectZh":"福尔摩斯承认吉卜赛人是假线索，接着说明一个谨慎的侦探会怎样纠正错误判断。","starters":{"p":"The detective corrects a red herring through deduction when...","e":"This is seen in the line, “how dangerous it always is to reason from insufficient data”.","x":"This is important because it shows that the first theory (the gipsies) was...","l":"Therefore, this explanation models logical detective work and the convention of..."}}]},{"wordCount":341,"sents":[{"en":"It would be a sharp-eyed coroner, indeed, who could distinguish the two little dark punctures which would show where the poison fangs had done their work.","zh":"要分辨出毒牙留下的那两个小小的黑穿刺孔，验尸官得有多么锐利的眼睛才行。"},{"en":"Then I thought of the whistle.","zh":"然后我想到了那声口哨。"},{"en":"Of course he must recall the snake before the morning light revealed it to the victim.","zh":"当然，他必须在晨光把它暴露给受害者之前，把蛇召回去。"},{"en":"He had trained it, probably by the use of the milk which we saw, to return to him when summoned.","zh":"他训练过它，很可能就是用我们看见的那碟牛奶，让它一被召唤就回到他身边。"},{"en":"He would put it through this ventilator at the hour that he thought best, with the certainty that it would crawl down the rope and land on the bed.","zh":"他会在自己认为最合适的时刻，把它从这通气口放进去，确信它会顺着绳子爬下去，落到床上。"},{"en":"It might or might not bite the occupant, perhaps she might escape every night for a week, but sooner or later she must fall a victim.","zh":"它也许会咬、也许不会咬床上的人，她也许一连几夜都能逃过，但迟早一定会成为牺牲品。"},{"en":"“I had come to these conclusions before ever I had entered his room.","zh":"“我在踏进他房间之前，就已经得出了这些结论。"},{"en":"An inspection of his chair showed me that he had been in the habit of standing on it, which of course would be necessary in order that he should reach the ventilator.","zh":"检查他的椅子，可以看出他常常站在上面，当然，那是为了够到通气口。"},{"en":"The sight of the safe, the saucer of milk, and the loop of whipcord were enough to finally dispel any doubts which may have remained.","zh":"看见保险箱、那碟牛奶，以及那个鞭绳圈，就足以彻底打消可能还剩下的任何疑虑。"},{"en":"The metallic clang heard by Miss Stoner was obviously caused by her stepfather hastily closing the door of his safe upon its terrible occupant.","zh":"斯托纳小姐听见的金属当啷声，显然是她继父匆匆把保险箱门关上、把里面那个可怕的‘住客’关进去时发出的。"},{"en":"Having once made up my mind, you know the steps which I took in order to put the matter to the proof.","zh":"一旦拿定主意，你就知道我为了证实这件事采取了哪些步骤。"},{"en":"I heard the creature hiss as I have no doubt that you did also, and I instantly lit the light and attacked it.”","zh":"我听见那东西发出嘶声，我相信你也听见了，于是我立刻点亮灯，向它进攻。”"},{"en":"“With the result of driving it through the ventilator.”","zh":"“结果是把它赶过了通气口。”"},{"en":"“And also with the result of causing it to turn upon its master at the other side.","zh":"“同时也使它在另一边转向了它的主人。"},{"en":"Some of the blows of my cane came home and roused its snakish temper, so that it flew upon the first person it saw.","zh":"我的手杖有几下打中了它，激起了它的蛇性，于是它扑向它看见的第一个人。"},{"en":"In this way I am no doubt indirectly responsible for Dr. Grimesby Roylott’s death, and I cannot say that it is likely to weigh very heavily upon my conscience.”","zh":"就这样，我无疑间接地要对格里姆斯比·罗伊洛特医生的死负责，而我不能说，这件事会沉重地压在我的良心上。”"}],"words":[["coroner","an official who looks into unusual deaths","验尸官"],["punctures","tiny holes made by a sharp point","穿刺的小孔"],["fangs","a snake’s long, sharp teeth","毒牙"],["summoned","called to come","召唤来"],["occupant","the person in the room or bed","房间里的人；床上的人"],["whipcord","a strong, thin cord","细而结实的绳子"],["dispel","to drive away (doubts or fears)","打消（疑虑）"],["conscience","the inner sense of right and wrong","良心"]],"think":["你觉得福尔摩斯对这个结局是什么心情？","How do you think Holmes feels about the ending?"],"craft":[{"term":"The solution 破案","termZh":"破案","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：the solution 结局把线索（当啷声、保险箱）全部说清。","quote":"The metallic clang heard by Miss Stoner was obviously caused by her stepfather hastily closing the door of his safe","effectEn":"A confusing clue is finally explained, so the locked-room mystery makes sense when we look back.","effectZh":"一条让人困惑的线索终于得到解释，回头再看，这个密室之谜就说得通了。","starters":{"p":"The solution ties up a key clue when...","e":"This is seen in the line, “The metallic clang… closing the door of his safe”.","x":"This is effective because a sound that once seemed mysterious is now...","l":"Therefore, this ending follows the convention that the final reveal should make sense when the reader looks back."}}]}];

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2000)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function level(){return Math.floor(S.xp/100)+1}
function todayMin(){return S.minutes[today()]||0}
function goalMet(d){return (S.minutes[d]||0)>=S.dailyGoal}
function streak(){
  let n=0;const d=new Date();
  if(!goalMet(fmt(d)))d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const k=fmt(d);
    if(goalMet(k))n++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function last7(){
  const o=[],d=new Date();d.setDate(d.getDate()-6);
  for(let i=0;i<7;i++){
    o.push({n:'日一二三四五六'[d.getDay()],d:goalMet(fmt(d)),t:i===6});
    d.setDate(d.getDate()+1);
  }
  return o;
}
const T={
  running:false,
  left:SESSION*60,
  endAt:0,
  tick:null
};
function remain(){
  if(T.running)return Math.max(0,Math.ceil((T.endAt-Date.now())/1000));
  return T.left;
}
function mmss(sec){
  sec=Math.max(0,sec|0);
  return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
function startTimer(){
  if(T.running)return;
  if(T.left<=0)T.left=SESSION*60;
  T.running=true;
  T.endAt=Date.now()+T.left*1000;
  loop();
  render();
}
function pauseTimer(){
  if(!T.running)return;
  T.left=remain();
  T.running=false;
  clearTimeout(T.tick);
  render();
}
function finishTimer(){
  const left=remain();
  const elapsed=Math.max(0,SESSION*60-left);
  T.running=false;
  clearTimeout(T.tick);
  T.left=SESSION*60;
  T.endAt=0;
  if(elapsed<=0){toast('还没开始计时 Timer has not started');render();return;}

function escapeRe(t){return String(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function wrapWords(text,words){
  let html=esc(text);
  const terms=[...words].sort((a,b)=>b[0].length-a[0].length);
  for(const [term,en,zh] of terms){
    const forms=[term,term.replace(/'/g,'\u2019'),term.replace(/\u2019/g,"'")];
    let re=null;
    for(const t of forms){
      const cand=new RegExp('(^|[^A-Za-z])('+escapeRe(t)+')(?![A-Za-z])','i');
      if(cand.test(html)){re=cand;break;}
    }
    if(!re)continue;
    html=html.replace(re,function(all,pre,word){
      return pre+'<button type="button" class="w" data-en="'+esc(en)+'" data-zh="'+esc(zh)+'" onclick="showWord(this,event)">'+word+'</button>';
    });
  }
  return html;
}
function wrapRead(text,words){
  return wrapWords(text,words).split('\n\n').map(function(p){return '<p>'+p+'</p>';}).join('');
}
function quotesOf(ex){return (ex.craft||[]).map(c=>c.quote).filter(Boolean)}
function paintSent(s,words,quotes){
  let parts=[{t:s.en,h:false}];
  for(const q of quotes){
    if(!q) continue;
    const next=[];
    for(const p of parts){
      if(p.h){next.push(p);continue;}
      const i=p.t.indexOf(q);
      if(i<0){next.push(p);continue;}
      if(i>0) next.push({t:p.t.slice(0,i),h:false});
      next.push({t:p.t.slice(i,i+q.length),h:true});
      if(i+q.length<p.t.length) next.push({t:p.t.slice(i+q.length),h:false});
    }
    parts=next;
  }
  const inner=parts.map(p=>{
    const w=wrapWords(p.t,words);
    return p.h?'<mark class="craft">'+w+'</mark>':w;
  }).join('');
  return '<div class="sent" role="button" tabindex="0" onclick="toggleSent(this,event)" onkeydown="sentKey(this,event)">'+
    '<div class="enline">'+inner+'</div>'+
    '<div class="zh">'+esc(s.zh)+'</div>'+
    '<span class="hinttap">点这里看中文 Tap for Chinese</span>'+
    '</div>';
}

function chunkSents(sents){
  const ch=[]; let buf=[]; let bw=0;
  for(const s of sents){
    const w=s.en.trim().split(/\s+/).filter(Boolean).length;
    if(!buf.length){buf=[s];bw=w;continue;}
    if(buf.length>=3 || (buf.length>=2 && bw>=35) || (bw>=55 && w>=20) || (bw+w>85 && bw>=25)){
      ch.push(buf); buf=[s]; bw=w;
    } else {buf.push(s); bw+=w;}
  }
  if(buf.length) ch.push(buf);
  return ch;
}
function chunkState(i,ch){

function openDB(){

    if(!window.indexedDB){rej(new Error('no idb'));return;}

    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        const st=db.createObjectStore(DB_STORE,{keyPath:'id',autoIncrement:true});
        st.createIndex('day','day',{unique:false});

  });

function getAllRecs(){

    const q=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).getAll();
    q.onsuccess=()=>{db.close();res(q.result||[])};
    q.onerror=()=>{db.close();rej(q.error)};
  }));
}

    q.onerror=()=>{db.close();rej(q.error)};
  }));
}

function extFor(mime){

function pickMime(){

  const types=['audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/aac','audio/mpeg','audio/webm;codecs=opus','audio/webm'];
  for(const t of types){try{if(MediaRecorder.isTypeSupported(t))return t}catch(e){}}

    completeExcerpt(day);
    return refreshRecs();
  }).then(()=>render()).catch(e=>{
    toast('录音存不下了 Could not save the recording');
    render();
  });
}
function completeExcerpt(i){
  S.readDone[i]=true;
  if(!S.readAwarded[i]){
    S.readAwarded[i]=true;
    S.xp+=10;
    const d=today();
    S.minutes[d]=(S.minutes[d]||0)+10;
    S.awarded[d]=(S.awarded[d]||0)+10;
    toast('+10 XP 读完并录音 Read and recorded');
  }else toast('录音已保存 Recording saved');
  const n=Object.keys(S.readAwarded).filter(k=>S.readAwarded[k]).length;
  if(n>=1) S.badges.firstRec=true;
  if(n>=7) S.badges.excerpts7=true;
  save();checkBadges();
}
function recFile(r){
  const ext=extFor(r.mime);
  return new File([r.blob],`speckled-day${r.day+1}.${ext}`,{type:r.mime||'audio/mp4'});
}
async function shareRec(id){
  const r=REC_CACHE.find(x=>x.id===id);
  if(!r)return;
  const file=recFile(r);
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`Day ${r.day+1} 朗读录音 Reading aloud`});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  downloadRec(id);
}
function downloadRec(id){
  const r=REC_CACHE.find(x=>x.id===id);
  if(!r)return;
  const file=recFile(r);
  const url=URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=url;a.download=file.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('如果没出现分享，请用音频条右边的分享 If nothing appears, use Share on the audio bar');
}
function recListHTML(){
  if(!REC_CACHE.length) return `<p class="sub">还没有录音。先点上面的“录音”，再开始读。No recordings yet. Tap Record at the top, then start reading.</p>`;
  const by=[...REC_CACHE].sort((a,b)=>b.created-a.created);
  return by.map(r=>{
    if(!r._url) r._url=URL.createObjectURL(r.blob);
    const url=r._url;
    const when=new Date(r.created);
    const t=when.getFullYear()+'-'+String(when.getMonth()+1).padStart(2,'0')+'-'+String(when.getDate()).padStart(2,'0')+' '+String(when.getHours()).padStart(2,'0')+':'+String(when.getMinutes()).padStart(2,'0');
    return `<div class="item"><div class="tt">第 ${r.day+1} 段 Day ${r.day+1} · ${r.duration||'?'}s</div><div class="sub">${esc(t)}</div>
      <audio controls playsinline preload="metadata" src="${url}"></audio>
      <div class="strow">
        <button onclick="shareRec(${r.id})">分享 / 下载 Share or download</button>
        <button onclick="if(confirm('删除这段录音？Delete this recording?'))deleteRec(${r.id})">删除 Delete</button>
      </div></div>`;
  }).join('');
}
function render(){
  const d=today(), mins=todayMin(), goal=S.dailyGoal, st=streak(), lv=level();
  const toNext=100-(S.xp%100), pctGoal=Math.min(100,mins/goal*100);
  const r=remain();
  const rewardOn=S.xp>=100;
  const p=promptToday();
  const showSuggest=st>=7 && goal===10 && !S.hideGoalSuggest;
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="top">
    <span class="pill">🔥 ${st} 天 days</span>
    <span class="pill">⭐ Lv${lv} · ${S.xp} XP</span>
    <span class="pill">📖 ${mins} / ${goal} min</span>
  </div>
  <div class="card hero">
    <h1>📖 阅读闯关</h1>
    <div class="sub">Reading Quest · Jesse · 每天先读 10 分钟 Just 10 minutes a day</div>
    <div style="margin-top:12px;font-weight:800">今日目标 Today's goal</div>
    <div class="bar"><i style="width:${pctGoal}%"></i></div>
    <div class="sub" style="text-align:center"><span class="goalnum">${mins}</span> / ${goal} 分钟 minutes</div>
    <div class="days">${last7().map(x=>`<span class="${x.d?'d':''} ${x.t?'t':''}">${x.n}</span>`).join('')}</div>
    <div class="sub" style="text-align:center;margin-top:6px">绿圈 = 当天达标 Green = goal met</div>
  </div>
  ${showSuggest?`<div class="hint"><b>已经连续 7 天啦！You've done 7 days in a row!</b>
    <div class="sub" style="color:#c8ffe8">可以把每日目标加到 15 分钟。You can raise the daily goal to 15 minutes.</div>
    <div class="btns"><button class="btn go" onclick="setGoal(15)">好的，加到 15 分钟 Yes, make it 15</button></div>
    <button class="btn sec" onclick="dismissSuggest()">暂时不用 Not yet</button>
  </div>`:''}
  ${todayReadCard()}
  <div class="card">
    <h2>⏱️ 10 分钟计时 10-minute timer</h2>
    <div class="sub">读完 10 分钟就 +10 XP · Finish 10 minutes, get +10 XP</div>
    <div id="clock" class="timer ${T.running?'run':(r<SESSION*60?'pause':'')}">${mmss(r)}</div>
    <div class="btns">
      <button class="btn go" onclick="startTimer()">${T.running?'继续计时 Running…':'开始 Start'}</button>
      <button class="btn warn" onclick="pauseTimer()">暂停 Pause</button>
    </div>
    <button class="btn" onclick="finishTimer()">完成 Finish</button>
    <h3>手动记录 Manual log</h3>
    <div class="sub">忘了开计时也没关系。You can log minutes if you forgot the timer.</div>
    <div class="strow">
      <button onclick="addMinutes(5,'手动 Manual')">+5 min</button>
      <button onclick="addMinutes(10,'手动 Manual')">+10 min</button>
      <button onclick="addMinutes(15,'手动 Manual')">+15 min</button>
    </div>
    <div class="addrow">
      <input id="manualMin" type="number" min="1" max="180" inputmode="numeric" placeholder="分钟 Minutes">
      <button class="btn small sec" onclick="logManual()">记下 Log</button>
    </div>
  </div>
  <div class="card">
    <h2>🎖️ 等级与徽章 Levels & badges</h2>
    <div class="sub">Lv${lv} · ${S.xp} XP · 再 ${toNext} XP 升到 Lv${lv+1} · ${toNext} XP to next level</div>
    <div class="bar"><i style="width:${(S.xp%100)}%"></i></div>
    <div class="grid">${BADGES.map(([id,ic,n])=>`<div class="badge ${S.badges[id]?'on':''}"><b>${ic}</b>${n}</div>`).join('')}</div>
    <div class="reward ${rewardOn?'on':''}">
      <div style="font-weight:800">${rewardOn?'🎁 奖励已解锁 Reward unlocked':'🎁 满 100 XP 解锁奖励 Unlock at 100 XP'} · 现在 ${S.xp} XP</div>
      <p id="rewardTxt" style="margin:8px 0 0">${esc(S.rewardText)}</p>
      <button class="btn small sec" onclick="editReward()">家长编辑奖励 Parent: edit reward</button>
    </div>
  </div>
  <div class="card">
    <h2>🎧 先听后读 Listen first</h2>
    <p class="sub">边听边看文字，一次大约 10 分钟，停在最想知道下文的地方。Listen while following the text, about 10 minutes, and stop at a cliffhanger.</p>
    <p><b>斑点带子案 The Speckled Band</b> · Arthur Conan Doyle</p>
    <a class="btn go" href="https://www.youtube.com/watch?v=dSvwTYQsigE" target="_blank" rel="noopener">简易英文有声书 Simple English audiobook ▶</a>
    <a class="btn sec" href="https://www.youtube.com/watch?v=rI4fuGxy8Qs" target="_blank" rel="noopener">完整有声书 Full audiobook ▶</a>
  </div>
  <div class="card">
    <h2>📚 自己挑书 Pick your book</h2>
    <p class="sub">喜欢足球、游戏还是悬疑，都可以。从漫画小说开始也完全没问题。Football, games or mystery — start with a graphic novel if you like.</p>
    ${allBooks().map(bookCard).join('')}
    <h3>加上我自己的书 Add my own title</h3>
    <div class="addrow">
      <input id="newBook" maxlength="80" placeholder="书名 Book title">
      <button class="btn small" onclick="addBook()">添加 Add</button>
    </div>
    <a class="btn sec" href="../year9/" style="margin-top:14px">学校书单 School book list（九年级 Year 9）→</a>
  </div>
  <div class="card">
    <h2>💬 讲给妈妈听 Tell Mum</h2>
    <p class="sub">晚饭时讲一句就行，不考试、不纠错。Just tell Mum one thing at dinner — no test, no corrections.</p>
    <div class="prompt">${esc(p[0])}<span class="en">${esc(p[1])}</span></div>
    <div class="btns">
      <button class="btn sec" onclick="nextPrompt()">换一句 Another question</button>
      <button class="btn ${S.toldMum[d]?'go':''}" onclick="toldMum()">${S.toldMum[d]?'今天讲过了 Told Mum ✓':'今天讲过了 I told Mum'}</button>
    </div>
  </div>
  <div class="card">
    <h2>⚙️ 说明 Notes</h2>
    <p class="sub">进度只存在这台手机的浏览器里。Progress is saved on this phone only (localStorage). 录音存在本机 IndexedDB。Recordings are stored in IndexedDB on this phone.</p>
    <p class="sub">每日目标从 10 分钟开始，连续 7 天后再加到 15 分钟。Daily goal starts at 10 minutes; consider 15 after a 7-day streak.</p>
    <button class="btn small sec" onclick="setGoal(10)">目标 10 分钟 Goal 10</button>
    <button class="btn small sec" onclick="setGoal(15)">目标 15 分钟 Goal 15</button>
  </div>`;
  loop();
}
document.addEventListener('visibilitychange',()=>{if(T.running)loop()});
document.addEventListener('click',e=>{if(e.target.id==='wsheet')closeSheet()});
checkBadges();
if(typeof S.readI!=='number'||S.readI<0||S.readI>=EXCERPTS.length||S.readDone[S.readI]) S.readI=firstUnfinished();
render();
refreshRecs();
</script>
</body>
