<!doctype html>
<html lang="zh-CN">
<head>

<title>阅读闯关 Reading Quest · Jesse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0f1226;--card:#1a1e3d;--card2:#20254a;--line:#3a4080;--y:#ffcc33;--b:#3ec5ff;--g:#2ee59d;--o:#ff9d3d;--p:#ff7ab6;--r:#ff5c7a;--v:#7c5cff;--t:#eef0ff;--m:#a9afd9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:12px 14px}
.top{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;flex-wrap:wrap}
.pill{background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.hero{background:linear-gradient(135deg,#ff7ab6,#7c5cff 55%,#3ec5ff);border:none}
.hero h1{margin:0;font-size:22px}
h2{font-size:19px;margin:4px 0 8px}
h3{font-size:16px;margin:12px 0 6px;color:var(--y)}
.sub{color:var(--m);font-size:13px}
.hero .sub{color:#fff;opacity:.9}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:13px;font-size:17px;font-weight:800;background:var(--y);color:#1b1b1b;box-shadow:0 5px 0 #b38a00;margin:10px 0;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.btn.sec{background:var(--card2);color:var(--t);box-shadow:0 4px 0 #0a0c1c}
.btn.sec:active{box-shadow:0 2px 0 #0a0c1c}
.btn.go{background:var(--g);color:#06331f;box-shadow:0 5px 0 #1a8a5c}
.btn.go:active{box-shadow:0 2px 0 #1a8a5c}
.btn.warn{background:var(--o);color:#331a06;box-shadow:0 5px 0 #b36a1a}
.btn.warn:active{box-shadow:0 2px 0 #b36a1a}
.btn.small{display:inline-block;width:auto;padding:7px 12px;font-size:14px;margin:4px 4px 4px 0}
.btns{display:flex;gap:8px}
.btns .btn{flex:1;margin:10px 0}
.timer{font-size:64px;font-weight:800;text-align:center;letter-spacing:2px;color:var(--y);line-height:1;margin:16px 0 8px;font-variant-numeric:tabular-nums}
.timer.run{color:var(--g)}
.timer.pause{color:var(--o)}
.bar{height:10px;background:#0c0f22;border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b));border-radius:99px;width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card2);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;opacity:.35}
.badge.on{opacity:1;border:1px solid var(--y)}
.badge b{display:block;font-size:26px}
nav{position:fixed;bottom:0;left:0;right:0;background:#11142b;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav a{flex:1;max-width:160px;background:none;border:none;color:var(--m);padding:8px 0 9px;font-size:11px;cursor:pointer;text-decoration:none;text-align:center}
nav a b{display:block;font-size:22px}
nav a.on{color:var(--y)}
input,textarea,select{width:100%;background:#0c0f22;color:var(--t);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-family:inherit}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--y);color:#1b1b1b;font-weight:800;padding:10px 18px;border-radius:99px;z-index:60;display:none;max-width:90%;text-align:center}
.days{display:flex;justify-content:space-between;margin-top:8px}
.days span{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px}
.days span.d{background:var(--g);color:#06331f;font-weight:800}
.days span.t{outline:2px solid var(--y)}
.book{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;background:var(--card2);border-radius:14px;margin:8px 0;border:2px solid transparent}
.book.reading{border-color:var(--b)}
.book.done{border-color:var(--g);background:#11493a}
.book .ic{font-size:26px;flex:none}
.book .tt{font-weight:700}
.strow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.strow button{border:1px solid var(--line);background:#0c0f22;color:var(--m);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;cursor:pointer}
.strow button.on{background:var(--g);color:#06331f;border-color:var(--g)}
.strow button.on.reading{background:var(--b);color:#062233;border-color:var(--b)}
.prompt{font-size:20px;font-weight:800;margin:8px 0 4px;line-height:1.35}
.prompt .en{display:block;color:#bfe9ff;font-size:16px;font-weight:700;margin-top:4px}
.reward{background:var(--card2);border-radius:14px;padding:12px;margin:8px 0;border:2px dashed var(--line)}
.reward.on{border-style:solid;border-color:var(--y);background:#3a3010}
.hint{background:#11493a;border:1px solid var(--g);border-radius:14px;padding:12px;margin:8px 0}
a.ylink{color:var(--b);font-weight:700;text-decoration:none}
.row{display:flex;gap:8px;align-items:center}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1}
.addrow .btn{width:auto;margin:0;padding:10px 14px;flex:none}
.goalnum{font-size:28px;font-weight:800;color:var(--y)}
.readtext{font-size:var(--rs,19px);line-height:1.75;color:var(--t)}
.readtext p{margin:0 0 1em}
.readtext p:last-child{margin-bottom:0}
button.w{background:none;border:none;padding:0;margin:0;color:inherit;font:inherit;border-bottom:1px dotted var(--b);cursor:pointer;line-height:inherit;box-shadow:none;border-radius:0;display:inline;font-weight:700}
button.w:active{color:var(--b)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#1d2248;border-top:2px solid var(--b);border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));z-index:50;max-width:520px;margin:0 auto;box-shadow:0 -10px 30px #0009;transform:translateY(110%);transition:transform .2s}
.sheet.open{transform:none}
.sheet .big{font-size:24px;font-weight:800;color:var(--b)}
.sheet .en{color:#bfe9ff;margin:6px 0 2px}
.fsrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.recclock{font-size:28px;font-weight:800;text-align:center;color:var(--r);font-variant-numeric:tabular-nums;margin:8px 0}
.recclock.on{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.reclist .item{background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0}
.reclist audio{width:100%;margin-top:6px}
.progdots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.progdots i{width:14px;height:14px;border-radius:50%;background:var(--card2);display:block;border:0;padding:0;cursor:pointer}
.progdots i.on{outline:2px solid var(--y)}
.progdots i.done{background:var(--g)}


.readhead{position:sticky;top:0;z-index:8;background:var(--card);margin:0 -16px 8px;padding:8px 16px 10px;border-bottom:1px solid var(--line);box-shadow:0 8px 16px #0006}
.readhead .dayline{font-weight:800;font-size:16px;margin:0 0 4px}
.recbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.recbar .recclock{font-size:20px;margin:0;min-width:68px;text-align:left}
.recbar #recBtn{width:auto;flex:1;min-width:132px;margin:0;padding:10px 14px;font-size:16px}
.recbar .tip{flex:1 1 100%;margin:0;font-size:12px;color:var(--m)}
.recbar .recnote{flex:1 1 100%;margin:0}
.recbar audio{width:100%;flex:1 1 100%;margin:2px 0 0}
.chunk{background:var(--card2);border-radius:16px;padding:12px 14px;margin:12px 0;border:1px solid var(--line)}
.chunk .n{font-size:12px;font-weight:800;color:var(--y);margin:0 0 8px}
.sent{margin:0 0 14px;cursor:pointer;border-radius:10px;padding:2px 0 2px 2px}
.sent:last-child{margin-bottom:0}
.sent:active{background:#161a3a}
.sent .enline{line-height:1.8}
.sent .zh{display:none;margin-top:8px;padding:8px 10px;background:#0c0f22;border-left:3px solid var(--b);border-radius:8px;color:#d4dbff;font-size:15px;line-height:1.65;font-weight:400}
.sent.open .zh{display:block}
.sent .hinttap{display:block;font-size:11px;color:var(--m);margin-top:4px;font-weight:400}
.sent.open .hinttap{display:none}
mark.craft{background:#5a3a00;color:var(--y);padding:0 3px;border-radius:4px}
.chunknav{margin:8px 0 12px}
.craftcard{background:#2a2250;border:1px solid var(--v);border-radius:16px;padding:12px 14px;margin:12px 0}
.craftcard h3{margin-top:0}
.craftcard .term{font-weight:800;color:#d4c4ff;font-size:16px}
.craftcard .tie{font-size:13px;color:var(--m);margin:6px 0}
.craftcard .quote{font-style:italic;color:var(--y);margin:8px 0;line-height:1.5}
.craftcard .effect{margin:8px 0}
.craftcard .effect .en{display:block;color:#bfe9ff;font-weight:700;margin-top:4px;font-style:normal}
.craftcard .starters{background:#0c0f22;border-radius:12px;padding:10px 12px;margin-top:8px}
.craftcard .starters ul{margin:8px 0 0;padding-left:18px}
.craftcard .starters li{margin:8px 0;line-height:1.45}
.craftcard .warn{font-size:12px;color:var(--o);margin-top:10px;line-height:1.45}

</style>
</head>

<script>
const EXCERPTS=[{"wordCount":331,"sents":[{"en":"On glancing over my notes of the seventy odd cases in which I have during the last eight years studied the methods of my friend Sherlock Holmes, I find many tragic, some comic, a large number merely strange, but none commonplace; for, working as he did rather for the love of his art than for the acquirement of wealth, he refused to associate himself with any investigation which did not tend towards the unusual, and even the fantastic.","zh":"我翻看这八年来记下的七十多件案子，研究我的朋友福尔摩斯的方法，发现其中有不少悲惨的，有一些滑稽的，还有许多只是离奇，但没有一件是平平无奇的；因为他做事是出于对这门技艺的热爱，而不是为了发财，所以凡是不带点不寻常、甚至近乎荒诞色彩的调查，他一概不肯接手。"},{"en":"Of all these varied cases, however, I cannot recall any which presented more singular features than that which was associated with the well-known Surrey family of the Roylotts of Stoke Moran.","zh":"然而，在所有这些各不相同的案子里，我印象最深、特征最奇特的，还要数萨里郡斯托克莫兰那户有名的罗伊洛特家族这一件。"},{"en":"The events in question occurred in the early days of my association with Holmes, when we were sharing rooms as bachelors in Baker Street.","zh":"这件事发生在我和福尔摩斯相识不久的时候，那时我们还是单身，同住在贝克街。"},{"en":"It is possible that I might have placed them upon record before, but a promise of secrecy was made at the time, from which I have only been freed during the last month by the untimely death of the lady to whom the pledge was given.","zh":"这件事我本可以更早记录下来，可当时我答应过要保密，直到上个月，那位曾要我起誓的女士不幸去世，我才得以解脱。"},{"en":"It is perhaps as well that the facts should now come to light, for I have reasons to know that there are widespread rumours as to the death of Dr. Grimesby Roylott which tend to make the matter even more terrible than the truth.","zh":"现在把真相公之于众也许更好，因为我知道，关于格里姆斯比·罗伊洛特医生之死，外面流传着种种谣言，把这件事说得比真相还要可怕。"},{"en":"It was early in April in the year ’83 that I woke one morning to find Sherlock Holmes standing, fully dressed, by the side of my bed.","zh":"那是一八八三年四月初的一个早晨，我醒来时发现福尔摩斯已经穿戴整齐，站在我的床边。"},{"en":"He was a late riser, as a rule, and as the clock on the mantelpiece showed me that it was only a quarter-past seven, I blinked up at him in some surprise, and perhaps just a little resentment, for I was myself regular in my habits.","zh":"他通常起得很晚，壁炉架上的钟才七点一刻，我有些吃惊地朝他眨眼，心里也许还带着一点不高兴，因为我自己作息很规律。"},{"en":"“Very sorry to knock you up, Watson,” said he, “but it’s the common lot this morning.","zh":"“很抱歉把你叫醒，华生，”他说，“可今早谁都没法睡了。"},{"en":"Mrs. Hudson has been knocked up, she retorted upon me, and I on you.”","zh":"哈德森太太先被叫醒，她把气出在我身上，我只好再来叫你。”"},{"en":"“What is it, then—a fire?”","zh":"“怎么了——着火了吗？”"}],"words":[["commonplace","ordinary; nothing special","平常的；没什么特别"],["acquirement","the getting of something","获得"],["fantastic","very strange or hard to believe","离奇的"],["singular","unusual; unlike anything else","奇特的"],["bachelors","unmarried men","单身汉"],["untimely","happening too soon","过早的"],["rumours","stories people repeat that may not be true","谣言"],["knock you up","wake you up (old-fashioned English, not the modern slang)","叫醒（旧时说法，不是现代俚语）"]],"think":["福尔摩斯为什么更喜欢离奇的案子？","Why does Holmes prefer strange cases?"],"craft":[{"term":"First-person / sidekick narrator 第一人称（助手叙述）","termZh":"第一人称 / 助手叙述","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：sidekick 助手（华生）叙述，读者和侦探同步得到线索。","quote":"On glancing over my notes of the seventy odd cases","effectEn":"Watson tells the story in the first person, so we discover facts at the same pace as he does, not all at once.","effectZh":"由华生用第一人称讲述，我们和他也是一点一点知道案情，而不是一开始就全知道。","starters":{"p":"Conan Doyle uses a first-person sidekick narrator to...","e":"This is seen when Watson writes, “On glancing over my notes…”.","x":"This has the effect of... because the reader...","l":"Therefore, this supports the crime-fiction convention of the sidekick who..."}}]},{"wordCount":366,"sents":[{"en":"“No; a client.","zh":"“不是；是一位委托人。"},{"en":"It seems that a young lady has arrived in a considerable state of excitement, who insists upon seeing me.","zh":"好像有一位年轻女士到了，情绪非常激动，坚持要见我。"},{"en":"She is waiting now in the sitting-room.","zh":"她此刻正在起居室里等着。"},{"en":"Now, when young ladies wander about the metropolis at this hour of the morning, and knock sleepy people up out of their beds, I presume that it is something very pressing which they have to communicate.","zh":"要知道，年轻女士大清早就在这大城市里奔走，还把还在睡觉的人从床上叫起来，我想她要说的一定非常要紧。"},{"en":"Should it prove to be an interesting case, you would, I am sure, wish to follow it from the outset.","zh":"如果这会是一件有意思的案子，我相信你一定希望从头跟起。"},{"en":"I thought, at any rate, that I should call you and give you the chance.”","zh":"所以我想，至少该把你叫醒，给你这个机会。”"},{"en":"“My dear fellow, I would not miss it for anything.”","zh":"“老兄，这种事我绝不会错过。”"},{"en":"I had no keener pleasure than in following Holmes in his professional investigations, and in admiring the rapid deductions, as swift as intuitions, and yet always founded on a logical basis with which he unravelled the problems which were submitted to him.","zh":"对我来说，最大的乐趣莫过于跟着福尔摩斯做调查，欣赏他那些又快得像直觉、却又总是建立在逻辑之上的推理，看他把送到他面前的难题一一解开。"},{"en":"I rapidly threw on my clothes and was ready in a few minutes to accompany my friend down to the sitting-room.","zh":"我很快穿好衣服，几分钟后就跟着朋友下楼，走进起居室。"},{"en":"A lady dressed in black and heavily veiled, who had been sitting in the window, rose as we entered.","zh":"一位身穿黑衣、蒙着厚面纱的女士本来坐在窗边，见我们进来，便站了起来。"},{"en":"“Good-morning, madam,” said Holmes cheerily.","zh":"“早上好，夫人，”福尔摩斯愉快地说。"},{"en":"“My name is Sherlock Holmes.","zh":"“我是歇洛克·福尔摩斯。"},{"en":"This is my intimate friend and associate, Dr. Watson, before whom you can speak as freely as before myself.","zh":"这位是我的亲密朋友和搭档华生医生，你在他面前可以像在我面前一样，什么都说。"},{"en":"Ha!","zh":"哈！"},{"en":"I am glad to see that Mrs. Hudson has had the good sense to light the fire.","zh":"我很高兴哈德森太太还懂得把火生上。"},{"en":"Pray draw up to it, and I shall order you a cup of hot coffee, for I observe that you are shivering.”","zh":"请靠近火炉坐，我叫人给你倒杯热咖啡，我看你在发抖。”"},{"en":"“It is not cold which makes me shiver,” said the woman in a low voice, changing her seat as requested.","zh":"“让我发抖的不是冷，”那女士低声说，照他的话换了个座位。"},{"en":"“What, then?”","zh":"“那是什么？”"},{"en":"“It is fear, Mr. Holmes.","zh":"“是害怕，福尔摩斯先生。"},{"en":"It is terror.”","zh":"是恐惧。”"},{"en":"She raised her veil as she spoke, and we could see that she was indeed in a pitiable state of agitation, her face all drawn and grey, with restless frightened eyes, like those of some hunted animal.","zh":"她一边说一边掀起面纱，我们这才看见她激动得可怜：脸色灰白、神情紧绷，眼睛惊惶不定，像一头被追捕的动物。"},{"en":"Her features and figure were those of a woman of thirty, but her hair was shot with premature grey, and her expression was weary and haggard.","zh":"论相貌和身材，她不过三十岁左右，可头发已经过早花白，神情疲惫而憔悴。"},{"en":"Sherlock Holmes ran her over with one of his quick, all-comprehensive glances.","zh":"福尔摩斯用他那种迅疾而又面面俱到的目光，把她上下打量了一遍。"}],"words":[["client","a person who comes for help","客户；来求助的人"],["metropolis","a very large city (here, London)","大都市（这里指伦敦）"],["deductions","conclusions reached by careful thinking","推理；推断"],["intuitions","ideas you feel without step-by-step thinking","直觉"],["unravelled","figured out; untangled","解开；查明"],["veiled","wearing a veil over the face","蒙着面纱的"],["pitiable","making you feel sorry for someone","可怜的"],["haggard","looking very tired and worn","憔悴的"]],"think":["这位女士为什么一大早就赶来？","Why do you think the young lady came so early?"],"craft":[{"term":"Simile 明喻","termZh":"明喻","classTie":"Year 8 English · language forms and features 语言形式与特点；Crime Fiction 里用来塑造受害者。","quote":"restless frightened eyes, like those of some hunted animal","effectEn":"The simile compares her eyes to a hunted animal, so the reader immediately feels her terror and sees her as the victim.","effectZh":"这个明喻把她的眼睛比作被追捕的动物，读者立刻感到她的恐惧，也看出她是受害者。","starters":{"p":"The composer uses a simile to characterise the victim as...","e":"This is seen in the line, “restless frightened eyes, like those of some hunted animal”.","x":"This encourages the reader to... because...","l":"Therefore, this helps the text work as crime fiction by presenting a clear..."}}]},{"wordCount":336,"sents":[{"en":"“You must not fear,” said he soothingly, bending forward and patting her forearm.","zh":"“你不必害怕，”他温和地说，俯身轻轻拍了拍她的前臂。"},{"en":"“We shall soon set matters right, I have no doubt.","zh":"“我们很快就能把事情理顺，我毫不怀疑。"},{"en":"You have come in by train this morning, I see.”","zh":"我看，你是今天早晨坐火车来的。”"},{"en":"“You know me, then?”","zh":"“这么说，你认识我？”"},{"en":"“No, but I observe the second half of a return ticket in the palm of your left glove.","zh":"“不认识，可我看见你左手手套掌心里有半张回程车票。"},{"en":"You must have started early, and yet you had a good drive in a dog-cart, along heavy roads, before you reached the station.”","zh":"你一定动身很早，而且在到达车站之前，还坐着双轮马车，在泥泞的路上走了好一段。”"},{"en":"The lady gave a violent start and stared in bewilderment at my companion.","zh":"那位女士猛地一惊，困惑地盯着我的同伴。"},{"en":"“There is no mystery, my dear madam,” said he, smiling.","zh":"“这没什么神秘的，亲爱的夫人，”他笑着说。"},{"en":"“The left arm of your jacket is spattered with mud in no less than seven places.","zh":"“你上衣的左袖上，至少溅了七处泥点。"},{"en":"The marks are perfectly fresh.","zh":"这些痕迹还非常新。"},{"en":"There is no vehicle save a dog-cart which throws up mud in that way, and then only when you sit on the left-hand side of the driver.”","zh":"会把泥溅成这样的，只有双轮马车，而且只有你坐在驾车人左边时才会这样。”"},{"en":"“Whatever your reasons may be, you are perfectly correct,” said she.","zh":"“不管你是怎么看出来的，你完全正确，”她说。"},{"en":"“I started from home before six, reached Leatherhead at twenty past, and came in by the first train to Waterloo.","zh":"“我不到六点就从家里出发，二十分到达莱瑟黑德，再坐第一班火车来到滑铁卢。"},{"en":"Sir, I can stand this strain no longer; I shall go mad if it continues.","zh":"先生，我再也受不了这种压力了；再这样下去我会发疯的。"},{"en":"I have no one to turn to—none, save only one, who cares for me, and he, poor fellow, can be of little aid.","zh":"我没有人可以求助——只有一个人在乎我，可他，可怜的人，也帮不上什么忙。"},{"en":"I have heard of you, Mr. Holmes; I have heard of you from Mrs. Farintosh, whom you helped in the hour of her sore need.","zh":"我听说过您，福尔摩斯先生；是法林托什太太告诉我的，您曾在她最困难的时候帮过她。"},{"en":"It was from her that I had your address.","zh":"您的地址也是她给我的。"},{"en":"Oh, sir, do you not think that you could help me, too, and at least throw a little light through the dense darkness which surrounds me?","zh":"哦，先生，您能不能也帮帮我，至少在包围着我的这片黑暗里，给我一点亮光？"},{"en":"At present it is out of my power to reward you for your services, but in a month or six weeks I shall be married, with the control of my own income, and then at least you shall not find me ungrateful.”","zh":"眼下我还没有能力酬谢您，但再过一个月或六个星期我就要结婚了，那时我可以自己支配收入，至少不会让您觉得我忘恩负义。”"},{"en":"Holmes turned to his desk and, unlocking it, drew out a small case-book, which he consulted.","zh":"福尔摩斯转向书桌，打开锁，抽出一本小小的案件记录本，翻看起来。"}],"words":[["soothingly","in a gentle, calming way","安慰地；温和地"],["dog-cart","a light horse-drawn cart","双轮轻便马车"],["bewilderment","complete surprise and confusion","困惑；茫然"],["spattered","splashed in small spots","溅到的"],["strain","stress that is hard to bear","压力；紧张"],["case-book","a notebook of past cases","案件记录本"],["ungrateful","not thankful","忘恩的"],["sore need","a time of great trouble","紧急困境"]],"think":["福尔摩斯是怎么看出她一路怎么来的？","How did Holmes work out her journey?"],"craft":[{"term":"Deduction 推理 / Super sleuth 大侦探","termZh":"推理 / 大侦探","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：super sleuth 大侦探能看见别人看不见的线索。","quote":"The left arm of your jacket is spattered with mud in no less than seven places","effectEn":"Holmes reads small clues (mud, a ticket) and reconstructs her journey, showing the detective’s skill.","effectZh":"福尔摩斯从泥点和车票这些小线索，推断出她一路怎么来的，显示出侦探的本领。","starters":{"p":"Conan Doyle presents Holmes as a super sleuth through deduction when...","e":"This is seen in the line, “The left arm of your jacket is spattered with mud…”.","x":"This shows the detective’s skill because...","l":"Therefore, this fits the convention of the observant, logical detective who..."}}]},{"wordCount":274,"sents":[{"en":"“Farintosh,” said he.","zh":"“法林托什，”他说。"},{"en":"“Ah yes, I recall the case; it was concerned with an opal tiara.","zh":"“啊，对，我想起来了；那件案子跟一顶蛋白石头冠有关。"},{"en":"I think it was before your time, Watson.","zh":"华生，我想那还是在你认识我之前。"},{"en":"I can only say, madam, that I shall be happy to devote the same care to your case as I did to that of your friend.","zh":"夫人，我只能说，我会像对待你朋友的案子一样，认真对待你的事。"},{"en":"As to reward, my profession is its own reward; but you are at liberty to defray whatever expenses I may be put to, at the time which suits you best.","zh":"至于报酬，我的职业本身就是报酬；不过你方便的时候，可以把我垫付的开销还给我。"},{"en":"And now I beg that you will lay before us everything that may help us in forming an opinion upon the matter.”","zh":"现在，请你把一切可能帮助我们判断的事情，都讲给我们听。”"},{"en":"“Alas!” replied our visitor, “the very horror of my situation lies in the fact that my fears are so vague, and my suspicions depend so entirely upon small points, which might seem trivial to another, that even he to whom of all others I have a right to look for help and advice looks upon all that I tell him about it as the fancies of a nervous woman.","zh":"“唉！”我们的来访者答道，“我这处境最可怕的地方就在于：我的恐惧很模糊，我的怀疑又完全建立在一些在别人看来也许微不足道的小事上，就连我最有权利去求助的那个人，也把我讲的这一切看成是一个神经质女人的胡思乱想。"},{"en":"He does not say so, but I can read it from his soothing answers and averted eyes.","zh":"他并不明说，可我从他那些安慰的回答和避开的目光里，已经看出来了。"},{"en":"But I have heard, Mr. Holmes, that you can see deeply into the manifold wickedness of the human heart.","zh":"可是我听说，福尔摩斯先生，您能深深看穿人心里各种各样的邪恶。"},{"en":"You may advise me how to walk amid the dangers which encompass me.”","zh":"请您指点我，在包围着我的危险里该怎样走下去。”"},{"en":"“I am all attention, madam.”","zh":"“夫人，我在认真听。”"},{"en":"“My name is Helen Stoner, and I am living with my stepfather, who is the last survivor of one of the oldest Saxon families in England, the Roylotts of Stoke Moran, on the western border of Surrey.”","zh":"“我叫海伦·斯托纳，和我的继父住在一起。他是英格兰最古老的撒克逊家族之一——萨里郡西边斯托克莫兰的罗伊洛特家族——最后一名在世的人。”"},{"en":"Holmes nodded his head.","zh":"福尔摩斯点了点头。"},{"en":"“The name is familiar to me,” said he.","zh":"“这个名字我熟悉，”他说。"}],"words":[["opal tiara","a jewelled crown-like headpiece","蛋白石头冠"],["defray","to pay for (the costs)","支付（费用）"],["Alas","an old word for “sadly”","唉（旧时感叹词）"],["vague","not clear","模糊的"],["trivial","seeming small or unimportant","琐碎的；不足道的"],["averted","turned away","避开的；躲开的"],["manifold","many and varied","多种多样的"],["encompass","to surround on all sides","包围"]],"think":["她为什么觉得别人不会相信她？","Why does she feel other people will not believe her?"],"craft":[{"term":"Withheld information 隐瞒信息","termZh":"隐瞒信息","classTie":"Year 8 English · Building suspense 营造悬念：withheld information 先不说满，让读者着急知道。","quote":"my fears are so vague, and my suspicions depend so entirely upon small points","effectEn":"Helen cannot yet name the danger, so the reader is kept guessing and wants to hear more.","effectZh":"海伦还说不清危险是什么，读者也被吊着，更想往下听。","starters":{"p":"Suspense is created by withheld information when...","e":"This is seen when Helen says, “my fears are so vague…”.","x":"This makes the reader feel... because the danger is...","l":"Therefore, this is one way the composer begins to build suspense by..."}}]},{"wordCount":356,"sents":[{"en":"“The family was at one time among the richest in England, and the estates extended over the borders into Berkshire in the north, and Hampshire in the west.","zh":"“这个家族一度是英格兰最富有的家族之一，地产向北延伸到伯克郡，向西到汉普郡。"},{"en":"In the last century, however, four successive heirs were of a dissolute and wasteful disposition, and the family ruin was eventually completed by a gambler in the days of the Regency.","zh":"可是到了上一世纪，连续四个继承人生活放荡、挥霍无度，到摄政时期，又出一个赌徒，终于把家业彻底败光。"},{"en":"Nothing was left save a few acres of ground, and the two-hundred-year-old house, which is itself crushed under a heavy mortgage.","zh":"最后只剩了几英亩地，还有那座有两百年历史的宅子，宅子本身也被沉重的抵押压得喘不过气。"},{"en":"The last squire dragged out his existence there, living the horrible life of an aristocratic pauper; but his only son, my stepfather, seeing that he must adapt himself to the new conditions, obtained an advance from a relative, which enabled him to take a medical degree and went out to Calcutta, where, by his professional skill and his force of character, he established a large practice.","zh":"最后一任乡绅就在那儿苟延残喘，过着贵族贫民般可怕的日子；可他的独子，也就是我的继父，看出自己必须适应新处境，便向一位亲戚借了一笔钱，去读了医学学位，后来到了加尔各答，凭着医术和强硬的性格，在那儿开起了很大的诊所。"},{"en":"In a fit of anger, however, caused by some robberies which had been perpetrated in the house, he beat his native butler to death and narrowly escaped a capital sentence.","zh":"可是有一次，因为家里发生了几起盗窃，他大怒之下把当地的管家打死了，差点被判死刑。"},{"en":"As it was, he suffered a long term of imprisonment and afterwards returned to England a morose and disappointed man.","zh":"结果他坐了很长时间的牢，后来回到英国，成了一个阴郁而失意的人。"},{"en":"“When Dr. Roylott was in India he married my mother, Mrs. Stoner, the young widow of Major-General Stoner, of the Bengal Artillery.","zh":"“罗伊洛特医生在印度时，娶了我的母亲斯托纳太太，她是孟加拉炮兵斯托纳少将的年轻遗孀。"},{"en":"My sister Julia and I were twins, and we were only two years old at the time of my mother’s re-marriage.","zh":"我姐姐朱莉娅和我是双胞胎，母亲再婚时我们才两岁。"},{"en":"She had a considerable sum of money—not less than £ 1000 a year—and this she bequeathed to Dr. Roylott entirely while we resided with him, with a provision that a certain annual sum should be allowed to each of us in the event of our marriage.","zh":"母亲有一笔可观的财产——每年不少于一千英镑——在我们和他同住期间，这笔钱全部留给了罗伊洛特医生，但规定如果我们结婚，每人每年都可以得到一笔津贴。"},{"en":"Shortly after our return to England my mother died—she was killed eight years ago in a railway accident near Crewe.","zh":"我们回到英国后不久，母亲就去世了——那是八年前，她在克鲁附近的一次火车事故中遇难。"},{"en":"Dr. Roylott then abandoned his attempts to establish himself in practice in London and took us to live with him in the old ancestral house at Stoke Moran.","zh":"罗伊洛特医生于是放弃了在伦敦开业的打算，带着我们住进了斯托克莫兰那座古老的祖宅。"},{"en":"The money which my mother had left was enough for all our wants, and there seemed to be no obstacle to our happiness.","zh":"母亲留下的钱足够我们日常所需，当时看来，幸福生活并没有什么障碍。"}],"words":[["estates","large pieces of family land and property","地产；产业"],["dissolute","living in a wild, wasteful way","放荡的"],["wasteful","spending too much, without care","挥霍的"],["disposition","a person’s usual character or temper","性情；性格"],["mortgage","a loan that uses property as a guarantee","抵押借款"],["widow","a woman whose husband has died","寡妇"],["Calcutta","a large city in India (now Kolkata)","加尔各答（印度大城市）"],["practice","a doctor’s business and patients","诊所；行医业务"]],"think":["罗伊洛特这一家从前发生了什么变化？","What changed in the Roylott family over time?"],"craft":[{"term":"Motive 动机","termZh":"动机","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：motive 动机（为什么犯罪）。","quote":"a certain annual sum should be allowed to each of us in the event of our marriage","effectEn":"The will plants a money motive early: if the daughters marry, Roylott loses income.","effectZh":"遗嘱很早就埋下金钱动机：女儿一结婚，罗伊洛特就会少掉一笔收入。","starters":{"p":"A key crime-fiction convention in this extract is motive, which is suggested when...","e":"This is seen in the line about “a certain annual sum… in the event of our marriage”.","x":"This is important because it gives the stepfather a reason to...","l":"Therefore, this plants a possible motive that later helps to..."}}]},{"wordCount":343,"sents":[{"en":"“But a terrible change came over our stepfather about this time.","zh":"“可大约就在这时，继父身上起了可怕的变化。"},{"en":"Instead of making friends and exchanging visits with our neighbours, who had at first been overjoyed to see a Roylott of Stoke Moran back in the old family seat, he shut himself up in his house and seldom came out save to indulge in ferocious quarrels with whoever might cross his path.","zh":"邻居们起初很高兴看到斯托克莫兰的罗伊洛特家人重新回到老宅，可他并不和他们来往，而是把自己关在家里，很少出门，一出来就跟碰上的人凶狠地争吵。"},{"en":"Violence of temper approaching to mania has been hereditary in the men of the family, and in my stepfather’s case it had, I believe, been intensified by his long residence in the tropics.","zh":"这个家族的男人里，暴烈近乎疯狂的脾气是一代代传下来的；而在我继父身上，我相信，长期住在热带又把这脾气加重了。"},{"en":"A series of disgraceful brawls took place, two of which ended in the police-court, until at last he became the terror of the village, and the folks would fly at his approach, for he is a man of immense strength, and absolutely uncontrollable in his anger.","zh":"后来发生了一连串丢脸的斗殴，其中两桩还闹到了违警法庭，到最后他成了全村的恐惧，人们一见他就逃，因为他力大无穷，发怒时完全无法控制。"},{"en":"“Last week he hurled the local blacksmith over a parapet into a stream, and it was only by paying over all the money which I could gather together that I was able to avert another public exposure.","zh":"“上星期他把村里的铁匠从矮墙上扔进了河里，我把能凑到的钱统统拿去赔了，才又一次免于当众出丑。"},{"en":"He had no friends at all save the wandering gipsies, and he would give these vagabonds leave to encamp upon the few acres of bramble-covered land which represent the family estate, and would accept in return the hospitality of their tents, wandering away with them sometimes for weeks on end.","zh":"他除了那些流浪的吉卜赛人，一个朋友也没有；他准许这些流浪者在那几英亩长满荆棘、算是家族产业的地上扎营，自己有时也接受他们帐篷里的招待，跟着他们一走就是好几个星期。"},{"en":"He has a passion also for Indian animals, which are sent over to him by a correspondent, and he has at this moment a cheetah and a baboon, which wander freely over his grounds and are feared by the villagers almost as much as their master.","zh":"他还酷爱印度来的动物，由一位通信朋友寄给他；眼下他就养着一头猎豹和一只狒狒，它们在园子里自由走来走去，村里人怕它们，几乎像怕他们的主人一样。"},{"en":"“You can imagine from what I say that my poor sister Julia and I had no great pleasure in our lives.","zh":"“听我说这些，你就能想像，可怜的姐姐朱莉娅和我，日子过得毫无乐趣。"},{"en":"No servant would stay with us, and for a long time we did all the work of the house.","zh":"没有仆人肯留下来，很长一段时间，家里的活都是我们自己做。"},{"en":"She was but thirty at the time of her death, and yet her hair had already begun to whiten, even as mine has.”","zh":"她去世时才三十岁，可头发已经开始变白，和我现在一样。”"},{"en":"“Your sister is dead, then?”","zh":"“这么说，你姐姐已经去世了？”"}],"words":[["ferocious","very fierce and violent","凶猛的"],["hereditary","passed down in a family","遗传的；家族传下的"],["intensified","became stronger","加剧；变强"],["tropics","the hot parts of the world near the equator","热带"],["uncontrollable","impossible to hold back","无法控制的"],["parapet","a low wall at the edge of a roof or bridge","矮墙；栏墙"],["gipsies","an old spelling for Roma travellers (the story’s own word)","吉卜赛人（故事里的旧时拼写）"],["vagabonds","people who wander from place to place","流浪的人"]],"think":["继父的性情为什么让人害怕？","Why is the stepfather so frightening?"],"craft":[{"term":"Characterisation 人物塑造","termZh":"人物塑造","classTie":"Year 8 English · characterisation 人物塑造；Crime Fiction 里的 criminal / antagonist 罪犯、反派。","quote":"Violence of temper approaching to mania has been hereditary in the men of the family","effectEn":"The description of his inherited, uncontrollable rage makes Roylott a frightening antagonist.","effectZh":"写他家族遗传、近乎疯狂的暴烈脾气，把罗伊洛特塑造成一个可怕的反派。","starters":{"p":"Roylott is characterised as a dangerous antagonist through...","e":"This is seen in the line, “Violence of temper approaching to mania…”.","x":"This has the effect of... because the reader now sees him as...","l":"Therefore, this supports the crime-fiction convention of a threatening criminal who..."}}]},{"wordCount":273,"sents":[{"en":"“She died just two years ago, and it is of her death that I wish to speak to you.","zh":"“她两年前去世的，我想对您讲的，正是她的死。"},{"en":"You can understand that, living the life which I have described, we were little likely to see anyone of our own age and position.","zh":"你能理解，过着我刚才说的那种生活，我们几乎碰不到和自己年龄、身份相近的人。"},{"en":"We had, however, an aunt, my mother’s maiden sister, Miss Honoria Westphail, who lives near Harrow, and we were occasionally allowed to pay short visits at this lady’s house.","zh":"不过我们有一位姨妈，是母亲的亲姐姐霍诺莉亚·韦斯特费尔小姐，住在哈罗附近，我们偶尔被允许到她家里住上几天。"},{"en":"Julia went there at Christmas two years ago, and met there a half-pay major of marines, to whom she became engaged.","zh":"两年前的圣诞节，朱莉娅去了那里，遇见一位领半薪的海军陆战队少校，后来就和他订了婚。"},{"en":"My stepfather learned of the engagement when my sister returned and offered no objection to the marriage; but within a fortnight of the day which had been fixed for the wedding, the terrible event occurred which has deprived me of my only companion.”","zh":"姐姐回来后，继父知道了这门亲事，并没有反对；可是在原定婚期前不到两星期，就发生了那件夺去我唯一同伴的可怕事情。”"},{"en":"Sherlock Holmes had been leaning back in his chair with his eyes closed and his head sunk in a cushion, but he half opened his lids now and glanced across at his visitor.","zh":"福尔摩斯本来靠在椅子里，闭着眼睛，头陷在靠垫中，这时却半睁开眼，朝他的来访者看了一眼。"},{"en":"“Pray be precise as to details,” said he.","zh":"“请把细节说准确，”他说。"},{"en":"“It is easy for me to be so, for every event of that dreadful time is seared into my memory.","zh":"“这对我很容易，因为那段可怕日子里的每一件事，都烙在我的记忆里。"},{"en":"The manor-house is, as I have already said, very old, and only one wing is now inhabited.","zh":"这座庄园大宅，正像我已经说过的，非常古老，现在只住着一侧的侧翼。"},{"en":"The bedrooms in this wing are on the ground floor, the sitting-rooms being in the central block of the buildings.","zh":"这一翼的卧室都在一楼，起居室则在房子的中段。"},{"en":"Of these bedrooms the first is Dr. Roylott’s, the second my sister’s, and the third my own.","zh":"这些卧室里，第一间是罗伊洛特医生的，第二间是我姐姐的，第三间是我的。"},{"en":"There is no communication between them, but they all open out into the same corridor.","zh":"房间之间并不相通，但都开向同一条走廊。"},{"en":"Do I make myself plain?”","zh":"我说清楚了吗？”"},{"en":"“Perfectly so.”","zh":"“非常清楚。”"}],"words":[["occasionally","sometimes, but not often","偶尔"],["half-pay","a reduced salary after leaving full service","半薪"],["marines","soldiers who serve at sea","海军陆战队员"],["engaged","promised to be married","订婚了"],["fortnight","two weeks","两星期"],["deprived","left without something important","被夺走；失去"],["precise","exact and careful","精确的"],["manor-house","a large country house","庄园大宅"]],"think":["朱莉娅订婚之后，家里发生了什么？","What happened at home after Julia got engaged?"],"craft":[{"term":"The crime / the victim 罪行与受害者","termZh":"罪行 / 受害者","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：a crime and a victim 先出现罪行和受害者，再进入调查。","quote":"within a fortnight of the day which had been fixed for the wedding, the terrible event occurred","effectEn":"Julia’s death just before her wedding is the crime that the investigation will try to solve.","effectZh":"朱莉娅在婚期前死去，就是这件案子要去查清的那桩罪行。","starters":{"p":"Conan Doyle introduces the central crime when...","e":"This is seen in the line, “within a fortnight of the day which had been fixed for the wedding…”.","x":"This matters because the timing suggests that...","l":"Therefore, this sets up the investigation that is a key convention of..."}}]},{"wordCount":304,"sents":[{"en":"“The windows of the three rooms open out upon the lawn.","zh":"“三间房的窗户都朝向草坪。"},{"en":"That fatal night Dr. Roylott had gone to his room early, though we knew that he had not retired to rest, for my sister was troubled by the smell of the strong Indian cigars which it was his custom to smoke.","zh":"那个致命的晚上，罗伊洛特医生很早就回了自己的房间，可我们知道他并没有休息，因为我姐姐闻到了他常抽的那种冲鼻的印度雪茄烟味，为此感到不安。"},{"en":"She left her room, therefore, and came into mine, where she sat for some time, chatting about her approaching wedding.","zh":"于是她离开自己的房间，来到我这里，坐了一会儿，聊着她即将到来的婚礼。"},{"en":"At eleven o’clock she rose to leave me, but she paused at the door and looked back.","zh":"十一点钟，她起身要走，却在门口停住，回过头来。"},{"en":"“‘Tell me, Helen,’ said she, ‘have you ever heard anyone whistle in the dead of the night?’","zh":"“‘告诉我，海伦，’她说，‘你有没有在夜深人静时，听见有人吹口哨？’"},{"en":"“‘Never,’ said I.","zh":"“‘从来没有，’我说。"},{"en":"“‘I suppose that you could not possibly whistle, yourself, in your sleep?’","zh":"“‘我想，你总不会在睡梦里自己吹口哨吧？’"},{"en":"“‘Certainly not.","zh":"“‘当然不会。"},{"en":"But why?’","zh":"可是为什么问这个？’"},{"en":"“‘Because during the last few nights I have always, about three in the morning, heard a low, clear whistle.","zh":"“‘因为最近几夜，大约凌晨三点，我总是听见一声低低的、清楚的口哨。"},{"en":"I am a light sleeper, and it has awakened me.","zh":"我睡觉很浅，一下子就被吵醒了。"},{"en":"I cannot tell where it came from—perhaps from the next room, perhaps from the lawn.","zh":"我说不准声音是从哪儿来的——也许是隔壁，也许是草坪上。"},{"en":"I thought that I would just ask you whether you had heard it.’","zh":"所以我想问问你，有没有也听见。’"},{"en":"“‘No, I have not.","zh":"“‘我没听见。"},{"en":"It must be those wretched gipsies in the plantation.’","zh":"一定是种植园里那些讨厌的吉卜赛人。’"},{"en":"“‘Very likely.","zh":"“‘很可能。"},{"en":"And yet if it were on the lawn, I wonder that you did not hear it also.’","zh":"不过如果是在草坪上，我奇怪你怎么也没听见。’"},{"en":"“‘Ah, but I sleep more heavily than you.’","zh":"“‘啊，可我睡得比你沉。’"},{"en":"“‘Well, it is of no great consequence, at any rate.’","zh":"“‘好吧，反正这也不是什么要紧事。’"},{"en":"She smiled back at me, closed my door, and a few moments later I heard her key turn in the lock.”","zh":"她朝我笑了笑，关上我的门，过了片刻，我听见她的钥匙在锁孔里转动。”"},{"en":"“Indeed,” said Holmes.","zh":"“是这样，”福尔摩斯说。"},{"en":"“Was it your custom always to lock yourselves in at night?”","zh":"“你们夜里一向都把自己锁在房间里吗？”"},{"en":"“Always.”","zh":"“一向如此。”"},{"en":"“And why?”","zh":"“为什么？”"},{"en":"“I think that I mentioned to you that the Doctor kept a cheetah and a baboon.","zh":"“我好像对您提过，医生养着一头猎豹和一只狒狒。"},{"en":"We had no feeling of security unless our doors were locked.”","zh":"房门不上锁，我们就没有安全感。”"},{"en":"“Quite so.","zh":"“确实如此。"},{"en":"Pray proceed with your statement.”","zh":"请继续往下讲。”"}],"words":[["retired","gone to bed, or gone to his room for the night","回房休息"],["whistle","a clear, high sound made with the lips or a pipe","口哨声"],["light sleeper","someone who wakes easily","容易醒的人；睡得浅"],["wretched","poor or unhappy; used here as a cross word for them","可怜的；讨厌的"],["plantation","a planted area of trees or crops","种植园；林子"],["consequence","importance; or a result","要紧；后果"],["cheetah","a very fast big cat","猎豹"],["baboon","a large monkey","狒狒"]],"think":["夜里的口哨声可能是从哪里来的？","Where might the night-time whistle have come from?"],"craft":[{"term":"Red herring 假线索","termZh":"假线索","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：red herring 假线索，把侦探和读者从真相上引开。","quote":"It must be those wretched gipsies in the plantation","effectEn":"Helen blames the gipsies for the whistle, which later looks like a false lead.","effectZh":"海伦把口哨声怪到吉卜赛人身上，这在后来看起来就像一条假线索。","starters":{"p":"A red herring is introduced when...","e":"This is seen in the line, “It must be those wretched gipsies in the plantation.”","x":"This misleads the reader because it seems to explain the whistle, but...","l":"Therefore, this is an example of a red herring, a convention that..."}}]},{"wordCount":386,"sents":[{"en":"“I could not sleep that night.","zh":"“那天夜里我睡不着。"},{"en":"A vague feeling of impending misfortune impressed me.","zh":"一种大祸即将临头的模糊感觉压在我心上。"},{"en":"My sister and I, you will recollect, were twins, and you know how subtle are the links which bind two souls which are so closely allied.","zh":"您记得，我和姐姐是双胞胎，您也知道，两个如此亲密的生命之间，会有多么细微的联系。"},{"en":"It was a wild night.","zh":"那是一个狂风暴雨的夜晚。"},{"en":"The wind was howling outside, and the rain was beating and splashing against the windows.","zh":"外面风在怒号，雨点拍打着窗户，溅起水花。"},{"en":"Suddenly, amid all the hubbub of the gale, there burst forth the wild scream of a terrified woman.","zh":"突然，在狂风的喧闹中，爆发出一个女人惊恐的惨叫。"},{"en":"I knew that it was my sister’s voice.","zh":"我立刻听出，那是我姐姐的声音。"},{"en":"I sprang from my bed, wrapped a shawl round me, and rushed into the corridor.","zh":"我从床上跳起来，裹上披肩，冲进走廊。"},{"en":"As I opened my door I seemed to hear a low whistle, such as my sister described, and a few moments later a clanging sound, as if a mass of metal had fallen.","zh":"我开门的时候，仿佛听见一声低低的口哨，正像姐姐描述过的那样，片刻之后又是一声当啷响，好像有一块金属掉在地上。"},{"en":"As I ran down the passage, my sister’s door was unlocked, and revolved slowly upon its hinges.","zh":"我沿着过道跑过去时，姐姐的门已经没锁，正慢慢地转开。"},{"en":"I stared at it horror-stricken, not knowing what was about to issue from it.","zh":"我惊恐地盯着那扇门，不知道里面会出来什么。"},{"en":"By the light of the corridor-lamp I saw my sister appear at the opening, her face blanched with terror, her hands groping for help, her whole figure swaying to and fro like that of a drunkard.","zh":"借着走廊灯的光，我看见姐姐出现在门口，脸吓得煞白，两手摸索着求救，整个身体像醉汉一样摇晃。"},{"en":"I ran to her and threw my arms round her, but at that moment her knees seemed to give way and she fell to the ground.","zh":"我跑过去用双臂搂住她，可就在那时，她的膝盖一软，倒在了地上。"},{"en":"She writhed as one who is in terrible pain, and her limbs were dreadfully convulsed.","zh":"她痛苦地扭动着，四肢可怕地抽搐。"},{"en":"At first I thought that she had not recognised me, but as I bent over her she suddenly shrieked out in a voice which I shall never forget, ‘Oh, my God!","zh":"起初我以为她没认出我，可当我俯下身时，她忽然用一种我永远忘不了的声音尖叫起来：‘哦，我的上帝！"},{"en":"Helen!","zh":"海伦！"},{"en":"It was the band!","zh":"是那条带子！"},{"en":"The speckled band!’","zh":"斑点带子！’"},{"en":"There was something else which she would fain have said, and she stabbed with her finger into the air in the direction of the Doctor’s room, but a fresh convulsion seized her and choked her words.","zh":"她好像还有别的话想说，手指朝医生房间的方向在空中戳着，可又一阵抽搐袭来，把她的话憋了回去。"},{"en":"I rushed out, calling loudly for my stepfather, and I met him hastening from his room in his dressing-gown.","zh":"我冲出去大声叫继父，正碰上他穿着晨衣从自己房间匆忙出来。"},{"en":"When he reached my sister’s side she was unconscious, and though he poured brandy down her throat and sent for medical aid from the village, all efforts were in vain, for she slowly sank and died without having recovered her consciousness.","zh":"等他赶到姐姐身边，她已经昏迷了；虽然他给她灌了白兰地，又派人去村里请医生，一切努力都没有用，她渐渐沉下去，再也没有恢复知觉，就这样死了。"},{"en":"Such was the dreadful end of my beloved sister.”","zh":"我亲爱的姐姐，就是这样可怕地死去的。”"}],"words":[["impending","about to happen","即将发生的"],["misfortune","bad luck; something sad","不幸"],["horror-stricken","filled with sudden fear","惊恐万分的"],["blanched","gone very pale","脸色发白"],["groping","feeling about with the hands, as if in the dark","摸索"],["writhed","twisted the body in pain","痛苦地扭动"],["convulsed","shaking violently","抽搐的"],["speckled","marked with small spots","有斑点的"]],"think":["朱莉娅临终前说的话，让你想到什么？","What do Julia’s last words make you wonder?"],"craft":[{"term":"Pathetic fallacy 天气反映心情","termZh":"天气反映心情","classTie":"Year 8 English · Building suspense 营造悬念：dark or stormy setting that mirrors the mood 阴沉天气映衬气氛。","quote":"The wind was howling outside, and the rain was beating and splashing against the windows","effectEn":"The wild weather mirrors Helen’s fear and makes the night feel more dangerous.","effectZh":"狂风暴雨映衬出海伦的恐惧，也让这个夜晚显得更危险。","starters":{"p":"The composer uses pathetic fallacy to build atmosphere when...","e":"This is seen in the line, “The wind was howling outside…”.","x":"This creates mood because the storm makes the reader feel...","l":"Therefore, the setting helps to build suspense by..."}}]},{"wordCount":369,"sents":[{"en":"“One moment,” said Holmes, “are you sure about this whistle and metallic sound?","zh":"“等一等，”福尔摩斯说，“你能确定有这声口哨和金属响吗？"},{"en":"Could you swear to it?”","zh":"你能发誓吗？”"},{"en":"“That was what the county coroner asked me at the inquiry.","zh":"“郡里的验尸官在调查时也这样问过我。"},{"en":"It is my strong impression that I heard it, and yet, among the crash of the gale and the creaking of an old house, I may possibly have been deceived.”","zh":"我的印象很强烈，觉得自己听见了；可是在狂风的轰鸣和老房子的吱嘎声里，我也有可能听错。”"},{"en":"“Was your sister dressed?”","zh":"“你姐姐当时穿着衣服吗？”"},{"en":"“No, she was in her night-dress.","zh":"“没有，她穿着睡衣。"},{"en":"In her right hand was found the charred stump of a match, and in her left a match-box.”","zh":"她右手里发现了一截烧过的火柴梗，左手里是一个火柴盒。”"},{"en":"“Showing that she had struck a light and looked about her when the alarm took place.","zh":"“这说明警报发生时，她划着了火，还朝四周看过。"},{"en":"That is important.","zh":"这一点很重要。"},{"en":"And what conclusions did the coroner come to?”","zh":"那么验尸官得出了什么结论？”"},{"en":"“He investigated the case with great care, for Dr. Roylott’s conduct had long been notorious in the county, but he was unable to find any satisfactory cause of death.","zh":"“他查得很仔细，因为罗伊洛特医生的行为在郡里早已出了名，可他找不出任何令人满意的死因。"},{"en":"My evidence showed that the door had been fastened upon the inner side, and the windows were blocked by old-fashioned shutters with broad iron bars, which were secured every night.","zh":"我的证词表明，门是从里面闩上的，窗户又被老式窗板挡住，窗板上有宽铁条，每晚都会固定好。"},{"en":"The walls were carefully sounded, and were shown to be quite solid all round, and the flooring was also thoroughly examined, with the same result.","zh":"墙壁被仔细敲过，四周都很坚实，地板也彻底检查过，结果一样。"},{"en":"The chimney is wide, but is barred up by four large staples.","zh":"烟囱虽然宽，却被四个大铁环拦住。"},{"en":"It is certain, therefore, that my sister was quite alone when she met her end.","zh":"因此可以肯定，我姐姐死去时，屋里只有她一个人。"},{"en":"Besides, there were no marks of any violence upon her.”","zh":"而且，她身上也没有任何暴力的痕迹。”"},{"en":"“How about poison?”","zh":"“会不会是中毒？”"},{"en":"“The doctors examined her for it, but without success.”","zh":"“医生检查过，没有查出来。”"},{"en":"“What do you think that this unfortunate lady died of, then?”","zh":"“那你认为这位不幸的女士是怎么死的？”"},{"en":"“It is my belief that she died of pure fear and nervous shock, though what it was that frightened her I cannot imagine.”","zh":"“我相信她是纯粹被吓死的，死于神经惊吓，可究竟是什么吓到了她，我想象不出来。”"},{"en":"“Were there gipsies in the plantation at the time?”","zh":"“当时种植园里有吉卜赛人吗？”"},{"en":"“Yes, there are nearly always some there.”","zh":"“有，那里几乎总是住着一些。”"},{"en":"“Ah, and what did you gather from this allusion to a band—a speckled band?”","zh":"“啊，那你从她提到的‘带子’——‘斑点带子’里，看出了什么？”"},{"en":"“Sometimes I have thought that it was merely the wild talk of delirium, sometimes that it may have referred to some band of people, perhaps to these very gipsies in the plantation.","zh":"“有时我觉得那不过是她神志错乱时的胡话，有时又想，那也许是指一伙人，说不定就是种植园里的这些吉卜赛人。"},{"en":"I do not know whether the spotted handkerchiefs which so many of them wear over their heads might have suggested the strange adjective which she used.”","zh":"我不知道，他们许多人头上戴的那些斑点头巾，是不是让她用了那个奇怪的形容词。”"}],"words":[["metallic","like metal; a hard ringing sound","金属般的"],["coroner","an official who looks into unusual deaths","验尸官"],["inquiry","an official investigation","调查；审讯"],["night-dress","clothes worn for sleeping","睡衣"],["notorious","famous for something bad","臭名昭著的"],["shutters","solid covers that close over a window","百叶窗；窗板"],["staples","strong metal loops or fastenings","金属扣环"],["satisfactory","good enough; meeting what is needed","令人满意的"]],"think":["为什么大家会觉得，当时房间里进不去人？","Why did people think nobody could have got into the room?"],"craft":[{"term":"Locked room 密室","termZh":"密室","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：locked room 密室，增加谜题难度。","quote":"the door had been fastened upon the inner side","effectEn":"If the door was locked from inside, it seems nobody could have entered, which deepens the mystery.","effectZh":"门从里面闩上，看起来谁也进不去，谜团就更深了。","starters":{"p":"The locked-room convention is established when...","e":"This is seen in the line, “the door had been fastened upon the inner side”.","x":"This puzzles the reader because it suggests that...","l":"Therefore, this locked-room detail makes the crime seem..."}}]},{"wordCount":361,"sents":[{"en":"Holmes shook his head like a man who is far from being satisfied.","zh":"福尔摩斯摇了摇头，像一个远未满意的人。"},{"en":"“These are very deep waters,” said he; “pray go on with your narrative.”","zh":"“这水很深，”他说，“请继续往下讲。”"},{"en":"“Two years have passed since then, and my life has been until lately lonelier than ever.","zh":"“从那以后过了两年，直到最近，我的生活比以前更加孤单。"},{"en":"A month ago, however, a dear friend, whom I have known for many years, has done me the honour to ask my hand in marriage.","zh":"可是一个月前，一位我认识多年的好友向我求婚了。"},{"en":"His name is Armitage—Percy Armitage—the second son of Mr. Armitage, of Crane Water, near Reading.","zh":"他叫阿米蒂奇——珀西·阿米蒂奇——是雷丁附近克兰沃特的阿米蒂奇先生的次子。"},{"en":"My stepfather has offered no opposition to the match, and we are to be married in the course of the spring.","zh":"继父没有反对这门亲事，我们准备在春天结婚。"},{"en":"Two days ago some repairs were started in the west wing of the building, and my bedroom wall has been pierced, so that I have had to move into the chamber in which my sister died, and to sleep in the very bed in which she slept.","zh":"两天前，房子西翼开始了修理，我卧室的墙被凿穿了，所以我只好搬进姐姐去世的那间房，睡在她睡过的那张床上。"},{"en":"Imagine, then, my thrill of terror when last night, as I lay awake, thinking over her terrible fate, I suddenly heard in the silence of the night the low whistle which had been the herald of her own death.","zh":"你想象一下我有多害怕：昨夜我醒着躺在床上，想着她可怕的结局，忽然在夜的寂静里，听见了那声曾经预告她死亡的低低口哨。"},{"en":"I sprang up and lit the lamp, but nothing was to be seen in the room.","zh":"我跳起来点上灯，可房间里什么也看不见。"},{"en":"I was too shaken to go to bed again, however, so I dressed, and as soon as it was daylight I slipped down, got a dog-cart at the Crown Inn, which is opposite, and drove to Leatherhead, from whence I have come on this morning with the one object of seeing you and asking your advice.”","zh":"我吓得不敢再睡，便穿好衣服，天一亮就悄悄下楼，在对面的皇冠旅店雇了一辆双轮马车，赶到莱瑟黑德，今天早晨从那儿过来，只为见您，向您求教。”"},{"en":"“You have done wisely,” said my friend.","zh":"“你做得聪明，”我的朋友说。"},{"en":"“But have you told me all?”","zh":"“可你都告诉我了吗？”"},{"en":"“Yes, all.”","zh":"“是的，全部。”"},{"en":"“Miss Roylott, you have not.","zh":"“罗伊洛特小姐，你没有。"},{"en":"You are screening your stepfather.”","zh":"你在为你的继父遮掩。”"},{"en":"“Why, what do you mean?”","zh":"“啊？你这是什么意思？”"},{"en":"For answer Holmes pushed back the frill of black lace which fringed the hand that lay upon our visitor’s knee.","zh":"福尔摩斯没有回答，只是把她放在膝上那只手的黑蕾丝花边推开。"},{"en":"Five little livid spots, the marks of four fingers and a thumb, were printed upon the white wrist.","zh":"雪白的手腕上，印着五个青紫的小印——四指和一拇指的痕迹。"},{"en":"“You have been cruelly used,” said Holmes.","zh":"“你受到了残酷的对待，”福尔摩斯说。"},{"en":"The lady coloured deeply and covered over her injured wrist.","zh":"那位女士脸涨得通红，连忙遮住受伤的手腕。"},{"en":"“He is a hard man,” she said, “and perhaps he hardly knows his own strength.”","zh":"“他是个强硬的人，”她说，“也许他自己也不知道有多大力气。”"}],"words":[["narrative","the story someone tells","叙述；讲述"],["lonelier","more alone than before","更孤单"],["opposition","action against a plan","反对"],["pierced","gone through, with a hole","打穿；穿过"],["chamber","a room, often a bedroom","房间；室"],["screening","hiding or covering","遮挡"],["fringed","with a border around the edge","边缘装饰着"],["injured","hurt","受伤的"]],"think":["海伦为什么现在这么害怕？","Why is Helen so frightened now?"],"craft":[{"term":"Foreshadowing 伏笔","termZh":"伏笔","classTie":"Year 8 English · Building suspense 营造悬念：foreshadowing 伏笔，提前暗示危险还会再来。","quote":"the low whistle which had been the herald of her own death","effectEn":"Helen hears the same whistle that came before Julia’s death, hinting that the danger is returning.","effectZh":"海伦听见了姐姐死前出现过的同一声口哨，暗示危险又要来了。","starters":{"p":"Foreshadowing is used to warn the reader when...","e":"This is seen in the phrase, “the low whistle which had been the herald of her own death”.","x":"This creates suspense because the reader now expects that...","l":"Therefore, this foreshadowing prepares us for..."}}]},{"wordCount":358,"sents":[{"en":"There was a long silence, during which Holmes leaned his chin upon his hands and stared into the crackling fire.","zh":"接着是长时间的沉默，福尔摩斯把下巴抵在手上，盯着噼啪作响的炉火。"},{"en":"“This is a very deep business,” he said at last.","zh":"“这是一件很深的案子，”他终于说。"},{"en":"“There are a thousand details which I should desire to know before I decide upon our course of action.","zh":"“在决定我们怎么行动之前，有上千个细节我想弄清楚。"},{"en":"Yet we have not a moment to lose.","zh":"可我们一分钟也不能浪费。"},{"en":"If we were to come to Stoke Moran to-day, would it be possible for us to see over these rooms without the knowledge of your stepfather?”","zh":"假如我们今天就去斯托克莫兰，能不能在你继父不知道的情况下，看看那些房间？”"},{"en":"“As it happens, he spoke of coming into town to-day upon some most important business.","zh":"“碰巧，他说今天要进城办一件非常重要的事。"},{"en":"It is probable that he will be away all day, and that there would be nothing to disturb you.","zh":"他很可能一整天都不在，不会有什么打扰你们。"},{"en":"We have a housekeeper now, but she is old and foolish, and I could easily get her out of the way.”","zh":"我们现在有一个管家，可她又老又糊涂，我很容易把她支开。”"},{"en":"“Excellent.","zh":"“好极了。"},{"en":"You are not averse to this trip, Watson?”","zh":"华生，你不反对走这一趟吧？”"},{"en":"“By no means.”","zh":"“当然不反对。”"},{"en":"“Then we shall both come.","zh":"“那我们就一起去。"},{"en":"What are you going to do yourself?”","zh":"你自己打算做什么？”"},{"en":"“I have one or two things which I would wish to do now that I am in town.","zh":"“既然已经在城里，我还有一两件事想办。"},{"en":"But I shall return by the twelve o’clock train, so as to be there in time for your coming.”","zh":"不过我会坐十二点的火车回去，好及时赶上你们到来。”"},{"en":"“And you may expect us early in the afternoon.","zh":"“那你可以等我们下午早些时候到。"},{"en":"I have myself some small business matters to attend to.","zh":"我自己也有一点小事要处理。"},{"en":"Will you not wait and breakfast?”","zh":"你不一起来吃早餐吗？”"},{"en":"“No, I must go.","zh":"“不，我必须走了。"},{"en":"My heart is lightened already since I have confided my trouble to you.","zh":"把麻烦讲给你们听以后，我心里已经轻松多了。"},{"en":"I shall look forward to seeing you again this afternoon.”","zh":"我期待今天下午再见到你们。”"},{"en":"She dropped her thick black veil over her face and glided from the room.","zh":"她把厚厚的黑面纱重新罩在脸上，悄无声息地走出了房间。"},{"en":"“And what do you think of it all, Watson?” asked Sherlock Holmes, leaning back in his chair.","zh":"“华生，你觉得这一切怎么样？”福尔摩斯靠在椅背上问。"},{"en":"“It seems to me to be a most dark and sinister business.”","zh":"“在我看来，这是一件非常阴暗、不祥的事。”"},{"en":"“Dark enough and sinister enough.”","zh":"“确实够阴暗，也够不祥。”"},{"en":"“Yet if the lady is correct in saying that the flooring and walls are sound, and that the door, window, and chimney are impassable, then her sister must have been undoubtedly alone when she met her mysterious end.”","zh":"“可是，如果这位女士说得对，地板和墙壁都完好，门、窗和烟囱都进不去人，那么她姐姐在神秘死去时，屋里一定只有她一个人。”"},{"en":"“What becomes, then, of these nocturnal whistles, and what of the very peculiar words of the dying woman?”","zh":"“那么，夜里那些口哨又怎么解释？那位临终的女士说的那些奇怪的话，又怎么解释？”"},{"en":"“I cannot think.”","zh":"“我想不出来。”"}],"words":[["crackling","short, sharp sounds, like a fire","噼啪声"],["housekeeper","a person who looks after a house","管家"],["confided","told a secret or a worry to someone","倾诉；告知心事"],["glided","moved smoothly and quietly","滑步离去"],["sinister","suggesting something evil or dangerous","不祥的；阴险的"],["impassable","impossible to go through","无法通过的"],["nocturnal","happening at night","夜间的"],["peculiar","strange; not usual","奇特的"]],"think":["到目前为止，你觉得最可疑的是谁？","So far, who seems most suspicious to you?"],"craft":[{"term":"Sidekick narrator 助手叙述","termZh":"助手叙述","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：sidekick 助手（华生）被问到看法，读者也跟着一起想。","quote":"And what do you think of it all, Watson?","effectEn":"Holmes asks Watson’s view, so the reader pauses and tries to solve the puzzle too.","effectZh":"福尔摩斯问华生怎么看，读者也会停下来，一起想这个谜。","starters":{"p":"The sidekick narrator is used to involve the reader when...","e":"This is seen in the question, “And what do you think of it all, Watson?”","x":"This has the effect of... because the reader is invited to...","l":"Therefore, this convention lets us learn clues at the same pace as..."}}]},{"wordCount":365,"sents":[{"en":"“When you combine the ideas of whistles at night, the presence of a band of gipsies who are on intimate terms with this old doctor, the fact that we have every reason to believe that the doctor has an interest in preventing his stepdaughter’s marriage, the dying allusion to a band, and, finally, the fact that Miss Helen Stoner heard a metallic clang, which might have been caused by one of those metal bars that secured the shutters falling back into its place, I think that there is good ground to think that the mystery may be cleared along those lines.”","zh":"“如果你把这些想法合在一起：夜里的口哨，一伙和这位老医生关系亲密的吉卜赛人，我们完全有理由相信医生有阻止继女结婚的利害关系，临终时提到‘带子’，再加上海伦·斯托纳小姐听见一声金属的当啷响，那声音也许是固定窗板的铁条落回原位引起的——我想，沿着这些线索，这件谜案很有可能被查清。”"},{"en":"“But what, then, did the gipsies do?”","zh":"“可是，那些吉卜赛人又做了什么呢？”"},{"en":"“I cannot imagine.”","zh":"“我想象不出来。”"},{"en":"“I see many objections to any such theory.”","zh":"“这样的推测，我看到许多说不通的地方。”"},{"en":"“And so do I.","zh":"“我也是。"},{"en":"It is precisely for that reason that we are going to Stoke Moran this day.","zh":"正因为如此，我们今天才要去斯托克莫兰。"},{"en":"I want to see whether the objections are fatal, or if they may be explained away.","zh":"我想看看这些异议是不是致命的，还是可以被解释清楚。"},{"en":"But what in the name of the devil!”","zh":"可这到底是怎么回事！”"},{"en":"The ejaculation had been drawn from my companion by the fact that our door had been suddenly dashed open, and that a huge man had framed himself in the aperture.","zh":"我的同伴突然喊出来，是因为我们的门猛地被人撞开，一个身材高大的男人填满了整个门口。"},{"en":"His costume was a peculiar mixture of the professional and of the agricultural, having a black top-hat, a long frock-coat, and a pair of high gaiters, with a hunting-crop swinging in his hand.","zh":"他的穿着很奇特，既像专业人士，又像乡下人：黑礼帽、长礼服，还穿着一双高绑腿，手里甩着一根猎鞭。"},{"en":"So tall was he that his hat actually brushed the cross bar of the doorway, and his breadth seemed to span it across from side to side.","zh":"他非常高，帽子几乎擦到了门框上的横梁，宽度也几乎把门堵了个严实。"},{"en":"A large face, seared with a thousand wrinkles, burned yellow with the sun, and marked with every evil passion, was turned from one to the other of us, while his deep-set, bile-shot eyes, and his high, thin, fleshless nose, gave him somewhat the resemblance to a fierce old bird of prey.","zh":"那张大脸布满皱纹，被太阳晒成黄色，每一处都带着邪恶的情绪，轮流朝着我们两人；深陷、带着怒气的眼睛，高而瘦、没有血色的鼻子，让他看起来有点像一只凶猛的老猛禽。"},{"en":"“Which of you is Holmes?” asked this apparition.","zh":"“你们谁是福尔摩斯？”这个突然出现的人问。"},{"en":"“My name, sir; but you have the advantage of me,” said my companion quietly.","zh":"“是我，先生；不过我还不认识您，”我的同伴平静地说。"},{"en":"“I am Dr. Grimesby Roylott, of Stoke Moran.”","zh":"“我是斯托克莫兰的格里姆斯比·罗伊洛特医生。”"},{"en":"“Indeed, Doctor,” said Holmes blandly.","zh":"“是吗，医生，”福尔摩斯温和地说。"},{"en":"“Pray take a seat.”","zh":"“请坐。”"},{"en":"“I will do nothing of the kind.","zh":"“我才不坐。"},{"en":"My stepdaughter has been here.","zh":"我的继女来过这里。"},{"en":"I have traced her.","zh":"我跟踪到她了。"},{"en":"What has she been saying to you?”","zh":"她对你们说了些什么？”"}],"words":[["allusion","a brief mention of something","暗指；提及"],["clang","a loud, ringing metal sound","当啷一声"],["objections","reasons for not agreeing","反对的理由"],["ejaculation","a sudden short cry","突然的喊叫"],["aperture","an opening","开口；孔"],["gaiters","cloth or leather covers for the lower legs","绑腿"],["hunting-crop","a short stiff whip used in riding","猎鞭"],["apparition","someone who appears so suddenly they seem like a ghost","突然出现的人；像幽灵一样"]],"think":["突然闯进来的这个人，给你什么感觉？","What is your first impression of the man who bursts in?"],"craft":[{"term":"Characterisation / simile 人物塑造与明喻","termZh":"人物塑造 / 明喻","classTie":"Year 8 English · characterisation 人物塑造；simile 明喻，用来写出罪犯的危险感。","quote":"the resemblance to a fierce old bird of prey","effectEn":"Comparing Roylott to a bird of prey makes him look predatory and dangerous as soon as he appears.","effectZh":"把罗伊洛特比作猛禽，他一出场就显得像猎手，非常危险。","starters":{"p":"Roylott’s sudden entrance characterises him as a predator through a simile when...","e":"This is seen in the phrase, “the resemblance to a fierce old bird of prey”.","x":"This image makes the reader see him as... because...","l":"Therefore, this characterisation supports the convention of a threatening..."}}]},{"wordCount":346,"sents":[{"en":"“It is a little cold for the time of the year,” said Holmes.","zh":"“这个季节还真有点冷，”福尔摩斯说。"},{"en":"“What has she been saying to you?”","zh":"“她对你们说了些什么？”"},{"en":"screamed the old man furiously.","zh":"老人狂怒地尖叫着。"},{"en":"“But I have heard that the crocuses promise well,” continued my companion imperturbably.","zh":"“不过我听说，今年的番红花长势不错，”我的同伴依旧不动声色地接着说。"},{"en":"“Ha!","zh":"“哈！"},{"en":"You put me off, do you?” said our new visitor, taking a step forward and shaking his hunting-crop.","zh":"你在跟我打岔，是不是？”这位新来的访客向前迈了一步，晃着手里的猎鞭。"},{"en":"“I know you, you scoundrel!","zh":"“我认识你，你这个无赖！"},{"en":"I have heard of you before.","zh":"我早就听说过你。"},{"en":"You are Holmes, the meddler.”","zh":"你就是福尔摩斯，那个爱管闲事的人。”"},{"en":"My friend smiled.","zh":"我的朋友笑了笑。"},{"en":"“Holmes, the busybody!”","zh":"“福尔摩斯，那个多事的人！”"},{"en":"His smile broadened.","zh":"他的笑容更开了。"},{"en":"“Holmes, the Scotland Yard Jack-in-office!”","zh":"“福尔摩斯，苏格兰场那个神气活现的小官！”"},{"en":"Holmes chuckled heartily.","zh":"福尔摩斯开心地轻笑起来。"},{"en":"“Your conversation is most entertaining,” said he.","zh":"“您的谈话真有趣，”他说。"},{"en":"“When you go out close the door, for there is a decided draught.”","zh":"“您出去的时候请把门关上，这里过堂风很明显。”"},{"en":"“I will go when I have had my say.","zh":"“等我把话说完再走。"},{"en":"Don’t you dare to meddle with my affairs.","zh":"你给我小心，少管我的事。"},{"en":"I know that Miss Stoner has been here.","zh":"我知道斯托纳小姐来过这儿。"},{"en":"I traced her!","zh":"我跟踪到她了！"},{"en":"I am a dangerous man to fall foul of!","zh":"得罪我，可不是什么好事！"},{"en":"See here.”","zh":"看看这个。”"},{"en":"He stepped swiftly forward, seized the poker, and bent it into a curve with his huge brown hands.","zh":"他迅速上前，抓住火钳，用那双又大又棕的手把它掰成了一道弯。"},{"en":"“See that you keep yourself out of my grip,” he snarled, and hurling the twisted poker into the fireplace he strode out of the room.","zh":"“看你别落到我手里，”他吼着，把扭弯的火钳扔进壁炉，大步走出了房间。"},{"en":"“He seems a very amiable person,” said Holmes, laughing.","zh":"“他看起来真是个和气的人，”福尔摩斯笑着说。"},{"en":"“I am not quite so bulky, but if he had remained I might have shown him that my grip was not much more feeble than his own.”","zh":"“我没有他那么壮，可要是他还留在这儿，也许我可以让他看看，我的手劲也不比他差多少。”"},{"en":"As he spoke he picked up the steel poker and, with a sudden effort, straightened it out again.","zh":"他一边说，一边捡起那根钢火钳，猛地一用力，又把它掰直了。"},{"en":"“Fancy his having the insolence to confound me with the official detective force!","zh":"“亏他好意思把我和官方侦探混为一谈！"},{"en":"This incident gives zest to our investigation, however, and I only trust that our little friend will not suffer from her imprudence in allowing this brute to trace her.","zh":"不过这件事给我们的调查添了点趣味，我只希望我们这位小朋友，不会因为不小心让这头野兽跟踪到她而吃亏。"},{"en":"And now, Watson, we shall order breakfast, and afterwards I shall walk down to Doctors’ Commons, where I hope to get some data which may help us in this matter.”","zh":"华生，我们现在去叫早餐，吃完后我要去一趟 Doctors’ Commons（伦敦查遗嘱的地方），希望能查到一些对这件事有用的资料。”"},{"en":"It was nearly one o’clock when Sherlock Holmes returned from his excursion.","zh":"将近一点钟，福尔摩斯才从这次外出回来。"},{"en":"He held in his hand a sheet of blue paper, scrawled over with notes and figures.","zh":"他手里拿着一张蓝纸，上面潦草地写着笔记和数字。"}],"words":[["crocuses","small spring flowers","番红花"],["imperturbably","staying calm; not getting flustered","沉着地；不动声色地"],["scoundrel","a bad, dishonest person","无赖；恶棍"],["meddler","someone who interferes in other people’s business","爱管闲事的人"],["draught","a cold flow of air (also spelled draft)","过堂风"],["poker","a metal rod for stirring a fire","火钳"],["insolence","rude, insulting boldness","傲慢无礼"],["imprudence","a careless or unwise act","不谨慎；轻率"]],"think":["福尔摩斯为什么不直接回答医生的问题？","Why doesn’t Holmes answer the doctor’s question at once?"],"craft":[{"term":"Dialogue / contrast 对话与对比","termZh":"对话 / 对比","classTie":"Year 8 English · juxtaposition / contrast 对比：福尔摩斯故意说无关的话，显出他的冷静。","quote":"But I have heard that the crocuses promise well","effectEn":"Holmes answers a furious question with a remark about flowers, and the contrast makes him seem calm and in control.","effectZh":"面对狂怒的质问，福尔摩斯却去谈花，这种对比显出他很冷静，也更有掌控力。","starters":{"p":"Contrast in the dialogue characterises Holmes as calm when...","e":"This is seen in the line, “But I have heard that the crocuses promise well”.","x":"This is effective because it contrasts with Roylott’s anger and shows...","l":"Therefore, this dialogue helps to characterise the detective as..."}}]},{"wordCount":366,"sents":[{"en":"“I have seen the will of the deceased wife,” said he.","zh":"“我已经看过那位亡妻的遗嘱了，”他说。"},{"en":"“To determine its exact meaning I have been obliged to work out the present prices of the investments with which it is concerned.","zh":"“为了弄清它的确切意思，我不得不把其中那些投资现在的价格算了一遍。"},{"en":"The total income, which at the time of the wife’s death was little short of £ 1,100, is now, through the fall in agricultural prices, not more than £ 750.","zh":"妻子去世时，全部收入差不多有一千一百英镑，现在因为农产品价格下跌，已经不超过七百五十英镑。"},{"en":"Each daughter can claim an income of £ 250, in case of marriage.","zh":"每个女儿一旦结婚，都可以主张每年二百五十英镑的收入。"},{"en":"It is evident, therefore, that if both girls had married, this beauty would have had a mere pittance, while even one of them would cripple him to a very serious extent.","zh":"因此很明显，如果两个女儿都结了婚，这位先生就只剩一点点钱了；哪怕只一个女儿结婚，也会严重削弱他的收入。"},{"en":"My morning’s work has not been wasted, since it has proved that he has the very strongest motives for standing in the way of anything of the sort.","zh":"我今天上午的工夫没有白费，因为它证明：他有极强的动机，去阻挡这类事情发生。"},{"en":"And now, Watson, this is too serious for dawdling, especially as the old man is aware that we are interesting ourselves in his affairs; so if you are ready, we shall call a cab and drive to Waterloo.","zh":"华生，这事太严重，不能再磨蹭了，尤其是那老头已经知道我们在过问他的事；所以如果你准备好了，我们就叫一辆马车，去滑铁卢。"},{"en":"I should be very much obliged if you would slip your revolver into your pocket.","zh":"请你把左轮手枪悄悄放进口袋，我将非常感激。"},{"en":"An Eley’s No. 2 is an excellent argument with gentlemen who can twist steel pokers into knots.","zh":"对付能把钢火钳拧成结的绅士，一把 Eley 二号是很有说服力的‘理由’。"},{"en":"That and a tooth-brush are, I think, all that we need.”","zh":"再加上一把牙刷，我想我们就需要这些了。”"},{"en":"At Waterloo we were fortunate in catching a train for Leatherhead, where we hired a trap at the station inn and drove for four or five miles through the lovely Surrey lanes.","zh":"在滑铁卢，我们幸好赶上了去莱瑟黑德的火车，到了那儿，又在车站旅店雇了一辆轻便马车，在美丽的萨里乡间小路上走了四五英里。"},{"en":"It was a perfect day, with a bright sun and a few fleecy clouds in the heavens.","zh":"那天天气好极了，阳光明亮，天上只有几朵轻柔的白云。"},{"en":"The trees and wayside hedges were just throwing out their first green shoots, and the air was full of the pleasant smell of the moist earth.","zh":"路边的树木和篱笆正抽出第一批绿芽，空气里满是湿土的清香。"},{"en":"To me at least there was a strange contrast between the sweet promise of the spring and this sinister quest upon which we were engaged.","zh":"至少对我来说，春天这甜美的气息，和我们正在进行的这趟不祥的调查，形成了一种奇怪的对比。"},{"en":"My companion sat in the front of the trap, his arms folded, his hat pulled down over his eyes, and his chin sunk upon his breast, buried in the deepest thought.","zh":"我的同伴坐在马车前部，双臂抱着，帽子拉到眼睛上，下巴抵在胸前，陷入了深深的思索。"},{"en":"Suddenly, however, he started, tapped me on the shoulder, and pointed over the meadows.","zh":"可突然，他一惊，拍了拍我的肩，指向对面的草地。"},{"en":"“Look there!” said he.","zh":"“看那儿！”他说。"}],"words":[["deceased","dead; the person who has died","已故的"],["investments","money put into things that may grow in value","投资"],["pittance","a very small amount of money","微薄的一点钱"],["motives","reasons that make someone act","动机"],["dawdling","moving slowly; wasting time","磨蹭"],["revolver","a handgun with a revolving cylinder","左轮手枪"],["obliged","had to; was forced to","不得不；只好"],["tooth-brush","the usual spelling today is toothbrush","牙刷"]],"think":["遗嘱里的钱为什么可能很重要？","Why might the money in the will matter?"],"craft":[{"term":"Motive 动机","termZh":"动机","classTie":"Year 8 English · Crime Fiction 犯罪小说惯例：motive 动机，以及 means 他为什么要阻止结婚。","quote":"Each daughter can claim an income of £ 250, in case of marriage","effectEn":"The figures make the money motive clear and specific, not just a vague guess.","effectZh":"这些具体数字把金钱动机说得很清楚，不再只是模糊的猜想。","starters":{"p":"The detective confirms a strong motive when...","e":"This is seen in the line, “Each daughter can claim an income of £ 250, in case of marriage”.","x":"This proves motive because if the girls marry, Roylott would...","l":"Therefore, this convention of motive helps to explain why..."}}]},{"wordCount":326,"sents":[{"en":"A heavily timbered park stretched up in a gentle slope, thickening into a grove at the highest point.","zh":"一片树木茂密的园林沿着缓坡向上延伸，在最高处密集成一片树丛。"},{"en":"From amid the branches there jutted out the grey gables and high roof-tree of a very old mansion.","zh":"枝叶之间，伸出一座很古老的宅邸的灰色山墙和高高的屋脊。"},{"en":"“Stoke Moran?” said he.","zh":"“斯托克莫兰？”他说。"},{"en":"“Yes, sir, that be the house of Dr. Grimesby Roylott,” remarked the driver.","zh":"“是的，先生，那就是格里姆斯比·罗伊洛特医生的房子，”车夫说。"},{"en":"“There is some building going on there,” said Holmes; “that is where we are going.”","zh":"“那儿正在施工，”福尔摩斯说，“我们就是要去那儿。”"},{"en":"“There’s the village,” said the driver, pointing to a cluster of roofs some distance to the left; “but if you want to get to the house, you’ll find it shorter to get over this stile, and so by the footpath over the fields.","zh":"“村子在那边，”车夫指着左边远处一簇屋顶说，“可你们要是想去那所房子，翻过这道台阶，再沿田间小路走会更近。"},{"en":"There it is, where the lady is walking.”","zh":"看，那位女士正在那儿走着，就是那条路。”"},{"en":"“And the lady, I fancy, is Miss Stoner,” observed Holmes, shading his eyes.","zh":"“那位女士，我想就是斯托纳小姐，”福尔摩斯遮着眼睛观察道。"},{"en":"“Yes, I think we had better do as you suggest.”","zh":"“对，我想我们最好照你说的走。”"},{"en":"We got off, paid our fare, and the trap rattled back on its way to Leatherhead.","zh":"我们下了车，付了车钱，马车喀哒喀哒驶回莱瑟黑德。"},{"en":"“I thought it as well,” said Holmes as we climbed the stile, “that this fellow should think we had come here as architects, or on some definite business.","zh":"“我觉得这样也好，”我们翻上台阶时福尔摩斯说，“让这人以为我们是建筑师，或是来办什么正经事的。"},{"en":"It may stop his gossip.","zh":"也许能少让他嚼舌。"},{"en":"Good-afternoon, Miss Stoner.","zh":"下午好，斯托纳小姐。"},{"en":"You see that we have been as good as our word.”","zh":"你看，我们说话是算数的。”"},{"en":"Our client of the morning had hurried forward to meet us with a face which spoke her joy.","zh":"我们上午的委托人连忙迎上来，脸上满是喜悦。"},{"en":"“I have been waiting so eagerly for you,” she cried, shaking hands with us warmly.","zh":"“我一直急切地等着你们，”她喊着，热情地和我们握手。"},{"en":"“All has turned out splendidly.","zh":"“一切都顺利极了。"},{"en":"Dr. Roylott has gone to town, and it is unlikely that he will be back before evening.”","zh":"罗伊洛特医生进了城，傍晚以前多半回不来。”"},{"en":"“We have had the pleasure of making the Doctor’s acquaintance,” said Holmes, and in a few words he sketched out what had occurred.","zh":"“我们已经有幸认识了医生，”福尔摩斯说，并用几句话简述了刚才发生的事。"},{"en":"Miss Stoner turned white to the lips as she listened.","zh":"斯托纳小姐听着，嘴唇都白了。"},{"en":"“Good heavens!”","zh":"“天哪！”"},{"en":"she cried, “he has followed me, then.”","zh":"她叫道，“这么说，他跟踪我了。”"},{"en":"“So it appears.”","zh":"“看起来是这样。”"},{"en":"“He is so cunning that I never know when I am safe from him.","zh":"“他狡猾得很，我从来不知道什么时候能躲开他。"},{"en":"What will he say when he returns?”","zh":"他回来以后会说什么？”"}],"words":[["timbered","wooded; with many trees","树木茂密的"],["mansion","a very large house","宅邸；大宅"],["roof-tree","the main beam of a roof; here, the roofline","屋脊"],["cluster","a small group close together","一簇；一小群"],["footpath","a narrow path for walking","小路；步行道"],["architects","people who design buildings","建筑师"],["definite","clear and certain","明确的"],["eagerly","with keen interest; keen to begin","急切地"]],"think":["斯托克莫兰这地方看起来怎样？","What does Stoke Moran look like to you?"],"craft":[{"term":"Setting / atmosphere 环境气氛","termZh":"环境气氛","classTie":"Year 8 English · Explain how the setting creates mood 环境如何营造气氛。","quote":"the grey gables and high roof-tree of a very old mansion","effectEn":"The old, grey house looks isolated and gloomy, which sets a dark mood before they even go inside.","effectZh":"这座灰色的老宅显得偏僻而阴沉，还没进门，气氛就已经暗了下来。","starters":{"p":"The setting creates a dark mood when...","e":"This is seen in the phrase, “the grey gables and high roof-tree of a very old mansion”.","x":"This atmosphere makes the reader feel... because the house seems...","l":"Therefore, the setting supports the crime-fiction convention of an isolated..."}}]},{"wordCount":359,"sents":[{"en":"“He must guard himself, for he may find that there is someone more cunning than himself upon his track.","zh":"“他必须小心自己，因为他可能会发现，有一个比他还要狡猾的人在跟踪他。"},{"en":"You must lock yourself up from him to-night.","zh":"今晚你必须把自己锁起来，别让他进来。"},{"en":"If he is violent, we shall take you away to your aunt’s at Harrow.","zh":"如果他动粗，我们就送你到哈罗的姨妈那儿去。"},{"en":"Now, we must make the best use of our time, so kindly take us at once to the rooms which we are to examine.”","zh":"现在必须抓紧时间，请马上带我们去要检查的那些房间。”"},{"en":"The building was of grey, lichen-blotched stone, with a high central portion and two curving wings, like the claws of a crab, thrown out on each side.","zh":"那座建筑是灰色的石头，上面斑斑驳驳长着地衣，中间部分很高，两侧伸出两道弯曲的侧翼，像螃蟹的钳子。"},{"en":"In one of these wings the windows were broken and blocked with wooden boards, while the roof was partly caved in, a picture of ruin.","zh":"其中一侧的窗户已经破了，用木板堵住，屋顶也塌了一部分，一片破败的景象。"},{"en":"The central portion was in little better repair, but the right-hand block was comparatively modern, and the blinds in the windows, with the blue smoke curling up from the chimneys, showed that this was where the family resided.","zh":"中间部分也好不了多少，但右边那一块相对较新，窗户里有窗帘，烟囱升起蓝色的烟，说明这一家人住在这里。"},{"en":"Some scaffolding had been erected against the end wall, and the stone-work had been broken into, but there were no signs of any workmen at the moment of our visit.","zh":"尽头的墙边竖着一些脚手架，石墙也被凿开了，可我们来的时候，却看不见任何工人。"},{"en":"Holmes walked slowly up and down the ill-trimmed lawn and examined with deep attention the outsides of the windows.","zh":"福尔摩斯在修剪得不整齐的草坪上慢慢走来走去，非常专心地查看那些窗户的外侧。"},{"en":"“This, I take it, belongs to the room in which you used to sleep, the centre one to your sister’s, and the one next to the main building to Dr. Roylott’s chamber?”","zh":"“我猜，这一间是你原来睡的房间，中间是你姐姐的，靠近主楼的那一间是罗伊洛特医生的？”"},{"en":"“Exactly so.","zh":"“正是这样。"},{"en":"But I am now sleeping in the middle one.”","zh":"可我现在睡的是中间那一间。”"},{"en":"“Pending the alterations, as I understand.","zh":"“是在改建期间，我理解。"},{"en":"By the way, there does not seem to be any very pressing need for repairs at that end wall.”","zh":"顺便说一句，那面端墙看起来并不怎么急需修理。”"},{"en":"“There were none.","zh":"“本来就没有必要。"},{"en":"I believe that it was an excuse to move me from my room.”","zh":"我相信，那只是把我从自己房间里赶出来的借口。”"},{"en":"“Ah!","zh":"“啊！"},{"en":"that is suggestive.","zh":"这就很能说明问题了。"},{"en":"Now, on the other side of this narrow wing runs the corridor from which these three rooms open.","zh":"现在，这条窄侧翼的另一边，是那条三个房间都通向的走廊。"},{"en":"There are windows in it, of course?”","zh":"上面当然有窗户吧？”"},{"en":"“Yes, but very small ones.","zh":"“有，可非常小。"},{"en":"Too narrow for anyone to pass through.”","zh":"窄得谁也钻不过去。”"},{"en":"“As you both locked your doors at night, your rooms were unapproachable from that side.","zh":"“既然你们夜里都锁了门，从那一侧也进不了你们的房间。"},{"en":"Now, would you have the kindness to go into your room and bar your shutters?”","zh":"现在，能不能请你进自己的房间，把窗板闩上？”"}],"words":[["cunning","clever in a sly way","狡猾的"],["lichen-blotched","marked with patches of lichen (a crusty plant on stone)","长着一片片地衣的"],["scaffolding","temporary poles and boards used by builders","脚手架"],["erected","put up; built","竖起；搭建"],["ill-trimmed","not cut neatly","修剪得不整齐"],["Pending","while waiting for something to be finished","在……期间；尚未完成"],["alterations","changes made to a building","改建；改动"],["exactly","used here to agree: “that’s right”","正是；没错"]],"think":["房子外面有什么看起来不对劲？","What seems odd about the outside of the house?"],"craft":[{"term":"Clues / investigation 线索与调查","termZh":"线索 / 调查","classTie":"Year 8 English · Crime Fiction 犯罪小说结构：the detective investigates 侦探展开调查，识别真正的线索。","quote":"I believe that it was an excuse to move me from my room","effectEn":"The unnecessary repairs are marked as a clue: someone wanted Helen in the deadly room.","effectZh":"那些并不急需的修理被标成一条线索：有人想把海伦赶进那间致命的房间。","starters":{"p":"A key clue is uncovered during the investigation when...","e":"This is seen in Helen’s line, “I believe that it was an excuse to move me from my room”.","x":"This is important because it suggests that...","l":"Therefore, this clue moves the investigation forward by..."}}]},{"wordCount":354,"sents":[{"en":"Miss Stoner did so, and Holmes, after a careful examination through the open window, endeavoured in every way to force the shutter open, but without success.","zh":"斯托纳小姐照做了。福尔摩斯从开着的窗户仔细检查后，用尽各种办法想把窗板打开，却没有成功。"},{"en":"There was no slit through which a knife could be passed to raise the bar.","zh":"没有一条缝可以伸进刀子去拨开插销。"},{"en":"Then with his lens he tested the hinges, but they were of solid iron, built firmly into the massive masonry.","zh":"接着他又用放大镜检查铰链，可那些铰链是结实的铁做的，牢固地嵌在厚实的砖石里。"},{"en":"“Hum!” said he, scratching his chin in some perplexity, “my theory certainly presents some difficulties.","zh":"“嗯！”他有些困惑地挠着下巴说，“我的推测看来确实有些困难。"},{"en":"No one could pass these shutters if they were bolted.","zh":"窗板如果闩上，谁也过不去。"},{"en":"Well, we shall see if the inside throws any light upon the matter.”","zh":"好吧，我们再看看里面会不会说明什么。”"},{"en":"A small side door led into the whitewashed corridor from which the three bedrooms opened.","zh":"一扇小边门通向刷了白灰的走廊，三间卧室都从那里开门。"},{"en":"Holmes refused to examine the third chamber, so we passed at once to the second, that in which Miss Stoner was now sleeping, and in which her sister had met with her fate.","zh":"福尔摩斯不肯检查第三间，于是我们立刻进了第二间，也就是斯托纳小姐现在睡的、她姐姐遇难的那间。"},{"en":"It was a homely little room, with a low ceiling and a gaping fireplace, after the fashion of old country-houses.","zh":"那是一间朴素的小房间，天花板很低，壁炉张着大口，是老式乡间住宅的样子。"},{"en":"A brown chest of drawers stood in one corner, a narrow white-counterpaned bed in another, and a dressing-table on the left-hand side of the window.","zh":"一个角落里立着棕色的五斗柜，另一个角落是一张铺着白床单的窄床，窗的左边是梳妆台。"},{"en":"These articles, with two small wicker-work chairs, made up all the furniture in the room save for a square of Wilton carpet in the centre.","zh":"再加上两把小柳条椅，以及房间中央一块方形的威尔顿地毯，这就是全部家具了。"},{"en":"The boards round and the panelling of the walls were of brown, worm-eaten oak, so old and discoloured that it may have dated from the original building of the house.","zh":"四周的地板和墙上的木墙板都是棕色、遭了虫蛀的橡木，陈旧褪色，也许可以追溯到这座房子初建的时候。"},{"en":"Holmes drew one of the chairs into a corner and sat silent, while his eyes travelled round and round and up and down, taking in every detail of the apartment.","zh":"福尔摩斯把一把椅子拉到角落里坐下，默不作声，眼睛一圈圈、一上一下地打量，把房间的每个细节都收进眼里。"},{"en":"“Where does that bell communicate with?”","zh":"“那根铃连到哪里？”"},{"en":"he asked at last pointing to a thick bell-rope which hung down beside the bed, the tassel actually lying upon the pillow.","zh":"他终于问，指着床边垂下来的一根粗拉铃绳，绳穗竟然搭在枕头上。"},{"en":"“It goes to the housekeeper’s room.”","zh":"“通到管家的房间。”"},{"en":"“It looks newer than the other things?”","zh":"“它看起来比其他东西新一些？”"},{"en":"“Yes, it was only put there a couple of years ago.”","zh":"“是的，才装上两三年。”"},{"en":"“Your sister asked for it, I suppose?”","zh":"“我猜是你姐姐要求装的？”"},{"en":"“No, I never heard of her using it.","zh":"“没有，我从没听说她用过。"},{"en":"We used always to get what we wanted for ourselves.”","zh":"我们要什么，一向都是自己去拿。”"}],"words":[["endeavoured","tried hard","努力试图"],["masonry","stone or brick work","石工；砖石结构"],["perplexity","the feeling of being puzzled","困惑"],["whitewashed","
