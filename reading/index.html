<style>
:root{--bg:#0f1226;--card:#1a1e3d;--card2:#20254a;--line:#3a4080;--y:#ffcc33;--b:#3ec5ff;--g:#2ee59d;--o:#ff9d3d;--p:#ff7ab6;--r:#ff5c7a;--v:#7c5cff;--t:#eef0ff;--m:#a9afd9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:12px 14px}
.top{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;flex-wrap:wrap}
.pill{background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0}
.hero{background:linear-gradient(135deg,#ff7ab6,#7c5cff 55%,#3ec5ff);border:none}
.hero h1{margin:0;font-size:22px}
h2{font-size:19px;margin:4px 0 8px}
h3{font-size:16px;margin:12px 0 6px;color:var(--y)}
.sub{color:var(--m);font-size:13px}
.hero .sub{color:#fff;opacity:.9}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:13px;font-size:17px;font-weight:800;background:var(--y);color:#1b1b1b;box-shadow:0 5px 0 #b38a00;margin:10px 0;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.btn.sec{background:var(--card2);color:var(--t);box-shadow:0 4px 0 #0a0c1c}
.btn.sec:active{box-shadow:0 2px 0 #0a0c1c}
.btn.go{background:var(--g);color:#06331f;box-shadow:0 5px 0 #1a8a5c}
.btn.go:active{box-shadow:0 2px 0 #1a8a5c}
.btn.warn{background:var(--o);color:#331a06;box-shadow:0 5px 0 #b36a1a}
.btn.warn:active{box-shadow:0 2px 0 #b36a1a}
.btn.small{display:inline-block;width:auto;padding:7px 12px;font-size:14px;margin:4px 4px 4px 0}
.btns{display:flex;gap:8px}
.btns .btn{flex:1;margin:10px 0}
.timer{font-size:64px;font-weight:800;text-align:center;letter-spacing:2px;color:var(--y);line-height:1;margin:16px 0 8px;font-variant-numeric:tabular-nums}
.timer.run{color:var(--g)}
.timer.pause{color:var(--o)}
.bar{height:10px;background:#0c0f22;border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b));border-radius:99px;width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card2);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;opacity:.35}
.badge.on{opacity:1;border:1px solid var(--y)}
.badge b{display:block;font-size:26px}
nav{position:fixed;bottom:0;left:0;right:0;background:#11142b;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav a{flex:1;max-width:160px;background:none;border:none;color:var(--m);padding:8px 0 9px;font-size:11px;cursor:pointer;text-decoration:none;text-align:center}
nav a b{display:block;font-size:22px}
nav a.on{color:var(--y)}
input,textarea,select{width:100%;background:#0c0f22;color:var(--t);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-family:inherit}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--y);color:#1b1b1b;font-weight:800;padding:10px 18px;border-radius:99px;z-index:60;display:none;max-width:90%;text-align:center}
.days{display:flex;justify-content:space-between;margin-top:8px}
.days span{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px}
.days span.d{background:var(--g);color:#06331f;font-weight:800}
.days span.t{outline:2px solid var(--y)}
.book{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;background:var(--card2);border-radius:14px;margin:8px 0;border:2px solid transparent}
.book.reading{border-color:var(--b)}
.book.done{border-color:var(--g);background:#11493a}
.book .ic{font-size:26px;flex:none}
.book .tt{font-weight:700}
.strow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.strow button{border:1px solid var(--line);background:#0c0f22;color:var(--m);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;cursor:pointer}
.strow button.on{background:var(--g);color:#06331f;border-color:var(--g)}
.strow button.on.reading{background:var(--b);color:#062233;border-color:var(--b)}
.prompt{font-size:20px;font-weight:800;margin:8px 0 4px;line-height:1.35}
.prompt .en{display:block;color:#bfe9ff;font-size:16px;font-weight:700;margin-top:4px}
.reward{background:var(--card2);border-radius:14px;padding:12px;margin:8px 0;border:2px dashed var(--line)}
.reward.on{border-style:solid;border-color:var(--y);background:#3a3010}
.hint{background:#11493a;border:1px solid var(--g);border-radius:14px;padding:12px;margin:8px 0}
a.ylink{color:var(--b);font-weight:700;text-decoration:none}
.row{display:flex;gap:8px;align-items:center}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1}
.addrow .btn{width:auto;margin:0;padding:10px 14px;flex:none}
.goalnum{font-size:28px;font-weight:800;color:var(--y)}
.readtext{font-size:var(--rs,19px);line-height:1.75;color:var(--t)}
.readtext p{margin:0 0 1em}
.readtext p:last-child{margin-bottom:0}
button.w{background:none;border:none;padding:0;margin:0;color:inherit;font:inherit;border-bottom:1px dotted var(--b);cursor:pointer;line-height:inherit;box-shadow:none;border-radius:0;display:inline;font-weight:700}
button.w:active{color:var(--b)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#1d2248;border-top:2px solid var(--b);border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));z-index:50;max-width:520px;margin:0 auto;box-shadow:0 -10px 30px #0009;transform:translateY(110%);transition:transform .2s}
.sheet.open{transform:none}
.sheet .big{font-size:24px;font-weight:800;color:var(--b)}
.sheet .en{color:#bfe9ff;margin:6px 0 2px}
.fsrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.recclock{font-size:28px;font-weight:800;text-align:center;color:var(--r);font-variant-numeric:tabular-nums;margin:8px 0}
.recclock.on{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.reclist .item{background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0}
.reclist audio{width:100%;margin-top:6px}
.progdots{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.progdots i{width:14px;height:14px;border-radius:50%;background:var(--card2);display:block;border:0;padding:0;cursor:pointer}
.progdots i.on{outline:2px solid var(--y)}
.progdots i.done{background:var(--g)}

</style>

<script>
const EXCERPTS=[{"text":"On glancing over my notes of the seventy odd cases in which I have during the last eight years studied the methods of my friend Sherlock Holmes, I find many tragic, some comic, a large number merely strange, but none commonplace; for, working as he did rather for the love of his art than for the acquirement of wealth, he refused to associate himself with any investigation which did not tend towards the unusual, and even the fantastic. Of all these varied cases, however, I cannot recall any which presented more singular features than that which was associated with the well-known Surrey family of the Roylotts of Stoke Moran. The events in question occurred in the early days of my association with Holmes, when we were sharing rooms as bachelors in Baker Street. It is possible that I might have placed them upon record before, but a promise of secrecy was made at the time, from which I have only been freed during the last month by the untimely death of the lady to whom the pledge was given. It is perhaps as well that the facts should now come to light, for I have reasons to know that there are widespread rumours as to the death of Dr. Grimesby Roylott which tend to make the matter even more terrible than the truth.\n\nIt was early in April in the year ’83 that I woke one morning to find Sherlock Holmes standing, fully dressed, by the side of my bed. He was a late riser, as a rule, and as the clock on the mantelpiece showed me that it was only a quarter-past seven, I blinked up at him in some surprise, and perhaps just a little resentment, for I was myself regular in my habits.\n\n“Very sorry to knock you up, Watson,” said he, “but it’s the common lot this morning. Mrs. Hudson has been knocked up, she retorted upon me, and I on you.”\n\n“What is it, then—a fire?”","words":[["commonplace","ordinary; nothing special","平常的；没什么特别"],["acquirement","the getting of something","获得"],["fantastic","very strange or hard to believe","离奇的"],["singular","unusual; unlike anything else","奇特的"],["bachelors","unmarried men","单身汉"],["untimely","happening too soon","过早的"],["rumours","stories people repeat that may not be true","谣言"],["knock you up","wake you up (old-fashioned English, not the modern slang)","叫醒（旧时说法，不是现代俚语）"]],"think":["福尔摩斯为什么更喜欢离奇的案子？","Why does Holmes prefer strange cases?"],"wordCount":331},{"text":"“No; a client. It seems that a young lady has arrived in a considerable state of excitement, who insists upon seeing me. She is waiting now in the sitting-room. Now, when young ladies wander about the metropolis at this hour of the morning, and knock sleepy people up out of their beds, I presume that it is something very pressing which they have to communicate. Should it prove to be an interesting case, you would, I am sure, wish to follow it from the outset. I thought, at any rate, that I should call you and give you the chance.”\n\n“My dear fellow, I would not miss it for anything.”\n\nI had no keener pleasure than in following Holmes in his professional investigations, and in admiring the rapid deductions, as swift as intuitions, and yet always founded on a logical basis with which he unravelled the problems which were submitted to him. I rapidly threw on my clothes and was ready in a few minutes to accompany my friend down to the sitting-room. A lady dressed in black and heavily veiled, who had been sitting in the window, rose as we entered.\n\n“Good-morning, madam,” said Holmes cheerily. “My name is Sherlock Holmes. This is my intimate friend and associate, Dr. Watson, before whom you can speak as freely as before myself. Ha! I am glad to see that Mrs. Hudson has had the good sense to light the fire. Pray draw up to it, and I shall order you a cup of hot coffee, for I observe that you are shivering.”\n\n“It is not cold which makes me shiver,” said the woman in a low voice, changing her seat as requested.\n\n“What, then?”\n\n“It is fear, Mr. Holmes. It is terror.” She raised her veil as she spoke, and we could see that she was indeed in a pitiable state of agitation, her face all drawn and grey, with restless frightened eyes, like those of some hunted animal. Her features and figure were those of a woman of thirty, but her hair was shot with premature grey, and her expression was weary and haggard. Sherlock Holmes ran her over with one of his quick, all-comprehensive glances.","words":[["client","a person who comes for help","客户；来求助的人"],["metropolis","a very large city (here, London)","大都市（这里指伦敦）"],["deductions","conclusions reached by careful thinking","推理；推断"],["intuitions","ideas you feel without step-by-step thinking","直觉"],["unravelled","figured out; untangled","解开；查明"],["veiled","wearing a veil over the face","蒙着面纱的"],["pitiable","making you feel sorry for someone","可怜的"],["haggard","looking very tired and worn","憔悴的"]],"think":["这位女士为什么一大早就赶来？","Why do you think the young lady came so early?"],"wordCount":366},{"text":"“You must not fear,” said he soothingly, bending forward and patting her forearm. “We shall soon set matters right, I have no doubt. You have come in by train this morning, I see.”\n\n“You know me, then?”\n\n“No, but I observe the second half of a return ticket in the palm of your left glove. You must have started early, and yet you had a good drive in a dog-cart, along heavy roads, before you reached the station.”\n\nThe lady gave a violent start and stared in bewilderment at my companion.\n\n“There is no mystery, my dear madam,” said he, smiling. “The left arm of your jacket is spattered with mud in no less than seven places. The marks are perfectly fresh. There is no vehicle save a dog-cart which throws up mud in that way, and then only when you sit on the left-hand side of the driver.”\n\n“Whatever your reasons may be, you are perfectly correct,” said she. “I started from home before six, reached Leatherhead at twenty past, and came in by the first train to Waterloo. Sir, I can stand this strain no longer; I shall go mad if it continues. I have no one to turn to—none, save only one, who cares for me, and he, poor fellow, can be of little aid. I have heard of you, Mr. Holmes; I have heard of you from Mrs. Farintosh, whom you helped in the hour of her sore need. It was from her that I had your address. Oh, sir, do you not think that you could help me, too, and at least throw a little light through the dense darkness which surrounds me? At present it is out of my power to reward you for your services, but in a month or six weeks I shall be married, with the control of my own income, and then at least you shall not find me ungrateful.”\n\nHolmes turned to his desk and, unlocking it, drew out a small case-book, which he consulted.","words":[["soothingly","in a gentle, calming way","安慰地；温和地"],["dog-cart","a light horse-drawn cart","双轮轻便马车"],["bewilderment","complete surprise and confusion","困惑；茫然"],["spattered","splashed in small spots","溅到的"],["strain","stress that is hard to bear","压力；紧张"],["case-book","a notebook of past cases","案件记录本"],["ungrateful","not thankful","忘恩的"],["sore need","a time of great trouble","紧急困境"]],"think":["福尔摩斯是怎么看出她一路怎么来的？","How did Holmes work out her journey?"],"wordCount":336},{"text":"“Farintosh,” said he. “Ah yes, I recall the case; it was concerned with an opal tiara. I think it was before your time, Watson. I can only say, madam, that I shall be happy to devote the same care to your case as I did to that of your friend. As to reward, my profession is its own reward; but you are at liberty to defray whatever expenses I may be put to, at the time which suits you best. And now I beg that you will lay before us everything that may help us in forming an opinion upon the matter.”\n\n“Alas!” replied our visitor, “the very horror of my situation lies in the fact that my fears are so vague, and my suspicions depend so entirely upon small points, which might seem trivial to another, that even he to whom of all others I have a right to look for help and advice looks upon all that I tell him about it as the fancies of a nervous woman. He does not say so, but I can read it from his soothing answers and averted eyes. But I have heard, Mr. Holmes, that you can see deeply into the manifold wickedness of the human heart. You may advise me how to walk amid the dangers which encompass me.”\n\n“I am all attention, madam.”\n\n“My name is Helen Stoner, and I am living with my stepfather, who is the last survivor of one of the oldest Saxon families in England, the Roylotts of Stoke Moran, on the western border of Surrey.”\n\nHolmes nodded his head. “The name is familiar to me,” said he.","words":[["opal tiara","a jewelled crown-like headpiece","蛋白石头冠"],["defray","to pay for (the costs)","支付（费用）"],["Alas","an old word for “sadly”","唉（旧时感叹词）"],["vague","not clear","模糊的"],["trivial","seeming small or unimportant","琐碎的；不足道的"],["averted","turned away","避开的；躲开的"],["manifold","many and varied","多种多样的"],["encompass","to surround on all sides","包围"]],"think":["她为什么觉得别人不会相信她？","Why does she feel other people will not believe her?"],"wordCount":274},{"text":"“The family was at one time among the richest in England, and the estates extended over the borders into Berkshire in the north, and Hampshire in the west. In the last century, however, four successive heirs were of a dissolute and wasteful disposition, and the family ruin was eventually completed by a gambler in the days of the Regency. Nothing was left save a few acres of ground, and the two-hundred-year-old house, which is itself crushed under a heavy mortgage. The last squire dragged out his existence there, living the horrible life of an aristocratic pauper; but his only son, my stepfather, seeing that he must adapt himself to the new conditions, obtained an advance from a relative, which enabled him to take a medical degree and went out to Calcutta, where, by his professional skill and his force of character, he established a large practice. In a fit of anger, however, caused by some robberies which had been perpetrated in the house, he beat his native butler to death and narrowly escaped a capital sentence. As it was, he suffered a long term of imprisonment and afterwards returned to England a morose and disappointed man.\n\n“When Dr. Roylott was in India he married my mother, Mrs. Stoner, the young widow of Major-General Stoner, of the Bengal Artillery. My sister Julia and I were twins, and we were only two years old at the time of my mother’s re-marriage. She had a considerable sum of money—not less than £ 1000 a year—and this she bequeathed to Dr. Roylott entirely while we resided with him, with a provision that a certain annual sum should be allowed to each of us in the event of our marriage. Shortly after our return to England my mother died—she was killed eight years ago in a railway accident near Crewe. Dr. Roylott then abandoned his attempts to establish himself in practice in London and took us to live with him in the old ancestral house at Stoke Moran. The money which my mother had left was enough for all our wants, and there seemed to be no obstacle to our happiness.","words":[["estates","large pieces of family land and property","地产；产业"],["dissolute","living in a wild, wasteful way","放荡的"],["wasteful","spending too much, without care","挥霍的"],["disposition","a person’s usual character or temper","性情；性格"],["mortgage","a loan that uses property as a guarantee","抵押借款"],["widow","a woman whose husband has died","寡妇"],["Calcutta","a large city in India (now Kolkata)","加尔各答（印度大城市）"],["practice","a doctor’s business and patients","诊所；行医业务"]],"think":["罗伊洛特这一家从前发生了什么变化？","What changed in the Roylott family over time?"],"wordCount":356},{"text":"“But a terrible change came over our stepfather about this time. Instead of making friends and exchanging visits with our neighbours, who had at first been overjoyed to see a Roylott of Stoke Moran back in the old family seat, he shut himself up in his house and seldom came out save to indulge in ferocious quarrels with whoever might cross his path. Violence of temper approaching to mania has been hereditary in the men of the family, and in my stepfather’s case it had, I believe, been intensified by his long residence in the tropics. A series of disgraceful brawls took place, two of which ended in the police-court, until at last he became the terror of the village, and the folks would fly at his approach, for he is a man of immense strength, and absolutely uncontrollable in his anger.\n\n“Last week he hurled the local blacksmith over a parapet into a stream, and it was only by paying over all the money which I could gather together that I was able to avert another public exposure. He had no friends at all save the wandering gipsies, and he would give these vagabonds leave to encamp upon the few acres of bramble-covered land which represent the family estate, and would accept in return the hospitality of their tents, wandering away with them sometimes for weeks on end. He has a passion also for Indian animals, which are sent over to him by a correspondent, and he has at this moment a cheetah and a baboon, which wander freely over his grounds and are feared by the villagers almost as much as their master.\n\n“You can imagine from what I say that my poor sister Julia and I had no great pleasure in our lives. No servant would stay with us, and for a long time we did all the work of the house. She was but thirty at the time of her death, and yet her hair had already begun to whiten, even as mine has.”\n\n“Your sister is dead, then?”","words":[["ferocious","very fierce and violent","凶猛的"],["hereditary","passed down in a family","遗传的；家族传下的"],["intensified","became stronger","加剧；变强"],["tropics","the hot parts of the world near the equator","热带"],["uncontrollable","impossible to hold back","无法控制的"],["parapet","a low wall at the edge of a roof or bridge","矮墙；栏墙"],["gipsies","an old spelling for Roma travellers (the story’s own word)","吉卜赛人（故事里的旧时拼写）"],["vagabonds","people who wander from place to place","流浪的人"]],"think":["继父的性情为什么让人害怕？","Why is the stepfather so frightening?"],"wordCount":343},{"text":"“She died just two years ago, and it is of her death that I wish to speak to you. You can understand that, living the life which I have described, we were little likely to see anyone of our own age and position. We had, however, an aunt, my mother’s maiden sister, Miss Honoria Westphail, who lives near Harrow, and we were occasionally allowed to pay short visits at this lady’s house. Julia went there at Christmas two years ago, and met there a half-pay major of marines, to whom she became engaged. My stepfather learned of the engagement when my sister returned and offered no objection to the marriage; but within a fortnight of the day which had been fixed for the wedding, the terrible event occurred which has deprived me of my only companion.”\n\nSherlock Holmes had been leaning back in his chair with his eyes closed and his head sunk in a cushion, but he half opened his lids now and glanced across at his visitor.\n\n“Pray be precise as to details,” said he.\n\n“It is easy for me to be so, for every event of that dreadful time is seared into my memory. The manor-house is, as I have already said, very old, and only one wing is now inhabited. The bedrooms in this wing are on the ground floor, the sitting-rooms being in the central block of the buildings. Of these bedrooms the first is Dr. Roylott’s, the second my sister’s, and the third my own. There is no communication between them, but they all open out into the same corridor. Do I make myself plain?”\n\n“Perfectly so.”","words":[["occasionally","sometimes, but not often","偶尔"],["half-pay","a reduced salary after leaving full service","半薪"],["marines","soldiers who serve at sea","海军陆战队员"],["engaged","promised to be married","订婚了"],["fortnight","two weeks","两星期"],["deprived","left without something important","被夺走；失去"],["precise","exact and careful","精确的"],["manor-house","a large country house","庄园大宅"]],"think":["朱莉娅订婚之后，家里发生了什么？","What happened at home after Julia got engaged?"],"wordCount":273},{"text":"“The windows of the three rooms open out upon the lawn. That fatal night Dr. Roylott had gone to his room early, though we knew that he had not retired to rest, for my sister was troubled by the smell of the strong Indian cigars which it was his custom to smoke. She left her room, therefore, and came into mine, where she sat for some time, chatting about her approaching wedding. At eleven o’clock she rose to leave me, but she paused at the door and looked back.\n\n“‘Tell me, Helen,’ said she, ‘have you ever heard anyone whistle in the dead of the night?’\n\n“‘Never,’ said I.\n\n“‘I suppose that you could not possibly whistle, yourself, in your sleep?’\n\n“‘Certainly not. But why?’\n\n“‘Because during the last few nights I have always, about three in the morning, heard a low, clear whistle. I am a light sleeper, and it has awakened me. I cannot tell where it came from—perhaps from the next room, perhaps from the lawn. I thought that I would just ask you whether you had heard it.’\n\n“‘No, I have not. It must be those wretched gipsies in the plantation.’\n\n“‘Very likely. And yet if it were on the lawn, I wonder that you did not hear it also.’\n\n“‘Ah, but I sleep more heavily than you.’\n\n“‘Well, it is of no great consequence, at any rate.’ She smiled back at me, closed my door, and a few moments later I heard her key turn in the lock.”\n\n“Indeed,” said Holmes. “Was it your custom always to lock yourselves in at night?”\n\n“Always.”\n\n“And why?”\n\n“I think that I mentioned to you that the Doctor kept a cheetah and a baboon. We had no feeling of security unless our doors were locked.”\n\n“Quite so. Pray proceed with your statement.”","words":[["retired","gone to bed, or gone to his room for the night","回房休息"],["whistle","a clear, high sound made with the lips or a pipe","口哨声"],["light sleeper","someone who wakes easily","容易醒的人；睡得浅"],["wretched","poor or unhappy; used here as a cross word for them","可怜的；讨厌的"],["plantation","a planted area of trees or crops","种植园；林子"],["consequence","importance; or a result","要紧；后果"],["cheetah","a very fast big cat","猎豹"],["baboon","a large monkey","狒狒"]],"think":["夜里的口哨声可能是从哪里来的？","Where might the night-time whistle have come from?"],"wordCount":304},{"text":"“I could not sleep that night. A vague feeling of impending misfortune impressed me. My sister and I, you will recollect, were twins, and you know how subtle are the links which bind two souls which are so closely allied. It was a wild night. The wind was howling outside, and the rain was beating and splashing against the windows. Suddenly, amid all the hubbub of the gale, there burst forth the wild scream of a terrified woman. I knew that it was my sister’s voice. I sprang from my bed, wrapped a shawl round me, and rushed into the corridor. As I opened my door I seemed to hear a low whistle, such as my sister described, and a few moments later a clanging sound, as if a mass of metal had fallen. As I ran down the passage, my sister’s door was unlocked, and revolved slowly upon its hinges. I stared at it horror-stricken, not knowing what was about to issue from it. By the light of the corridor-lamp I saw my sister appear at the opening, her face blanched with terror, her hands groping for help, her whole figure swaying to and fro like that of a drunkard. I ran to her and threw my arms round her, but at that moment her knees seemed to give way and she fell to the ground. She writhed as one who is in terrible pain, and her limbs were dreadfully convulsed. At first I thought that she had not recognised me, but as I bent over her she suddenly shrieked out in a voice which I shall never forget, ‘Oh, my God! Helen! It was the band! The speckled band!’ There was something else which she would fain have said, and she stabbed with her finger into the air in the direction of the Doctor’s room, but a fresh convulsion seized her and choked her words. I rushed out, calling loudly for my stepfather, and I met him hastening from his room in his dressing-gown. When he reached my sister’s side she was unconscious, and though he poured brandy down her throat and sent for medical aid from the village, all efforts were in vain, for she slowly sank and died without having recovered her consciousness. Such was the dreadful end of my beloved sister.”","words":[["impending","about to happen","即将发生的"],["misfortune","bad luck; something sad","不幸"],["horror-stricken","filled with sudden fear","惊恐万分的"],["blanched","gone very pale","脸色发白"],["groping","feeling about with the hands, as if in the dark","摸索"],["writhed","twisted the body in pain","痛苦地扭动"],["convulsed","shaking violently","抽搐的"],["speckled","marked with small spots","有斑点的"]],"think":["朱莉娅临终前说的话，让你想到什么？","What do Julia’s last words make you wonder?"],"wordCount":386},{"text":"“One moment,” said Holmes, “are you sure about this whistle and metallic sound? Could you swear to it?”\n\n“That was what the county coroner asked me at the inquiry. It is my strong impression that I heard it, and yet, among the crash of the gale and the creaking of an old house, I may possibly have been deceived.”\n\n“Was your sister dressed?”\n\n“No, she was in her night-dress. In her right hand was found the charred stump of a match, and in her left a match-box.”\n\n“Showing that she had struck a light and looked about her when the alarm took place. That is important. And what conclusions did the coroner come to?”\n\n“He investigated the case with great care, for Dr. Roylott’s conduct had long been notorious in the county, but he was unable to find any satisfactory cause of death. My evidence showed that the door had been fastened upon the inner side, and the windows were blocked by old-fashioned shutters with broad iron bars, which were secured every night. The walls were carefully sounded, and were shown to be quite solid all round, and the flooring was also thoroughly examined, with the same result. The chimney is wide, but is barred up by four large staples. It is certain, therefore, that my sister was quite alone when she met her end. Besides, there were no marks of any violence upon her.”\n\n“How about poison?”\n\n“The doctors examined her for it, but without success.”\n\n“What do you think that this unfortunate lady died of, then?”\n\n“It is my belief that she died of pure fear and nervous shock, though what it was that frightened her I cannot imagine.”\n\n“Were there gipsies in the plantation at the time?”\n\n“Yes, there are nearly always some there.”\n\n“Ah, and what did you gather from this allusion to a band—a speckled band?”\n\n“Sometimes I have thought that it was merely the wild talk of delirium, sometimes that it may have referred to some band of people, perhaps to these very gipsies in the plantation. I do not know whether the spotted handkerchiefs which so many of them wear over their heads might have suggested the strange adjective which she used.”","words":[["metallic","like metal; a hard ringing sound","金属般的"],["coroner","an official who looks into unusual deaths","验尸官"],["inquiry","an official investigation","调查；审讯"],["night-dress","clothes worn for sleeping","睡衣"],["notorious","famous for something bad","臭名昭著的"],["shutters","solid covers that close over a window","百叶窗；窗板"],["staples","strong metal loops or fastenings","金属扣环"],["satisfactory","good enough; meeting what is needed","令人满意的"]],"think":["为什么大家会觉得，当时房间里进不去人？","Why did people think nobody could have got into the room?"],"wordCount":369},{"text":"Holmes shook his head like a man who is far from being satisfied.\n\n“These are very deep waters,” said he; “pray go on with your narrative.”\n\n“Two years have passed since then, and my life has been until lately lonelier than ever. A month ago, however, a dear friend, whom I have known for many years, has done me the honour to ask my hand in marriage. His name is Armitage—Percy Armitage—the second son of Mr. Armitage, of Crane Water, near Reading. My stepfather has offered no opposition to the match, and we are to be married in the course of the spring. Two days ago some repairs were started in the west wing of the building, and my bedroom wall has been pierced, so that I have had to move into the chamber in which my sister died, and to sleep in the very bed in which she slept. Imagine, then, my thrill of terror when last night, as I lay awake, thinking over her terrible fate, I suddenly heard in the silence of the night the low whistle which had been the herald of her own death. I sprang up and lit the lamp, but nothing was to be seen in the room. I was too shaken to go to bed again, however, so I dressed, and as soon as it was daylight I slipped down, got a dog-cart at the Crown Inn, which is opposite, and drove to Leatherhead, from whence I have come on this morning with the one object of seeing you and asking your advice.”\n\n“You have done wisely,” said my friend. “But have you told me all?”\n\n“Yes, all.”\n\n“Miss Roylott, you have not. You are screening your stepfather.”\n\n“Why, what do you mean?”\n\nFor answer Holmes pushed back the frill of black lace which fringed the hand that lay upon our visitor’s knee. Five little livid spots, the marks of four fingers and a thumb, were printed upon the white wrist.\n\n“You have been cruelly used,” said Holmes.\n\nThe lady coloured deeply and covered over her injured wrist. “He is a hard man,” she said, “and perhaps he hardly knows his own strength.”","words":[["narrative","the story someone tells","叙述；讲述"],["lonelier","more alone than before","更孤单"],["opposition","action against a plan","反对"],["pierced","gone through, with a hole","打穿；穿过"],["chamber","a room, often a bedroom","房间；室"],["screening","hiding or covering","遮挡"],["fringed","with a border around the edge","边缘装饰着"],["injured","hurt","受伤的"]],"think":["海伦为什么现在这么害怕？","Why is Helen so frightened now?"],"wordCount":361},{"text":"There was a long silence, during which Holmes leaned his chin upon his hands and stared into the crackling fire.\n\n“This is a very deep business,” he said at last. “There are a thousand details which I should desire to know before I decide upon our course of action. Yet we have not a moment to lose. If we were to come to Stoke Moran to-day, would it be possible for us to see over these rooms without the knowledge of your stepfather?”\n\n“As it happens, he spoke of coming into town to-day upon some most important business. It is probable that he will be away all day, and that there would be nothing to disturb you. We have a housekeeper now, but she is old and foolish, and I could easily get her out of the way.”\n\n“Excellent. You are not averse to this trip, Watson?”\n\n“By no means.”\n\n“Then we shall both come. What are you going to do yourself?”\n\n“I have one or two things which I would wish to do now that I am in town. But I shall return by the twelve o’clock train, so as to be there in time for your coming.”\n\n“And you may expect us early in the afternoon. I have myself some small business matters to attend to. Will you not wait and breakfast?”\n\n“No, I must go. My heart is lightened already since I have confided my trouble to you. I shall look forward to seeing you again this afternoon.” She dropped her thick black veil over her face and glided from the room.\n\n“And what do you think of it all, Watson?” asked Sherlock Holmes, leaning back in his chair.\n\n“It seems to me to be a most dark and sinister business.”\n\n“Dark enough and sinister enough.”\n\n“Yet if the lady is correct in saying that the flooring and walls are sound, and that the door, window, and chimney are impassable, then her sister must have been undoubtedly alone when she met her mysterious end.”\n\n“What becomes, then, of these nocturnal whistles, and what of the very peculiar words of the dying woman?”\n\n“I cannot think.”","words":[["crackling","short, sharp sounds, like a fire","噼啪声"],["housekeeper","a person who looks after a house","管家"],["confided","told a secret or a worry to someone","倾诉；告知心事"],["glided","moved smoothly and quietly","滑步离去"],["sinister","suggesting something evil or dangerous","不祥的；阴险的"],["impassable","impossible to go through","无法通过的"],["nocturnal","happening at night","夜间的"],["peculiar","strange; not usual","奇特的"]],"think":["到目前为止，你觉得最可疑的是谁？","So far, who seems most suspicious to you?"],"wordCount":358},{"text":"“When you combine the ideas of whistles at night, the presence of a band of gipsies who are on intimate terms with this old doctor, the fact that we have every reason to believe that the doctor has an interest in preventing his stepdaughter’s marriage, the dying allusion to a band, and, finally, the fact that Miss Helen Stoner heard a metallic clang, which might have been caused by one of those metal bars that secured the shutters falling back into its place, I think that there is good ground to think that the mystery may be cleared along those lines.”\n\n“But what, then, did the gipsies do?”\n\n“I cannot imagine.”\n\n“I see many objections to any such theory.”\n\n“And so do I. It is precisely for that reason that we are going to Stoke Moran this day. I want to see whether the objections are fatal, or if they may be explained away. But what in the name of the devil!”\n\nThe ejaculation had been drawn from my companion by the fact that our door had been suddenly dashed open, and that a huge man had framed himself in the aperture. His costume was a peculiar mixture of the professional and of the agricultural, having a black top-hat, a long frock-coat, and a pair of high gaiters, with a hunting-crop swinging in his hand. So tall was he that his hat actually brushed the cross bar of the doorway, and his breadth seemed to span it across from side to side. A large face, seared with a thousand wrinkles, burned yellow with the sun, and marked with every evil passion, was turned from one to the other of us, while his deep-set, bile-shot eyes, and his high, thin, fleshless nose, gave him somewhat the resemblance to a fierce old bird of prey.\n\n“Which of you is Holmes?” asked this apparition.\n\n“My name, sir; but you have the advantage of me,” said my companion quietly.\n\n“I am Dr. Grimesby Roylott, of Stoke Moran.”\n\n“Indeed, Doctor,” said Holmes blandly. “Pray take a seat.”\n\n“I will do nothing of the kind. My stepdaughter has been here. I have traced her. What has she been saying to you?”","words":[["allusion","a brief mention of something","暗指；提及"],["clang","a loud, ringing metal sound","当啷一声"],["objections","reasons for not agreeing","反对的理由"],["ejaculation","a sudden short cry","突然的喊叫"],["aperture","an opening","开口；孔"],["gaiters","cloth or leather covers for the lower legs","绑腿"],["hunting-crop","a short stiff whip used in riding","猎鞭"],["apparition","someone who appears so suddenly they seem like a ghost","突然出现的人；像幽灵一样"]],"think":["突然闯进来的这个人，给你什么感觉？","What is your first impression of the man who bursts in?"],"wordCount":365},{"text":"“It is a little cold for the time of the year,” said Holmes.\n\n“What has she been saying to you?” screamed the old man furiously.\n\n“But I have heard that the crocuses promise well,” continued my companion imperturbably.\n\n“Ha! You put me off, do you?” said our new visitor, taking a step forward and shaking his hunting-crop. “I know you, you scoundrel! I have heard of you before. You are Holmes, the meddler.”\n\nMy friend smiled.\n\n“Holmes, the busybody!”\n\nHis smile broadened.\n\n“Holmes, the Scotland Yard Jack-in-office!”\n\nHolmes chuckled heartily. “Your conversation is most entertaining,” said he. “When you go out close the door, for there is a decided draught.”\n\n“I will go when I have had my say. Don’t you dare to meddle with my affairs. I know that Miss Stoner has been here. I traced her! I am a dangerous man to fall foul of! See here.” He stepped swiftly forward, seized the poker, and bent it into a curve with his huge brown hands.\n\n“See that you keep yourself out of my grip,” he snarled, and hurling the twisted poker into the fireplace he strode out of the room.\n\n“He seems a very amiable person,” said Holmes, laughing. “I am not quite so bulky, but if he had remained I might have shown him that my grip was not much more feeble than his own.” As he spoke he picked up the steel poker and, with a sudden effort, straightened it out again.\n\n“Fancy his having the insolence to confound me with the official detective force! This incident gives zest to our investigation, however, and I only trust that our little friend will not suffer from her imprudence in allowing this brute to trace her. And now, Watson, we shall order breakfast, and afterwards I shall walk down to Doctors’ Commons, where I hope to get some data which may help us in this matter.”\n\nIt was nearly one o’clock when Sherlock Holmes returned from his excursion. He held in his hand a sheet of blue paper, scrawled over with notes and figures.","words":[["crocuses","small spring flowers","番红花"],["imperturbably","staying calm; not getting flustered","沉着地；不动声色地"],["scoundrel","a bad, dishonest person","无赖；恶棍"],["meddler","someone who interferes in other people’s business","爱管闲事的人"],["draught","a cold flow of air (also spelled draft)","过堂风"],["poker","a metal rod for stirring a fire","火钳"],["insolence","rude, insulting boldness","傲慢无礼"],["imprudence","a careless or unwise act","不谨慎；轻率"]],"think":["福尔摩斯为什么不直接回答医生的问题？","Why doesn’t Holmes answer the doctor’s question at once?"],"wordCount":346},{"text":"“I have seen the will of the deceased wife,” said he. “To determine its exact meaning I have been obliged to work out the present prices of the investments with which it is concerned. The total income, which at the time of the wife’s death was little short of £ 1,100, is now, through the fall in agricultural prices, not more than £ 750. Each daughter can claim an income of £ 250, in case of marriage. It is evident, therefore, that if both girls had married, this beauty would have had a mere pittance, while even one of them would cripple him to a very serious extent. My morning’s work has not been wasted, since it has proved that he has the very strongest motives for standing in the way of anything of the sort. And now, Watson, this is too serious for dawdling, especially as the old man is aware that we are interesting ourselves in his affairs; so if you are ready, we shall call a cab and drive to Waterloo. I should be very much obliged if you would slip your revolver into your pocket. An Eley’s No. 2 is an excellent argument with gentlemen who can twist steel pokers into knots. That and a tooth-brush are, I think, all that we need.”\n\nAt Waterloo we were fortunate in catching a train for Leatherhead, where we hired a trap at the station inn and drove for four or five miles through the lovely Surrey lanes. It was a perfect day, with a bright sun and a few fleecy clouds in the heavens. The trees and wayside hedges were just throwing out their first green shoots, and the air was full of the pleasant smell of the moist earth. To me at least there was a strange contrast between the sweet promise of the spring and this sinister quest upon which we were engaged. My companion sat in the front of the trap, his arms folded, his hat pulled down over his eyes, and his chin sunk upon his breast, buried in the deepest thought. Suddenly, however, he started, tapped me on the shoulder, and pointed over the meadows.\n\n“Look there!” said he.","words":[["deceased","dead; the person who has died","已故的"],["investments","money put into things that may grow in value","投资"],["pittance","a very small amount of money","微薄的一点钱"],["motives","reasons that make someone act","动机"],["dawdling","moving slowly; wasting time","磨蹭"],["revolver","a handgun with a revolving cylinder","左轮手枪"],["obliged","had to; was forced to","不得不；只好"],["tooth-brush","the usual spelling today is toothbrush","牙刷"]],"think":["遗嘱里的钱为什么可能很重要？","Why might the money in the will matter?"],"wordCount":366},{"text":"A heavily timbered park stretched up in a gentle slope, thickening into a grove at the highest point. From amid the branches there jutted out the grey gables and high roof-tree of a very old mansion.\n\n“Stoke Moran?” said he.\n\n“Yes, sir, that be the house of Dr. Grimesby Roylott,” remarked the driver.\n\n“There is some building going on there,” said Holmes; “that is where we are going.”\n\n“There’s the village,” said the driver, pointing to a cluster of roofs some distance to the left; “but if you want to get to the house, you’ll find it shorter to get over this stile, and so by the footpath over the fields. There it is, where the lady is walking.”\n\n“And the lady, I fancy, is Miss Stoner,” observed Holmes, shading his eyes. “Yes, I think we had better do as you suggest.”\n\nWe got off, paid our fare, and the trap rattled back on its way to Leatherhead.\n\n“I thought it as well,” said Holmes as we climbed the stile, “that this fellow should think we had come here as architects, or on some definite business. It may stop his gossip. Good-afternoon, Miss Stoner. You see that we have been as good as our word.”\n\nOur client of the morning had hurried forward to meet us with a face which spoke her joy. “I have been waiting so eagerly for you,” she cried, shaking hands with us warmly. “All has turned out splendidly. Dr. Roylott has gone to town, and it is unlikely that he will be back before evening.”\n\n“We have had the pleasure of making the Doctor’s acquaintance,” said Holmes, and in a few words he sketched out what had occurred. Miss Stoner turned white to the lips as she listened.\n\n“Good heavens!” she cried, “he has followed me, then.”\n\n“So it appears.”\n\n“He is so cunning that I never know when I am safe from him. What will he say when he returns?”","words":[["timbered","wooded; with many trees","树木茂密的"],["mansion","a very large house","宅邸；大宅"],["roof-tree","the main beam of a roof; here, the roofline","屋脊"],["cluster","a small group close together","一簇；一小群"],["footpath","a narrow path for walking","小路；步行道"],["architects","people who design buildings","建筑师"],["definite","clear and certain","明确的"],["eagerly","with keen interest; keen to begin","急切地"]],"think":["斯托克莫兰这地方看起来怎样？","What does Stoke Moran look like to you?"],"wordCount":326},{"text":"“He must guard himself, for he may find that there is someone more cunning than himself upon his track. You must lock yourself up from him to-night. If he is violent, we shall take you away to your aunt’s at Harrow. Now, we must make the best use of our time, so kindly take us at once to the rooms which we are to examine.”\n\nThe building was of grey, lichen-blotched stone, with a high central portion and two curving wings, like the claws of a crab, thrown out on each side. In one of these wings the windows were broken and blocked with wooden boards, while the roof was partly caved in, a picture of ruin. The central portion was in little better repair, but the right-hand block was comparatively modern, and the blinds in the windows, with the blue smoke curling up from the chimneys, showed that this was where the family resided. Some scaffolding had been erected against the end wall, and the stone-work had been broken into, but there were no signs of any workmen at the moment of our visit. Holmes walked slowly up and down the ill-trimmed lawn and examined with deep attention the outsides of the windows.\n\n“This, I take it, belongs to the room in which you used to sleep, the centre one to your sister’s, and the one next to the main building to Dr. Roylott’s chamber?”\n\n“Exactly so. But I am now sleeping in the middle one.”\n\n“Pending the alterations, as I understand. By the way, there does not seem to be any very pressing need for repairs at that end wall.”\n\n“There were none. I believe that it was an excuse to move me from my room.”\n\n“Ah! that is suggestive. Now, on the other side of this narrow wing runs the corridor from which these three rooms open. There are windows in it, of course?”\n\n“Yes, but very small ones. Too narrow for anyone to pass through.”\n\n“As you both locked your doors at night, your rooms were unapproachable from that side. Now, would you have the kindness to go into your room and bar your shutters?”","words":[["cunning","clever in a sly way","狡猾的"],["lichen-blotched","marked with patches of lichen (a crusty plant on stone)","长着一片片地衣的"],["scaffolding","temporary poles and boards used by builders","脚手架"],["erected","put up; built","竖起；搭建"],["ill-trimmed","not cut neatly","修剪得不整齐"],["Pending","while waiting for something to be finished","在……期间；尚未完成"],["alterations","changes made to a building","改建；改动"],["exactly","used here to agree: “that’s right”","正是；没错"]],"think":["房子外面有什么看起来不对劲？","What seems odd about the outside of the house?"],"wordCount":359},{"text":"Miss Stoner did so, and Holmes, after a careful examination through the open window, endeavoured in every way to force the shutter open, but without success. There was no slit through which a knife could be passed to raise the bar. Then with his lens he tested the hinges, but they were of solid iron, built firmly into the massive masonry. “Hum!” said he, scratching his chin in some perplexity, “my theory certainly presents some difficulties. No one could pass these shutters if they were bolted. Well, we shall see if the inside throws any light upon the matter.”\n\nA small side door led into the whitewashed corridor from which the three bedrooms opened. Holmes refused to examine the third chamber, so we passed at once to the second, that in which Miss Stoner was now sleeping, and in which her sister had met with her fate. It was a homely little room, with a low ceiling and a gaping fireplace, after the fashion of old country-houses. A brown chest of drawers stood in one corner, a narrow white-counterpaned bed in another, and a dressing-table on the left-hand side of the window. These articles, with two small wicker-work chairs, made up all the furniture in the room save for a square of Wilton carpet in the centre. The boards round and the panelling of the walls were of brown, worm-eaten oak, so old and discoloured that it may have dated from the original building of the house. Holmes drew one of the chairs into a corner and sat silent, while his eyes travelled round and round and up and down, taking in every detail of the apartment.\n\n“Where does that bell communicate with?” he asked at last pointing to a thick bell-rope which hung down beside the bed, the tassel actually lying upon the pillow.\n\n“It goes to the housekeeper’s room.”\n\n“It looks newer than the other things?”\n\n“Yes, it was only put there a couple of years ago.”\n\n“Your sister asked for it, I suppose?”\n\n“No, I never heard of her using it. We used always to get what we wanted for ourselves.”","words":[["endeavoured","tried hard","努力试图"],["masonry","stone or brick work","石工；砖石结构"],["perplexity","the feeling of being puzzled","困惑"],["whitewashed","painted with a cheap white coating","刷了白灰的"],["wicker-work","woven from thin sticks, like a basket","柳条编织的"],["panelling","wooden boards covering a wall","木墙板"],["worm-eaten","full of little holes made by insects","虫蛀的"],["discoloured","faded or stained, no longer the old colour","褪色的；变色的"]],"think":["海伦房间里，有什么看起来普通、其实值得注意？","What in Helen’s room looks ordinary but might matter?"],"wordCount":354},{"text":"“Indeed, it seemed unnecessary to put so nice a bell-pull there. You will excuse me for a few minutes while I satisfy myself as to this floor.” He threw himself down upon his face with his lens in his hand and crawled swiftly backward and forward, examining minutely the cracks between the boards. Then he did the same with the wood-work with which the chamber was panelled. Finally he walked over to the bed and spent some time in staring at it and in running his eye up and down the wall. Finally he took the bell-rope in his hand and gave it a brisk tug.\n\n“Why, it’s a dummy,” said he.\n\n“Won’t it ring?”\n\n“No, it is not even attached to a wire. This is very interesting. You can see now that it is fastened to a hook just above where the little opening for the ventilator is.”\n\n“How very absurd! I never noticed that before.”\n\n“Very strange!” muttered Holmes, pulling at the rope. “There are one or two very singular points about this room. For example, what a fool a builder must be to open a ventilator into another room, when, with the same trouble, he might have communicated with the outside air!”\n\n“That is also quite modern,” said the lady.\n\n“Done about the same time as the bell-rope?” remarked Holmes.\n\n“Yes, there were several little changes carried out about that time.”\n\n“They seem to have been of a most interesting character—dummy bell-ropes, and ventilators which do not ventilate. With your permission, Miss Stoner, we shall now carry our researches into the inner apartment.”\n\nDr. Grimesby Roylott’s chamber was larger than that of his step-daughter, but was as plainly furnished. A camp-bed, a small wooden shelf full of books, mostly of a technical character, an armchair beside the bed, a plain wooden chair against the wall, a round table, and a large iron safe were the principal things which met the eye. Holmes walked slowly round and examined each and all of them with the keenest interest.\n\n“What’s in here?” he asked, tapping the safe.\n\n“My stepfather’s business papers.”\n\n“Oh! you have seen inside, then?”\n\n“Only once, some years ago. I remember that it was full of papers.”","words":[["bell-pull","a rope or cord you pull to ring a servant’s bell","拉铃绳"],["minutely","very carefully, in tiny detail","非常仔细地"],["ventilator","a small opening for air to pass through","通气口"],["muttered","spoke quietly, almost to himself","低声嘀咕"],["dummy","not real; it does not actually work","假的；不起作用的"],["communicated","was connected with","相通；连接"],["unnecessary","not needed","没有必要的"],["builder","a person who constructs houses","建筑工人；建造者"]],"think":["那根拉铃绳有什么不对劲？","What is odd about the bell-pull?"],"wordCount":370},{"text":"“There isn’t a cat in it, for example?”\n\n“No. What a strange idea!”\n\n“Well, look at this!” He took up a small saucer of milk which stood on the top of it.\n\n“No; we don’t keep a cat. But there is a cheetah and a baboon.”\n\n“Ah, yes, of course! Well, a cheetah is just a big cat, and yet a saucer of milk does not go very far in satisfying its wants, I daresay. There is one point which I should wish to determine.” He squatted down in front of the wooden chair and examined the seat of it with the greatest attention.\n\n“Thank you. That is quite settled,” said he, rising and putting his lens in his pocket. “Hullo! Here is something interesting!”\n\nThe object which had caught his eye was a small dog lash hung on one corner of the bed. The lash, however, was curled upon itself and tied so as to make a loop of whipcord.\n\n“What do you make of that, Watson?”\n\n“It’s a common enough lash. But I don’t know why it should be tied.”\n\n“That is not quite so common, is it? Ah, me! it’s a wicked world, and when a clever man turns his brains to crime it is the worst of all. I think that I have seen enough now, Miss Stoner, and with your permission we shall walk out upon the lawn.”\n\nI had never seen my friend’s face so grim or his brow so dark as it was when we turned from the scene of this investigation. We had walked several times up and down the lawn, neither Miss Stoner nor myself liking to break in upon his thoughts before he roused himself from his reverie.\n\n“It is very essential, Miss Stoner,” said he, “that you should absolutely follow my advice in every respect.”\n\n“I shall most certainly do so.”\n\n“The matter is too serious for any hesitation. Your life may depend upon your compliance.”\n\n“I assure you that I am in your hands.”\n\n“In the first place, both my friend and I must spend the night in your room.”\n\nBoth Miss Stoner and I gazed at him in astonishment.","words":[["saucer","a small shallow dish, usually under a cup","茶碟；浅碟"],["daresay","I suppose; I think it is likely","我看大概是"],["squatted","crouched down close to the floor","蹲下"],["whipcord","a strong, thin cord","细而结实的绳子"],["reverie","a daydream; deep thought","出神；沉思"],["essential","necessary; you cannot do without it","必不可少的"],["compliance","doing as asked","依从；照办"],["astonishment","great surprise","震惊；大为吃惊"]],"think":["保险箱旁边那碟牛奶，可能是干什么用的？","What might the saucer of milk be for?"],"wordCount":362},{"text":"“Yes, it must be so. Let me explain. I believe that that is the village inn over there?”\n\n“Yes, that is the Crown.”\n\n“Very good. Your windows would be visible from there?”\n\n“Certainly.”\n\n“You must confine yourself to your room, on pretence of a headache, when your stepfather comes back. Then when you hear him retire for the night, you must open the shutters of your window, undo the hasp, put your lamp there as a signal to us, and then withdraw quietly with everything which you are likely to want into the room which you used to occupy. I have no doubt that, in spite of the repairs, you could manage there for one night.”\n\n“Oh, yes, easily.”\n\n“The rest you will leave in our hands.”\n\n“But what will you do?”\n\n“We shall spend the night in your room, and we shall investigate the cause of this noise which has disturbed you.”\n\n“I believe, Mr. Holmes, that you have already made up your mind,” said Miss Stoner, laying her hand upon my companion’s sleeve.\n\n“Perhaps I have.”\n\n“Then, for pity’s sake, tell me what was the cause of my sister’s death.”\n\n“I should prefer to have clearer proofs before I speak.”\n\n“You can at least tell me whether my own thought is correct, and if she died from some sudden fright.”\n\n“No, I do not think so. I think that there was probably some more tangible cause. And now, Miss Stoner, we must leave you for if Dr. Roylott returned and saw us our journey would be in vain. Good-bye, and be brave, for if you will do what I have told you, you may rest assured that we shall soon drive away the dangers that threaten you.”","words":[["confine","to stay within a place","使限制在；待在……里"],["pretence","a made-up reason; pretending","借口；装作"],["withdraw","to leave quietly","退出；离开"],["investigate","to look into something carefully","调查"],["tangible","real enough to touch or clearly prove","切实的；可抓住的"],["assured","told someone firmly, to make them feel safe","保证；让人放心"],["threaten","to put in danger","威胁"],["headache","a pain in the head","头痛"]],"think":["福尔摩斯为什么让海伦今晚锁好自己的房间？","Why does Holmes ask Helen to lock her room tonight?"],"wordCount":289},{"text":"Sherlock Holmes and I had no difficulty in engaging a bedroom and sitting-room at the Crown Inn. They were on the upper floor, and from our window we could command a view of the avenue gate, and of the inhabited wing of Stoke Moran Manor House. At dusk we saw Dr. Grimesby Roylott drive past, his huge form looming up beside the little figure of the lad who drove him. The boy had some slight difficulty in undoing the heavy iron gates, and we heard the hoarse roar of the Doctor’s voice and saw the fury with which he shook his clinched fists at him. The trap drove on, and a few minutes later we saw a sudden light spring up among the trees as the lamp was lit in one of the sitting-rooms.\n\n“Do you know, Watson,” said Holmes as we sat together in the gathering darkness, “I have really some scruples as to taking you to-night. There is a distinct element of danger.”\n\n“Can I be of assistance?”\n\n“Your presence might be invaluable.”\n\n“Then I shall certainly come.”\n\n“It is very kind of you.”\n\n“You speak of danger. You have evidently seen more in these rooms than was visible to me.”\n\n“No, but I fancy that I may have deduced a little more. I imagine that you saw all that I did.”\n\n“I saw nothing remarkable save the bell-rope, and what purpose that could answer I confess is more than I can imagine.”\n\n“You saw the ventilator, too?”\n\n“Yes, but I do not think that it is such a very unusual thing to have a small opening between two rooms. It was so small that a rat could hardly pass through.”\n\n“I knew that we should find a ventilator before ever we came to Stoke Moran.”\n\n“My dear Holmes!”\n\n“Oh, yes, I did. You remember in her statement she said that her sister could smell Dr. Roylott’s cigar. Now, of course that suggested at once that there must be a communication between the two rooms. It could only be a small one, or it would have been remarked upon at the coroner’s inquiry. I deduced a ventilator.”\n\n“But what harm can there be in that?”","words":[["engaging","booking; taking (a room)","订下（房间）"],["looming","appearing large and dark, often in a worrying way","赫然耸现"],["clinched","settled; made certain","敲定；决定了"],["scruples","feelings of doubt about whether something is right","顾虑；犹豫"],["invaluable","extremely useful","非常宝贵的"],["deduced","worked out by reasoning","推断出"],["confess","to admit something","承认"],["purpose","the reason something is made or done","用途；目的"]],"think":["沃森为什么愿意一起守夜？","Why is Watson willing to keep watch too?"],"wordCount":367},{"text":"“Well, there is at least a curious coincidence of dates. A ventilator is made, a cord is hung, and a lady who sleeps in the bed dies. Does not that strike you?”\n\n“I cannot as yet see any connection.”\n\n“Did you observe anything very peculiar about that bed?”\n\n“No.”\n\n“It was clamped to the floor. Did you ever see a bed fastened like that before?”\n\n“I cannot say that I have.”\n\n“The lady could not move her bed. It must always be in the same relative position to the ventilator and to the rope—or so we may call it, since it was clearly never meant for a bell-pull.”\n\n“Holmes,” I cried, “I seem to see dimly what you are hinting at. We are only just in time to prevent some subtle and horrible crime.”\n\n“Subtle enough and horrible enough. When a doctor does go wrong he is the first of criminals. He has nerve and he has knowledge. Palmer and Pritchard were among the heads of their profession. This man strikes even deeper, but I think, Watson, that we shall be able to strike deeper still. But we shall have horrors enough before the night is over; for goodness’ sake let us have a quiet pipe and turn our minds for a few hours to something more cheerful.”\n\nAbout nine o’clock the light among the trees was extinguished, and all was dark in the direction of the Manor House. Two hours passed slowly away, and then, suddenly, just at the stroke of eleven, a single bright light shone out right in front of us.\n\n“That is our signal,” said Holmes, springing to his feet; “it comes from the middle window.”\n\nAs we passed out he exchanged a few words with the landlord, explaining that we were going on a late visit to an acquaintance, and that it was possible that we might spend the night there. A moment later we were out on the dark road, a chill wind blowing in our faces, and one yellow light twinkling in front of us through the gloom to guide us on our sombre errand.","words":[["coincidence","two things happening together by chance","巧合"],["clamped","fixed firmly, so it cannot move","夹紧；固定住"],["hinting","suggesting something without saying it fully","暗示"],["criminals","people who commit crimes","罪犯"],["Pritchard","a real 19th-century poisoner Holmes mentions","普里查德（福尔摩斯提到的投毒者）"],["extinguished","put out (a light or fire)","熄灭"],["sombre","dark and serious","阴沉的"],["gloom","darkness","黑暗；幽暗"]],"think":["床被固定在地板上，可能是为了什么？","Why might the bed be clamped to the floor?"],"wordCount":352},{"text":"There was little difficulty in entering the grounds, for unrepaired breaches gaped in the old park wall. Making our way among the trees, we reached the lawn, crossed it, and were about to enter through the window when out from a clump of laurel bushes there darted what seemed to be a hideous and distorted child, who threw itself upon the grass with writhing limbs and then ran swiftly across the lawn into the darkness.\n\n“My God!” I whispered; “did you see it?”\n\nHolmes was for the moment as startled as I. His hand closed like a vice upon my wrist in his agitation. Then he broke into a low laugh and put his lips to my ear.\n\n“It is a nice household,” he murmured. “That is the baboon.”\n\nI had forgotten the strange pets which the Doctor affected. There was a cheetah, too; perhaps we might find it upon our shoulders at any moment. I confess that I felt easier in my mind when, after following Holmes’ example and slipping off my shoes, I found myself inside the bedroom. My companion noiselessly closed the shutters, moved the lamp onto the table, and cast his eyes round the room. All was as we had seen it in the daytime. Then creeping up to me and making a trumpet of his hand, he whispered into my ear again so gently that it was all that I could do to distinguish the words:\n\n“The least sound would be fatal to our plans.”\n\nI nodded to show that I had heard.\n\n“We must sit without light. He would see it through the ventilator.”\n\nI nodded again.\n\n“Do not go asleep; your very life may depend upon it. Have your pistol ready in case we should need it. I will sit on the side of the bed, and you in that chair.”\n\nI took out my revolver and laid it on the corner of the table.\n\nHolmes had brought up a long thin cane, and this he placed upon the bed beside him. By it he laid the box of matches and the stump of a candle. Then he turned down the lamp, and we were left in darkness.","words":[["breaches","gaps or broken places","缺口；破口"],["hideous","very ugly and horrible","可怕的；丑陋的"],["distorted","twisted out of its usual shape","扭曲的"],["writhing","twisting as if in pain","扭动着"],["startled","suddenly surprised and a little scared","吓了一跳"],["noiselessly","without making a sound","悄悄地；无声地"],["trumpet","a brass musical instrument with a clear, loud sound","小号"],["revolver","a handgun","左轮手枪"]],"think":["他们悄悄走进园子时，你紧张吗？","How do you feel as they slip into the grounds?"],"wordCount":365},{"text":"How shall I ever forget that dreadful vigil? I could not hear a sound, not even the drawing of a breath, and yet I knew that my companion sat open-eyed, within a few feet of me, in the same state of nervous tension in which I was myself. The shutters cut off the least ray of light, and we waited in absolute darkness.\n\nFrom outside came the occasional cry of a night-bird, and once at our very window a long drawn catlike whine, which told us that the cheetah was indeed at liberty. Far away we could hear the deep tones of the parish clock, which boomed out every quarter of an hour. How long they seemed, those quarters! Twelve struck, and one and two and three, and still we sat waiting silently for whatever might befall.\n\nSuddenly there was the momentary gleam of a light up in the direction of the ventilator, which vanished immediately, but was succeeded by a strong smell of burning oil and heated metal. Someone in the next room had lit a dark-lantern. I heard a gentle sound of movement, and then all was silent once more, though the smell grew stronger. For half an hour I sat with straining ears. Then suddenly another sound became audible—a very gentle, soothing sound, like that of a small jet of steam escaping continually from a kettle. The instant that we heard it, Holmes sprang from the bed, struck a match, and lashed furiously with his cane at the bell-pull.\n\n“You see it, Watson?” he yelled. “You see it?”","words":[["tension","a tight, nervous feeling","紧张"],["absolute","complete; total","完全的"],["momentary","lasting only a moment","片刻的"],["vanished","disappeared","消失了"],["dark-lantern","a lamp you can cover, so the light can be hidden","遮光提灯"],["audible","loud enough to be heard","听得见的"],["soothing","calm and gentle","安抚的；温和的"],["furiously","with wild energy or anger","猛烈地；狂怒地"]],"think":["在黑暗中等待时，你最会留心什么声音？","In the dark, which sound would you listen for most?"],"wordCount":261},{"text":"But I saw nothing. At the moment when Holmes struck the light I heard a low, clear whistle, but the sudden glare flashing into my weary eyes made it impossible for me to tell what it was at which my friend lashed so savagely. I could, however, see that his face was deadly pale and filled with horror and loathing. He had ceased to strike and was gazing up at the ventilator when suddenly there broke from the silence of the night the most horrible cry to which I have ever listened. It swelled up louder and louder, a hoarse yell of pain and fear and anger all mingled in the one dreadful shriek. They say that away down in the village, and even in the distant parsonage, that cry raised the sleepers from their beds. It struck cold to our hearts, and I stood gazing at Holmes, and he at me, until the last echoes of it had died away into the silence from which it rose.\n\n“What can it mean?” I gasped.\n\n“It means that it is all over,” Holmes answered. “And perhaps, after all, it is for the best. Take your pistol, and we will enter Dr. Roylott’s room.”\n\nWith a grave face he lit the lamp and led the way down the corridor. Twice he struck at the chamber door without any reply from within. Then he turned the handle and entered, I at his heels, with the cocked pistol in my hand.\n\nIt was a singular sight which met our eyes. On the table stood a dark-lantern with the shutter half open, throwing a brilliant beam of light upon the iron safe, the door of which was ajar. Beside this table, on the wooden chair, sat Dr. Grimesby Roylott clad in a long grey dressing-gown, his bare ankles protruding beneath, and his feet thrust into red heelless Turkish slippers. Across his lap lay the short stock with the long lash which we had noticed during the day. His chin was cocked upward and his eyes were fixed in a dreadful, rigid stare at the corner of the ceiling. Round his brow he had a peculiar yellow band, with brownish speckles, which seemed to be bound tightly round his head. As we entered he made neither sound nor motion.","words":[["flashing","shining out suddenly","突然亮起"],["savagely","in a fierce, violent way","凶猛地"],["loathing","a strong feeling of disgust","厌恶"],["swelled","grew louder or larger","增强；膨胀"],["mingled","mixed together","混在一起"],["parsonage","the house of a parish priest","牧师住所"],["dressing-gown","a long robe worn over night clothes","晨衣；睡袍"],["protruding","sticking out","凸出；伸出来"]],"think":["福尔摩斯打亮灯之后，房间里是什么情形？","What do you see when Holmes flashes the light?"],"wordCount":383},{"text":"“The band! the speckled band!” whispered Holmes.\n\nI took a step forward. In an instant his strange headgear began to move, and there reared itself from among his hair the squat diamond-shaped head and puffed neck of a loathsome serpent.\n\n“It is a swamp adder!” cried Holmes; “the deadliest snake in India. He has died within ten seconds of being bitten. Violence does, in truth, recoil upon the violent, and the schemer falls into the pit which he digs for another. Let us thrust this creature back into its den, and we can then remove Miss Stoner to some place of shelter and let the county police know what has happened.”\n\nAs he spoke he drew the dog-whip swiftly from the dead man’s lap, and throwing the noose round the reptile’s neck he drew it from its horrid perch and, carrying it at arm’s length, threw it into the iron safe, which he closed upon it.\n\nSuch are the true facts of the death of Dr. Grimesby Roylott, of Stoke Moran. It is not necessary that I should prolong a narrative which has already run to too great a length by telling how we broke the sad news to the terrified girl, how we conveyed her by the morning train to the care of her good aunt at Harrow, of how the slow process of official inquiry came to the conclusion that the doctor met his fate while indiscreetly playing with a dangerous pet. The little which I had yet to learn of the case was told me by Sherlock Holmes as we travelled back next day.","words":[["headgear","something worn on the head","头上的东西；头饰"],["loathsome","disgusting; horrible","令人恶心的"],["serpent","a snake","蛇"],["swamp adder","a dea const T={

};
function remain(){

  return T.left;
}
function mmss(sec){
  sec=Math.max(0,sec|0);
  return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
function startTimer(){
  if(T.running)return;
  if(T.left<=0)T.left=SESSION*60;
  T.running=true;
  T.endAt=Date.now()+T.left*1000;
  loop();
  render();
}
function pauseTimer(){
  if(!T.running)return;
  T.left=remain();
  T.running=false;
  clearTimeout(T.tick);
  render();
}
function finishTimer(){
  const left=remain();
  const elapsed=Math.max(0,SESSION*60-left);
  T.running=false;
  clearTimeout(T.tick);
  T.left=SESSION*60;
  T.endAt=0;
  if(elapsed<=0){toast('还没开始计时 Timer has not started');render();return;}
  const mins=Math.max(1,Math.round(elapsed/60));
  addMinutes(mins, left<=0?'读完 10 分钟 10 minutes done':'已记录 Logged');
}
function loop(){
  clearTimeout(T.tick);
  const r=remain();
  const el=document.getElementById('clock');
  if(el){
    el.textContent=mmss(r);
    el.className='timer '+(T.running?'run':(r<SESSION*60?'pause':''));
  }
  if(!T.running)return;
  if(r<=0){
    if(navigator.vibrate)navigator.vibrate([200,80,200]);
    finishTimer();
    return;
  }
  T.tick=setTimeout(loop,250);
}
function addMinutes(n,why){

  S.minutes[d]=(S.minutes[d]||0)+n;
  const should=Math.floor(S.minutes[d]/10)*10;
  const got=S.awarded[d]||0;
  const add=should-got;
  if(add>0){S.xp+=add;S.awarded[d]=should;toast('+'+add+' XP '+(why||''));}

  save();checkBadges();render();
}

function wrapRead(text,words){

    const forms=[term,term.replace(/'/g,'\u2019'),term.replace(/\u2019/g,"'")];

    for(const t of forms){
      const cand=new RegExp('(^|[^A-Za-z])('+escapeRe(t)+')(?![A-Za-z])','i');

      return pre+'<button type="button" class="w" data-en="'+esc(en)+'" data-zh="'+esc(zh)+'" onclick="showWord(this)">'+word+'</button>';

function openDB(){

    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        const st=db.createObjectStore(DB_STORE,{keyPath:'id',autoIncrement:true});
        st.createIndex('day','day',{unique:false});

  });

}
async function startRec(){
  if(R.recing){stopRec();return;}
  if(!window.isSecureContext){toast('录音需要安全网页 Recording needs https');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('这台手机不支持网页录音 This phone cannot record in the browser');return;}
  if(typeof MediaRecorder==='undefined'){toast('系统版本太旧，无法录音 MediaRecorder is not supported');return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    const mime=pickMime();
    let rec;
    try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
    catch(e){rec=new MediaRecorder(stream)}
    R.stream=stream;R.rec=rec;R.chunks=[];R.mime=rec.mimeType||mime||'';R.t0=Date.now();R.recing=true;
    rec.ondataavailable=e=>{if(e.data&&e.data.size)R.chunks.push(e.data)};
    rec.onerror=()=>{toast('录音出错 Recording error');stopRec()};
    rec.onstop=onRecStop;
    try{rec.start(250)}catch(e){rec.start()}
    const btn=document.getElementById('recBtn');
    if(btn){btn.textContent='停止 Stop';btn.className='btn warn'}
    const box=document.getElementById('recClock');
    if(box){box.className='recclock on';box.textContent='00:00'}
    recClock();
    toast('开始录音 Recording…');
  }catch(e){
    const name=e&&e.name||'';
    if(name==='NotAllowedError'||name==='PermissionDeniedError') toast('请允许麦克风 Please allow the microphone in Settings');
    else if(name==='NotFoundError') toast('没有找到麦克风 No microphone found');
    else toast('无法打开麦克风 Cannot open the microphone');
  }
}
function stopRec(){
  if(!R.recing)return;
  clearTimeout(R.tick);
  try{if(R.rec&&R.rec.state!=='inactive')R.rec.stop()}catch(e){onRecStop()}
}
function onRecStop(){
  clearTimeout(R.tick);
  const chunks=R.chunks.slice();
  const mime=R.mime||(chunks[0]&&chunks[0].type)||'audio/mp4';
  const dur=Math.max(1,Math.round((Date.now()-R.t0)/1000));
  const day=S.readI;
  if(R.stream){R.stream.getTracks().forEach(t=>t.stop());R.stream=null}
  R.recing=false;R.rec=null;R.chunks=[];
  if(!chunks.length){toast('没有录到声音 Nothing was recorded');render();return;}
  const blob=new Blob(chunks,{type:mime||'audio/mp4'});
  if(blob.size<200){toast('录音太短了 That recording was too short');render();return;}
  R.lastBlob=blob;
  if(R.lastUrl) URL.revokeObjectURL(R.lastUrl);
  R.lastUrl=URL.createObjectURL(blob);
  saveRec({day,created:Date.now(),mime,duration:dur,blob}).then(()=>{
    completeExcerpt(day);
    return refreshRecs();
  }).then(()=>render()).catch(e=>{
    toast('录音存不下了 Could not save the recording');
    render();
  });
}
function completeExcerpt(i){
  S.readDone[i]=true;
  if(!S.readAwarded[i]){
    S.readAwarded[i]=true;
    S.xp+=10;
    const d=today();
    S.minutes[d]=(S.minutes[d]||0)+10;
    S.awarded[d]=(S.awarded[d]||0)+10;
    toast('+10 XP 读完并录音 Read and recorded');
  }else toast('录音已保存 Recording saved');
  const n=Object.keys(S.readAwarded).filter(k=>S.readAwarded[k]).length;
  if(n>=1) S.badges.firstRec=true;
  if(n>=7) S.badges.excerpts7=true;
  save();checkBadges();
}
function recFile(r){
  const ext=extFor(r.mime);
  return new File([r.blob],`speckled-day${r.day+1}.${ext}`,{type:r.mime||'audio/mp4'});
}
async function shareRec(id){
  const r=REC_CACHE.find(x=>x.id===id);
  if(!r)return;
  const file=recFile(r);
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`Day ${r.day+1} 朗读录音 Reading aloud`});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  downloadRec(id);
}
function downloadRec(id){
  const r=REC_CACHE.find(x=>x.id===id);
  if(!r)return;
  const file=recFile(r);
  const url=URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=url;a.download=file.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('如果没出现分享，请用音频条右边的分享 If nothing appears, use Share on the audio bar');
}
function recListHTML(){
  if(!REC_CACHE.length) return `<p class="sub">还没有录音。读完今日这一段后，点“录音”即可。No recordings yet. After you read today’s excerpt, tap Record.</p>`;
  const by=[...REC_CACHE].sort((a,b)=>b.created-a.created);
  return by.map(r=>{
    if(!r._url) r._url=URL.createObjectURL(r.blob);
    const url=r._url;
    const when=new Date(r.created);
    const t=when.getFullYear()+'-'+String(when.getMonth()+1).padStart(2,'0')+'-'+String(when.getDate()).padStart(2,'0')+' '+String(when.getHours()).padStart(2,'0')+':'+String(when.getMinutes()).padStart(2,'0');
    return `<div class="item"><div class="tt">第 ${r.day+1} 段 Day ${r.day+1} · ${r.duration||'?'}s</div><div class="sub">${esc(t)}</div>
      <audio controls playsinline preload="metadata" src="${url}"></audio>
      <div class="strow">
        <button onclick="shareRec(${r.id})">分享 / 下载 Share or download</button>
        <button onclick="if(confirm('删除这段录音？Delete this recording?'))deleteRec(${r.id})">删除 Delete</button>
      </div></div>`;
  }).join('');
}

  return `<div class="card" id="todayread">

      </div>
    </div>
    <div>
      <button class="btn small sec" onclick="bumpFont(-2)">A−</button>
      <button class="btn small sec" onclick="bumpFont(2)">A+</button>
      <span class="sub">字号 Font ${fs}px · 点蓝色词看意思 Tap a blue word for its meaning</span>
    </div>
    <div class="readtext" style="--rs:${fs}px;margin-top:10px">${wrapRead(ex.text,ex.words)}</div>
    <div class="hint" style="margin-top:12px">
      <div class="tt">💭 想一想 Think</div>
      <div class="prompt">${esc(ex.think[0])}<span class="en">${esc(ex.think[1])}</span></div>
      <div class="sub">想一想就好，不用写答案。Just think — no written answer needed.</div>
    </div>
    <h3>🎤 录音 Record</h3>
    <p class="sub">大声把这一段读出来。点一次开始，再点一次停止。Read this excerpt aloud. Tap once to start, tap again to stop.</p>
    <div id="recClock" class="recclock ${R.recing?'on':''}">${R.recing?mmss(Math.floor((Date.now()-R.t0)/1000)):'00:00'}</div>
    <button class="${recClass}" id="recBtn" onclick="startRec()">${recLabel}</button>
    ${!done?`<button class="btn sec" onclick="markRead()">我读完了 I've read this</button>`:'<p class="sub">✓ 已读过 This excerpt is marked as read.'+(awarded?' 已获得 +10 XP Already earned +10 XP.':' 再录一段就 +10 XP Record to earn +10 XP.')+'</p>'}
    ${last}
    <p class="sub">${hasRec||awarded?'这段已有录音 This excerpt already has a recording.':'读完并录音可获得 +10 XP。Read and record to get +10 XP.'}</p>
    <p class="sub">原文来自 Project Gutenberg 第 1661 号电子书《福尔摩斯探案集》，公版书，本页只收录这一篇。Public-domain text from Project Gutenberg ebook #1661, The Adventures of Sherlock Holmes; this page includes only this story.</p>
  </div>
  <div class="card">
    <h2>🎧 录音记录 Recordings</h2>
    <p class="sub">妈妈以后可以在这里回放。录音只存在这台手机的浏览器里。Mum can replay these later. They stay on this phone only.</p>
    <div class="reclist" id="reclist">${recListHTML()}</div>
  </div>`;
}

  app.innerHTML=`

  ${todayReadCard()}

  </div>
  <div class="card">
    <h2>🎖️ 等级与徽章 Levels & badges</h2>

      <p id="rewardTxt" style="margin:8px 0 0">${esc(S.rewardText)}</p>

document.addEventListener('visibilitychange',()=>{if(T.running)loop()});
document.addEventListener('click',e=>{if(e.target.id==='wsheet')closeSheet()});
checkBadges();
if(typeof S.readI!=='number'||S.readI<0||S.readI>=EXCERPTS.length||S.readDone[S.readI]) S.readI=firstUnfinished();
render();
refreshRecs();
</script>
