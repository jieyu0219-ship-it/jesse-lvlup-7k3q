const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

function dayRec(d){return S.days[d]||(S.days[d]={})}
function dayDone(d){const r=S.days[d];return r&&Object.keys(r).some(k=>r[k])}
function streak(){let n=0;const d=new Date();if(!dayDone(fmt(d)))d.setDate(d.getDate()-1);for(let i=0;i<400;i++){const k=fmt(d);if(dayDone(k))n++;else if(d.getDay()!==5)break;d.setDate(d.getDate()-1)}return n}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function lookup(w){w=w.toLowerCase().replace(/^'+|'+$/g,'');if(GL[w])return[w,GL[w]];
 const tries=[w.replace(/'s$/,''),w.replace(/ies$/,'y'),w.replace(/es$/,''),w.replace(/s$/,''),w.replace(/ed$/,''),w.replace(/d$/,''),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/ly$/,''),w.replace(/er$/,'')];
 for(const t of tries)if(GL[t])return[t,GL[t]];const my=S.words.find(x=>x.w.toLowerCase()===w);if(my)return[my.w,my.zh];return[w,null]}
function wrap(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('button,input,textarea,select,a,.nowrap,.w,nav,script,style'))return NodeFilter.FILTER_REJECT;return /[A-Za-z]{2,}/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const ns=[];while(walker.nextNode())ns.push(walker.currentNode);
 ns.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split(/([A-Za-z][A-Za-z'\-]*[A-Za-z]|[A-Za-z])/).forEach((part,i)=>{if(i%2&&part.length>1){const s=document.createElement('span');s.className='w';s.textContent=part;f.appendChild(s)}else f.appendChild(document.createTextNode(part))});n.parentNode.replaceChild(f,n)})}

 return `<div class="card hero"><h2>🏆 六科 A 进度 Road to 6 A's</h2><div style="font-size:40px;font-weight:900;text-align:center">${countA()} / 6</div><div class="sub" style="text-align:center">按最新一份报告算 · from the latest report entered</div></div>
 <div class="card"><h2>📊 我的六门科 My six subjects</h2><p class="sub">报告出来后，和妈妈一起点等级。名字可以改。<br>Tap your grade when each report comes out.</p>
 ${S.subjects.map((s,i)=>`<div style="margin:10px 0"><input class="nowrap" style="padding:6px 10px;font-weight:700" value="${esc(s)}" onchange="renameSubj(${i},this.value)">
 ${REPORTS.map(([k,n])=>`<div class="row" style="margin-top:4px"><span class="sub" style="width:120px;flex:none">${n}</span><div class="gsel" style="flex:1">${['A','B','C'].map(g=>`<button class="${g} ${(S.grades[s]||{})[k]===g?'on':''}" onclick="setGrade('${esc(s)}','${k}','${g}')">${g}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}
 <p class="sub">📌 依据 Evidence：2026 年 7 月 28 日选课回执——选修 Electives 是<b>视觉艺术 Visual Arts</b> 和<b>食品专题 Food in Focus</b>（后备 iSTEM、SSER；没有中文）。学校 2027 手册的必修 Compulsory：英语、数学、科学、历史、地理、体育健康 PDHPE、商业与创业 Commerce、国际研究 International Studies。这里先放六门核心课；要换成别的科（比如 Visual Arts、Commerce），直接改名字就行。</p></div>
 <div class="card"><h2>🎁 一路上的小奖励 Rewards on the way</h2>${eff.map(([n,v,m,r])=>`<div style="margin:10px 0"><div class="row"><b>${n}</b><span class="sub" style="margin-left:auto">${Math.min(v,m)}/${m}</span></div><div class="bar"><i style="width:${Math.min(100,v/m*100)}%"></i></div><div class="sub">🎁 ${r}</div></div>`).join('')}

 <div class="card"><h2>🗓️ 2027 里程碑 Milestones</h2>${MILES.map(([k,n,d])=>`<div class="mission ${S.miles[k]?'done':''}" onclick="S.miles['${k}']=!S.miles['${k}'];save();if(S.miles['${k}'])addXP(30,'里程碑 ✓');render()"><span class="chk">${S.miles[k]?'✓':''}</span><div><div class="tt">${n}</div><div class="sub">${d}</div></div><span class="xp">+30</span></div>`).join('')}</div>
 <div class="card"><h2>⚙️ 设置 Settings</h2><p class="sub">进度只存在这台手机的浏览器里 · Progress is saved on this phone only.</p>
 <select onchange="S.mode=this.value;save();render()">${[['auto','自动 Auto（按日期）'],['rest','休息周 Rest week'],['holiday','暑假 Holiday'],['term','开学 Term']].map(([v,n])=>`<option value="${v}" ${S.mode===v?'selected':''}>${n}</option>`).join('')}</select>
 <button class="btn sec" onclick="backup()">📋 复制备份码 Copy backup code</button><button class="btn sec" onclick="restore()">📥 用备份码恢复 Restore</button></div>`}
function renameSubj(i,v){const old=S.subjects[i];v=v.trim();if(!v)return;S.subjects[i]=v;if(S.grades[old]){S.grades[v]=S.grades[old];delete S.grades[old]}save();render()}
function setGrade(s,k,g){S.grades[s]=S.grades[s]||{};if(S.grades[s][k]===g)delete S.grades[s][k];else S.grades[s][k]=g;save();render();if(countA()===6)toast('🍎🎉 六门 A！去挑苹果设备！')}
function backup(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));navigator.clipboard?navigator.clipboard.writeText(c).then(()=>toast('已复制 Copied ✓'),()=>prompt('复制这段 Copy:',c)):prompt('复制这段 Copy:',c)}
function restore(){const c=prompt('粘贴备份码 Paste backup code');if(!c)return;try{S=Object.assign({},def,JSON.parse(decodeURIComponent(escape(atob(c.trim())))));save();toast('已恢复 Restored ✓');render()}catch(e){toast('备份码不对 Invalid code')}}
render();checkBadges();
